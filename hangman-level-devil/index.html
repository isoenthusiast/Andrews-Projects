<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Andrew's Game Collection — Hangman &amp; Level Devil</title>
<style>
    /* ============================================================
       Shell only. Each game ships its own <style> inside its
       <template>, so exactly one game's CSS is ever live.
       ============================================================ */
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
        margin: 0;
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        color: #e8edf7;
        background:
            radial-gradient(1200px 600px at 50% -10%, #2a1b33 0%, transparent 60%),
            radial-gradient(900px 520px at 88% 112%, #3a1620 0%, transparent 60%),
            #0b0d12;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 18px;
        overflow-x: hidden;
    }

    /* the mounted game drops straight into the page flow */
    #viewport { display: contents; }

    /* ---------------- picker ---------------- */
    #picker {
        position: fixed; inset: 0; z-index: 5;
        display: grid; place-items: center;
        padding: 26px;
        overflow: auto;
    }
    #picker[hidden] { display: none; }

    .pk { margin: auto; width: 100%; max-width: 820px; text-align: center; }
    .pk h1 {
        margin: 0;
        font-size: clamp(1.5rem, 4vw, 2.1rem);
        letter-spacing: 3px;
        font-weight: 800;
        background: linear-gradient(90deg, #ffd166, #ff7a8a, #c084fc);
        -webkit-background-clip: text; background-clip: text;
        -webkit-text-fill-color: transparent;
    }
    .pk-sub { margin: 8px 0 26px; font-size: 0.7rem; letter-spacing: 1.8px; text-transform: uppercase; color: #8b97ad; }
    .pk-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 18px; }

    .pk-card {
        display: flex; flex-direction: column; align-items: center; gap: 7px;
        padding: 26px 22px 22px;
        border-radius: 18px;
        text-align: center;
        cursor: pointer;
        color: #e8edf7;
        font-family: inherit;
        background: linear-gradient(180deg, rgba(33,30,48,0.95), rgba(14,15,22,0.95));
        border: 1px solid rgba(255,209,102,0.22);
        box-shadow: 0 16px 40px rgba(0,0,0,0.55);
        transition: transform .12s ease, border-color .2s ease, box-shadow .2s ease;
    }
    .pk-card:hover { transform: translateY(-4px); border-color: #ffd166; box-shadow: 0 20px 48px rgba(0,0,0,0.6), 0 0 26px rgba(255,122,138,0.25); }
    .pk-card:active { transform: translateY(-1px); }

    .pk-seal {
        width: 66px; height: 66px;
        display: grid; place-items: center;
        font-size: 1.5rem; font-weight: 800; letter-spacing: 1px;
        color: #fff8ea;
        text-shadow: 0 1px 3px rgba(0,0,0,0.6);
    }
    .seal-hangman {
        border-radius: 14px; font-size: 1.05rem;
        background: linear-gradient(145deg, #8b5cf6, #4c2a86);
        border: 2px solid #ffd166;
        box-shadow: 0 0 20px rgba(139,92,246,0.45);
    }
    .seal-devil {
        border-radius: 50%;
        background: linear-gradient(145deg, #e8414f, #7d1f18);
        border: 2px solid #ff9aa4;
        box-shadow: 0 0 20px rgba(232,65,79,0.45);
    }

    .pk-name { font-size: 1.2rem; font-weight: 700; letter-spacing: 2px; }
    .pk-en { font-size: 0.64rem; letter-spacing: 1.6px; text-transform: uppercase; color: #8b97ad; }
    .pk-desc { font-size: 0.8rem; color: #c3ccdd; line-height: 1.65; margin-top: 5px; }
    .pk-tag {
        margin-top: 5px;
        font-size: 0.72rem; color: #ffe9b0;
        background: rgba(0,0,0,0.35);
        border: 1px solid rgba(255,209,102,0.25);
        border-radius: 999px;
        padding: 5px 13px;
    }
    .pk-go {
        margin-top: 12px;
        font-size: 0.85rem; font-weight: 700; letter-spacing: 1px;
        color: #1a1a2e;
        background: linear-gradient(180deg, #ffe6a3, #f2b73e);
        border-radius: 10px;
        padding: 9px 20px;
        box-shadow: 0 4px 0 #8a6415;
    }
    .pk-foot { margin-top: 24px; font-size: 0.68rem; color: #6f7b93; line-height: 1.7; }
    .pk-foot b { color: #ffd166; }

    #switchBtn {
        position: fixed; right: 16px; bottom: 16px; z-index: 20;
        padding: 11px 17px;
        border-radius: 999px;
        font-family: inherit; font-size: 13px; font-weight: 700; letter-spacing: .4px;
        cursor: pointer;
        color: #1a1a2e;
        background: linear-gradient(180deg, #ffe6a3, #f2b73e);
        border: 1px solid rgba(255,248,225,0.7);
        box-shadow: 0 8px 22px rgba(0,0,0,0.5);
    }
    #switchBtn:hover { filter: brightness(1.08); }
    #switchBtn[hidden] { display: none; }
</style>
</head>
<body>
<div id="viewport"></div>
<button id="switchBtn" hidden>☰ Switch game</button>

<div id="picker">
    <div class="pk">
        <h1>Andrew's Game Collection</h1>
        <p class="pk-sub">Two games · one page · 两款游戏 · 一个入口</p>
        <div class="pk-grid">
            <button class="pk-card" data-mode="hangman">
                <span class="pk-seal seal-hangman">A B C</span>
                <span class="pk-name">Hangman</span>
                <span class="pk-en">Word Game</span>
                <span class="pk-desc">Guess the secret word one letter at a time before the stick figure is complete. 100+ kid-friendly words with hints.</span>
                <span class="pk-tag">🪢 6 mistakes allowed</span>
                <span class="pk-go">Play →</span>
            </button>
            <button class="pk-card" data-mode="devil">
                <span class="pk-seal seal-devil">😈</span>
                <span class="pk-name">Level Devil</span>
                <span class="pk-en">Troll Platformer</span>
                <span class="pk-desc">Reach the door — but the level lies, collapses, crushes and betrays you across 10 devious stages that rewrite themselves.</span>
                <span class="pk-tag">🚪 10 levels</span>
                <span class="pk-go">Play →</span>
            </button>
        </div>
        <p class="pk-foot">Inside a game, click <b>☰ Switch game</b> at the bottom-right to come back here at any time.</p>
    </div>
</div>

<!-- ===================== Level Devil ===================== -->
<template id="tpl-devil">
<style>

  :root{
    --bg:#0b0d12;
    --panel:#141821;

    --ink:#e8edf7;

    --gold:#ffd166;
  }

  html,body{height:100%}

    margin:0;
    background:
      radial-gradient(1200px 600px at 50% -10%, #1b2130 0%, transparent 60%),
      var(--bg);

    align-items:center;
    justify-content:center;

    overflow-x:hidden;

  #app{width:100%;max-width:960px}

  #hud{
    display:flex;align-items:center;justify-content:space-between;gap:12px;

  }
  .title{display:flex;align-items:baseline;gap:10px;min-width:0}
  #lvl{font-weight:800;letter-spacing:.14em;font-size:12px;color:var(--red);white-space:nowrap}
  #lvlname{font-weight:600;font-size:15px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tools{display:flex;align-items:center;gap:8px;flex-shrink:0}

</div>

        function drawGallows() {
            ctx.clearRect(0, 0, 220, 240);

        // ── Game state ──
        let currentWordObj = null;
        let guessedLetters = null;
        let wrongCount = 0;
        let gameOver = false;
        let wins = 0;
        let losses = 0;
        let usedWords = [];

        const wordDisplay = document.getElementById('wordDisplay');
        const hintEl = document.getElementById('hint');
        const statusEl = document.getElementById('status');
        const keyboardEl = document.getElementById('keyboard');
        const scoreWins = document.getElementById('scoreWins');
        const scoreLosses = document.getElementById('scoreLosses');

        function buildKeyboard() {
            keyboardEl.innerHTML = '';
            for (let i = 0; i < 26; i++) {
                const key = document.createElement('button');
                key.className = 'key';
                key.textContent = String.fromCharCode(97 + i);
                key.dataset.letter = String.fromCharCode(97 + i);
                key.addEventListener('click', () => handleGuess(key.dataset.letter));
                keyboardEl.appendChild(key);
            }
        }

        function pickWord() {
            const available = WORDS.filter(w => !usedWords.includes(w.word));
            if (available.length === 0) {
                usedWords = [];
                return pickWord();
            }
            const idx = Math.floor(Math.random() * available.length);
            return available[idx];
        }

        function startGame() {
            currentWordObj = pickWord();
            guessedLetters = new Set();
            wrongCount = 0;
            gameOver = false;

            document.querySelectorAll('.key').forEach(k => {
                k.disabled = false;
                k.className = 'key';
            });

            drawGallows();
            renderWord();
            hintEl.textContent = `💡 ${currentWordObj.hint}`;
            statusEl.className = 'status';
            statusEl.textContent = 'Pick a letter!';
        }

        function renderWord() {
            const display = currentWordObj.word
                .split('')
                .map(ch => guessedLetters.has(ch) ? ch : '_')
                .join(' ');
            wordDisplay.textContent = display;
        }

        function handleGuess(letter) {
            if (gameOver || guessedLetters.has(letter)) return;
            guessedLetters.add(letter);

            const key = document.querySelector(`.key[data-letter="${letter}"]`);
            const word = currentWordObj.word;

            if (word.includes(letter)) {
                key.classList.add('correct');
                key.disabled = true;
                renderWord();

                const won = word.split('').every(ch => guessedLetters.has(ch));
                if (won) {
                    gameOver = true;
                    wins++;
                    scoreWins.textContent = wins;
                    statusEl.className = 'status win';
                    statusEl.textContent = '🎉 You won! Great job!';
                    document.querySelectorAll('.key').forEach(k => k.disabled = true);
                } else {
                    statusEl.textContent = '✅ Correct! Keep going!';
                }
            } else {
                key.classList.add('wrong');
                key.disabled = true;
                wrongCount++;
                drawHangmanStep(wrongCount);

                if (wrongCount >= 6) {
                    gameOver = true;
                    losses++;
                    scoreLosses.textContent = losses;
                    statusEl.className = 'status lose';
                    statusEl.textContent = `💀 Oh no! The word was "${currentWordObj.word}"`;
                    wordDisplay.textContent = currentWordObj.word.split('').join(' ');
                    document.querySelectorAll('.key').forEach(k => k.disabled = true);
                } else {
                    statusEl.textContent = `❌ Wrong! ${6 - wrongCount} mistake${6 - wrongCount > 1 ? 's' : ''} left`;
                }
            }
        }

        function drawHangmanStep(step) {
            if (step >= 1 && step < DRAW_STEPS.length) {
                DRAW_STEPS[step]();
            }
        }

        function resetScores() {
            wins = 0;
            losses = 0;
            scoreWins.textContent = '0';
            scoreLosses.textContent = '0';
            usedWords = [];
            startGame();
        }

        function newWord() {
            if (currentWordObj) usedWords.push(currentWordObj.word);
            startGame();
        }

        // ── Init ──
        buildKeyboard();
        startGame();

        document.getElementById('newWordBtn').addEventListener('click', newWord);
        document.getElementById('resetScoresBtn').addEventListener('click', resetScores);

        // Physical keyboard support
        function onKeyDown(e) {
            const ch = e.key.toLowerCase();
            if (/^[a-z]$/.test(ch)) {
                const key = document.querySelector(`.key[data-letter="${ch}"]`);
                if (key && !key.disabled) handleGuess(ch);
            }
            if (e.key === 'Enter') newWord();
        }
        document.addEventListener('keydown', onKeyDown);

        return function stop() {
            document.removeEventListener('keydown', onKeyDown);
        };
    };

    if (!ac) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) { try { ac = new AC(); } catch(e) { ac = null; } }
    }
    return ac;
  }
  function tone(freq, dur, type, vol, glide){
    const a = ctxGet(); if (!a || muted) return;
    const o = a.createOscillator(), g = a.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(freq, a.currentTime);
    if (glide) o.frequency.exponentialRampToValueAtTime(Math.max(25, freq + glide), a.currentTime + dur);
    g.gain.setValueAtTime(vol, a.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + dur);
    o.connect(g); g.connect(a.destination);
    o.start(); o.stop(a.currentTime + dur + 0.02);
  }
  function noise(dur, vol){
    const a = ctxGet(); if (!a || muted) return;
    const n = Math.floor(a.sampleRate * dur);
    const buf = a.createBuffer(1, n, a.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random()*2-1) * (1 - i/n);
    const src = a.createBufferSource(); src.buffer = buf;
    const f = a.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 700;
    const g = a.createGain(); g.gain.value = vol;
    src.connect(f); f.connect(g); g.connect(a.destination); src.start();
  }

    jump()  { tone(430, 0.11, 'square', 0.05, 300); },
    land()  { tone(150, 0.05, 'triangle', 0.035, -50); },
    death() { tone(320, 0.42, 'sawtooth', 0.075, -260); noise(0.25, 0.05); },

// ---------------------------------------------------------------- game state
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const el = {
  lvl: document.getElementById('lvl'),
  lvlname: document.getElementById('lvlname'),
  deaths: document.getElementById('deaths'),
  intro: document.getElementById('intro'),
  overlay: document.getElementById('overlay'),
  ovTitle: document.getElementById('ovTitle'),
  ovText: document.getElementById('ovText'),
  ovBtn: document.getElementById('ovBtn'),
  err: document.getElementById('err')
};

const LEVELS = buildLevels();
let levelIndex = 0;
let L = null;              // current level (runtime copy)
let grid = null;

let state = 'title';       // title | play | dying | win | finish | paused
let prevState = 'play';
let gameTime = 0;
let timers = [];
let tileTimers = new Map();
let fallers = [];
let particles = [];
let warns = [];
let shake = 0;
let deathTimer = 0;
let totalDeaths = 0;
let levelDeaths = 0;
let winTimer = 0;

const camera = { x:0, shakeX:0, shakeY:0 };

const p = {
  x:0, y:0, vx:0, vy:0,
  onGround:false, coyote:0, face:1,
  squash:1, wasGround:false, runPhase:0
};
let jumpBuffer = 0;

const keys = { left:false, right:false, jump:false };

// ---------------------------------------------------------------- input
function keyDown(e){
  const k = e.key;
  const lower = k.length === 1 ? k.toLowerCase() : k;
  if (k === ' ' || k === 'ArrowUp' || k === 'ArrowDown' || k === 'ArrowLeft' || k === 'ArrowRight') e.preventDefault();

  if (k === 'ArrowLeft'  || lower === 'a') keys.left = true;
  if (k === 'ArrowRight' || lower === 'd') keys.right = true;
  if (k === ' ' || k === 'ArrowUp' || lower === 'w' || lower === 'z') {
    if (!keys.jump) jumpBuffer = JUMP_BUFFER;
    keys.jump = true;
  }
  if (lower === 'r' && (state === 'play' || state === 'paused')) restartLevel(false);
  if (lower === 'm') updateMuteBtn(Sfx.toggle());
  if (k === 'Escape') togglePause();
  Sfx.resume();
}
function keyUp(e){
  const k = e.key;
  const lower = k.length === 1 ? k.toLowerCase() : k;
  if (k === 'ArrowLeft'  || lower === 'a') keys.left = false;
  if (k === 'ArrowRight' || lower === 'd') keys.right = false;
  if (k === ' ' || k === 'ArrowUp' || lower === 'w' || lower === 'z') keys.jump = false;
}
window.addEventListener('keydown', keyDown);
window.addEventListener('keyup', keyUp);
function onBlur(){ keys.left = keys.right = keys.jump = false; }
window.addEventListener('blur', onBlur);

// touch buttons
Array.prototype.forEach.call(document.querySelectorAll('.tbtn'), function(btn){
  const k = btn.dataset.k;
  const on  = function(e){ e.preventDefault(); Sfx.resume();
    if (k === 'jump') { if (!keys.jump) jumpBuffer = JUMP_BUFFER; keys.jump = true; }
    else keys[k] = true;
  };
  const off = function(e){ e.preventDefault(); keys[k] = false; };
  btn.addEventListener('touchstart', on, {passive:false});
  btn.addEventListener('touchend', off, {passive:false});
  btn.addEventListener('touchcancel', off, {passive:false});
  btn.addEventListener('mousedown', on);
  btn.addEventListener('mouseup', off);
  btn.addEventListener('mouseleave', off);
});
if ('ontouchstart' in window || navigator.maxTouchPoints > 0) document.body.classList.add('touch');

document.getElementById('btnRestart').addEventListener('click', function(){ Sfx.resume(); restartLevel(false); });
document.getElementById('btnMute').addEventListener('click', function(){ Sfx.resume(); updateMuteBtn(Sfx.toggle()); });
el.ovBtn.addEventListener('click', onOverlayButton);

function updateMuteBtn(muted){
  document.getElementById('btnMute').textContent = muted ? '🔇' : '🔊';
}

// ---------------------------------------------------------------- level lifecycle
function loadLevel(i){
  levelIndex = clamp(i, 0, LEVELS.length - 1);
  L = LEVELS[levelIndex];
  grid = L.grid.map(function(row){ return row.slice(); });
  respawn();
  el.lvl.textContent = 'LEVEL ' + (levelIndex + 1);
  el.lvlname.textContent = L.name;
  el.deaths.textContent = '💀 ' + totalDeaths;
  showIntro(L.name, L.hint);
}

function respawn(){
  const s = L.spawn;
  p.x = s.x * TILE + (TILE - PW) / 2;
  p.y = s.y * TILE + (TILE - PH);
  p.vx = p.vy = 0;
  p.onGround = false; p.coyote = 0; p.squash = 1; p.face = 1; p.runPhase = 0;
  jumpBuffer = 0;
  timers = [];
  tileTimers = new Map();
  fallers = [];
  particles = [];
  warns = [];
  shake = 0;
  // restore every trigger and the door so the level is fresh
  grid = L.grid.map(function(row){ return row.slice(); });
  for (let i = 0; i < L.triggers.length; i++) L.triggers[i].fired = false;
  L.door = null;
  camera.x = camTarget(true);
}

function restartLevel(){
  if (state === 'finish' || state === 'title') return;
  respawn();
  state = 'play';
  el.ovBtn.dataset.act = '';
  hideOverlay();
  showIntro(L.name, L.hint);
}

function showIntro(name, hint){
  el.intro.querySelector('.iname').textContent = name;
  el.intro.querySelector('.ihint').textContent = hint || '';
  el.intro.classList.add('show');
  clearTimeout(showIntro._t);
  showIntro._t = setTimeout(function(){ el.intro.classList.remove('show'); }, 2400);
}

function hideOverlay(){ el.overlay.classList.add('hide'); }

function showOverlay(title, text, btn, cls){
  el.ovTitle.textContent = title;
  el.ovTitle.className = cls || '';
  el.ovText.innerHTML = text;
  el.ovBtn.textContent = btn;
  el.overlay.classList.remove('hide');
}

function onOverlayButton(){
  Sfx.resume();
  if (state === 'title') { totalDeaths = 0; levelDeaths = 0; loadLevel(0); state = 'play'; hideOverlay(); }
  else if (state === 'finish') { totalDeaths = 0; levelDeaths = 0; loadLevel(0); state = 'play'; hideOverlay(); }
  else if (state === 'paused') { state = 'play'; hideOverlay(); el.ovBtn.dataset.act = ''; }
}

function togglePause(){
  if (state === 'play') { prevState = state; state = 'paused';
    showOverlay('PAUSED', 'Take a breath. The level is not going anywhere — unlike some floors.', 'Resume', '');
    el.ovBtn.dataset.act = 'resume';
  } else if (state === 'paused') { state = 'play'; hideOverlay(); el.ovBtn.dataset.act = ''; }
}

// ---------------------------------------------------------------- timers / ops
function later(delay, fn){ timers.push({ t: gameTime + delay, fn: fn }); }

function scheduleTile(tx, ty, delay, fn){
  const k = tx + ',' + ty;
  if (tileTimers.has(k)) return;
  tileTimers.set(k, { t: gameTime + delay, fn: fn, k: k });
}

function applyOps(ops){
  for (let i = 0; i < ops.length; i++){
    const op = ops[i];
    if (op.delay) later(op.delay, makeApply(op));
    else makeApply(op)();
  }
}
function makeApply(op){
  return function(){ applyOp(op); };
}

function applyOp(op){
  switch (op.op){
    case 'set': {
      for (let y = op.y; y < op.y + (op.h || 1); y++){
        const row = grid[y]; if (!row) continue;
        for (let x = op.x; x < op.x + (op.w || 1); x++){
          if (x < 0 || x >= L.w) continue;
          row[x] = op.ch;
        }
      }
      // a tile that appears inside you is a very bad tile
      if (isSolid(op.ch) && overlapsPlayer(op.x, op.y, op.w || 1, op.h || 1)) killPlayer('crush');
      else if (isSpike(op.ch) && overlapsPlayer(op.x, op.y, op.w || 1, op.h || 1)) killPlayer('spike');
      break;
    }
    case 'warn':
      warns.push({ x:op.x, y:op.y, w:op.w||1, h:op.h||1, until: gameTime + (op.dur||0.4), dur: op.dur||0.4 });
      break;
    case 'shake': shake = Math.max(shake, op.amount || 6); break;
    case 'sfx':   if (Sfx[op.name]) Sfx[op.name](); break;
    case 'door':  L.door = { x:op.x, y:op.y }; break;
    case 'poof':  burst((op.x + 0.5) * TILE, (op.y + 0.5) * TILE, '#8d7dff', 14); break;
  }
}

function overlapsPlayer(tx, ty, tw, th){
  const bx = tx * TILE, by = ty * TILE, bw = tw * TILE, bh = th * TILE;
  return p.x < bx + bw && p.x + PW > bx && p.y < by + bh && p.y + PH > by;
}

function burst(x, y, color, n){
  for (let i = 0; i < n; i++){
    const a = Math.random() * Math.PI * 2, s = 40 + Math.random() * 190;
    particles.push({
      x:x, y:y, vx:Math.cos(a)*s, vy:Math.sin(a)*s - 70,
      life: 0.35 + Math.random()*0.45, max: 0.8,
      size: 2 + Math.random()*3, color: color
    });
  }
}

function spawnFaller(tx, ty){
  fallers.push({ x: tx*TILE, y: ty*TILE, vy: 0, a: 0, rot: (Math.random()-0.5)*0.2 });
}

// ---------------------------------------------------------------- queries
function tileAt(tx, ty){
  if (tx < 0 || tx >= L.w || ty < 0 || ty >= L.h) return '.';
  return grid[ty][tx];
}
function solidAt(tx, ty){
  if (tx < 0 || tx >= L.w) return true;   // level walls
  if (ty < 0 || ty >= L.h) return false;
  return isSolid(grid[ty][tx]);
}
function doorPos(){
  if (L.door) return L.door;
  for (let y = 0; y < L.h; y++) for (let x = 0; x < L.w; x++) if (grid[y][x] === 'D') return {x:x, y:y};
  return {x:L.w-2, y:L.h-4};
}

// ---------------------------------------------------------------- death / win
function killPlayer(){
  if (state !== 'play') return;
  state = 'dying';
  deathTimer = DEATH_PAUSE;
  totalDeaths++; levelDeaths++;
  shake = 14;
  burst(p.x + PW/2, p.y + PH/2, '#ff4d5e', 26);
  burst(p.x + PW/2, p.y + PH/2, '#ffffff', 10);
  Sfx.death();
  el.deaths.textContent = '💀 ' + totalDeaths;
}

function completeLevel(){
  if (state !== 'play') return;
  state = 'win';
  winTimer = 0.75;
  burst(p.x + PW/2, p.y + PH/2, '#ffd166', 22);
  Sfx.door();
}

function nextLevel(){
  if (levelIndex + 1 >= LEVELS.length){
    state = 'finish';
    showOverlay('YOU ESCAPED',
      'All ' + LEVELS.length + ' levels survived with <b>' + totalDeaths + '</b> death' + (totalDeaths === 1 ? '' : 's') + '.<br>' +
      'The door never stood a chance.',
      'Play again', 'gold');
  } else {
    loadLevel(levelIndex + 1);
    state = 'play';
  }
}

// ---------------------------------------------------------------- physics
function stepPhysics(dt){
  gameTime += dt;

  // ---- timers
  for (let i = timers.length - 1; i >= 0; i--){
    const tm = timers[i];
    if (gameTime >= tm.t){ timers.splice(i,1); tm.fn(); }
  }
  if (tileTimers.size){
    const due = [];
    tileTimers.forEach(function(v){ if (gameTime >= v.t) due.push(v); });
    for (let i = 0; i < due.length; i++){ tileTimers.delete(due[i].k); due[i].fn(); }
  }

  if (state === 'play') updatePlayer(dt);

  // ---- decaying effects
  shake = Math.max(0, shake - dt * 26);
  for (let i = warns.length - 1; i >= 0; i--) if (gameTime >= warns[i].until) warns.splice(i,1);
  for (let i = particles.length - 1; i >= 0; i--){
    const pt = particles[i];
    pt.vy += 1400 * dt; pt.x += pt.vx*dt; pt.y += pt.vy*dt; pt.life -= dt;
    if (pt.life <= 0) particles.splice(i,1);
  }
  for (let i = fallers.length - 1; i >= 0; i--){
    const f = fallers[i];
    f.vy += GRAVITY * dt; f.y += f.vy * dt; f.a += f.rot * dt * 2;
    if (f.y > L.h * TILE + 120) fallers.splice(i,1);
  }
}

function updatePlayer(dt){
  // horizontal
  const dir = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
  if (dir !== 0){
    p.vx += dir * (p.onGround ? MOVE_ACCEL : AIR_ACCEL) * dt;
    p.vx = clamp(p.vx, -MAX_SPEED, MAX_SPEED);
    p.face = dir;
  } else {
    const f = (p.onGround ? FRICTION : AIR_ACCEL * 0.55) * dt;
    if (Math.abs(p.vx) <= f) p.vx = 0;
    else p.vx -= (p.vx > 0 ? 1 : -1) * f;
  }

  // coyote + buffered jump
  p.coyote = p.onGround ? COYOTE : Math.max(0, p.coyote - dt);
  if (jumpBuffer > 0) jumpBuffer -= dt;
  if (jumpBuffer > 0 && p.coyote > 0){
    p.vy = -JUMP_V;
    p.onGround = false;
    p.coyote = 0;
    jumpBuffer = 0;
    p.squash = 0.82;
    Sfx.jump();
  }

  // gravity + variable height
  p.vy += GRAVITY * dt;
  if (!keys.jump && p.vy < -JUMP_MIN_V) p.vy = -JUMP_MIN_V;
  if (p.vy > MAX_FALL) p.vy = MAX_FALL;

  moveAxis(dt, true);
  moveAxis(dt, false);

  // landing feedback
  if (p.onGround && !p.wasGround) { p.squash = 1.22; Sfx.land(); }
  p.wasGround = p.onGround;
  p.squash += (1 - p.squash) * Math.min(1, dt * 14);
  if (p.onGround) p.runPhase += Math.abs(p.vx) * dt * 0.06;

  // ---- tile interactions
  interactTiles();

  // ---- hazards
  if (state !== 'play') return;
  const x0 = Math.floor(p.x / TILE), x1 = Math.floor((p.x + PW - 0.01) / TILE);
  const y0 = Math.floor(p.y / TILE), y1 = Math.floor((p.y + PH - 0.01) / TILE);
  for (let ty = y0; ty <= y1; ty++)
    for (let tx = x0; tx <= x1; tx++)
      if (isSpike(tileAt(tx, ty))) { killPlayer(); return; }

  if (p.y > L.h * TILE + 60) { killPlayer(); return; }

  // ---- triggers
  for (let i = 0; i < L.triggers.length; i++){
    const t = L.triggers[i];
    if (t.fired) continue;
    if (checkWhen(t.when)) { t.fired = true; applyOps(t.ops); if (state !== 'play') return; }
  }

  // ---- door
  const d = doorPos();
  const dx = d.x * TILE, dy = d.y * TILE;
  if (p.x < dx + TILE - 6 && p.x + PW > dx + 6 && p.y < dy + TILE - 4 && p.y + PH > dy + 6) completeLevel();
}

function checkWhen(w){
  if (!w) return true;
  const pt = { x: Math.floor((p.x + PW/2) / TILE), y: Math.floor((p.y + PH - 1) / TILE) };
  if (w.x !== undefined && pt.x < w.x) return false;
  if (w.yAbove !== undefined && pt.y > w.yAbove) return false;
  if (w.yBelow !== undefined && pt.y < w.yBelow) return false;
  return true;
}

function moveAxis(dt, horizontal){
  if (horizontal){ p.x += p.vx * dt; } else { p.y += p.vy * dt; }

  const bx = p.x, by = p.y;
  const x0 = Math.floor(bx / TILE), x1 = Math.floor((bx + PW - 0.01) / TILE);
  const y0 = Math.floor(by / TILE), y1 = Math.floor((by + PH - 0.01) / TILE);

  for (let ty = y0; ty <= y1; ty++){
    for (let tx = x0; tx <= x1; tx++){
      if (!solidAt(tx, ty)) continue;
      if (horizontal){
        if (p.vx > 0)      p.x = tx * TILE - PW;
        else if (p.vx < 0) p.x = (tx + 1) * TILE;
        p.vx = 0;
      } else {
        if (p.vy > 0){ p.y = ty * TILE - PH; p.onGround = true; }
        else if (p.vy < 0){ p.y = (ty + 1) * TILE; }
        p.vy = 0;
      }
      return;
    }
  }
  if (!horizontal) p.onGround = false;
}

function interactTiles(){
  // feet row: falling platforms
  const footY = Math.floor((p.y + PH + 1) / TILE);
  const cxa = Math.floor(p.x / TILE), cxb = Math.floor((p.x + PW - 1) / TILE);
  for (let tx = cxa; tx <= cxb; tx++){
    if (tileAt(tx, footY) === 'f' && p.vy >= 0){
      (function(txx){
        scheduleTile(txx, footY, FALL_DELAY, function(){
          if (tileAt(txx, footY) !== 'f') return;
          grid[footY][txx] = '.';
          spawnFaller(txx, footY);
          Sfx.rumble();
        });
      })(tx);
    }
  }
  // body: fake tiles
  const x0 = Math.floor(p.x / TILE), x1 = Math.floor((p.x + PW - 0.01) / TILE);
  const y0 = Math.floor(p.y / TILE), y1 = Math.floor((p.y + PH - 0.01) / TILE);
  for (let ty = y0; ty <= y1; ty++){
    for (let tx = x0; tx <= x1; tx++){
      if (tileAt(tx, ty) === 'g'){
        (function(txx, tyy){
          scheduleTile(txx, tyy, GHOST_DELAY, function(){
            if (tileAt(txx, tyy) !== 'g') return;
            grid[tyy][txx] = '.';
            burst((txx + 0.5) * TILE, (tyy + 0.5) * TILE, '#8d7dff', 8);
            Sfx.step();
          });
        })(tx, ty);
      }
    }
  }
}

// ---------------------------------------------------------------- camera
function camTarget(snap){
  const w = L.w * TILE;
  if (w <= VIEW_W) return (w - VIEW_W) / 2;
  return clamp(p.x + PW/2 - VIEW_W/2, 0, w - VIEW_W);
}

// ---------------------------------------------------------------- rendering
let stars = null;
function initStars(){
  stars = [];
  for (let i = 0; i < 70; i++){
    stars.push({ x: Math.random(), y: Math.random() * 0.72, r: 0.6 + Math.random() * 1.5, p: Math.random() * 6.28 });
  }
}

function render(){
  const camX = camera.x;

  // ---------- background
  const bg = ctx.createLinearGradient(0, 0, 0, VIEW_H);
  bg.addColorStop(0, '#151a26');
  bg.addColorStop(0.55, '#10141d');
  bg.addColorStop(1, '#0a0d13');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, VIEW_W, VIEW_H);

  // parallax stars / dust
  ctx.save();
  for (let i = 0; i < stars.length; i++){
    const s = stars[i];
    const sx = ((s.x * VIEW_W - camX * 0.22) % VIEW_W + VIEW_W) % VIEW_W;
    const tw = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(gameTime * 1.6 + s.p));
    ctx.globalAlpha = 0.30 * tw;
    ctx.fillStyle = '#9fb4d8';
    ctx.fillRect(sx, s.y * VIEW_H, s.r, s.r);
  }
  ctx.restore();

  ctx.translate(camera.shakeX, camera.shakeY);

  // ---------- warning markers (under tiles)
  for (let i = 0; i < warns.length; i++){
    const w = warns[i];
    const life = (w.until - gameTime) / w.dur;
    const pulse = 0.10 + 0.22 * (0.5 + 0.5 * Math.sin(gameTime * 42));
    ctx.globalAlpha = clamp(life, 0, 1) * pulse * 2.0;
    ctx.fillStyle = '#ff4d5e';
    ctx.fillRect(w.x*TILE - camX, w.y*TILE, w.w*TILE, w.h*TILE);
    ctx.globalAlpha = clamp(life, 0, 1) * 0.85;
    ctx.strokeStyle = '#ff8a95';
    ctx.lineWidth = 2;
    ctx.strokeRect(w.x*TILE - camX + 1, w.y*TILE + 1, w.w*TILE - 2, w.h*TILE - 2);
    ctx.globalAlpha = 1;
  }

  // ---------- tiles
  const c0 = Math.max(0, Math.floor(camX / TILE) - 1);
  const c1 = Math.min(L.w - 1, Math.ceil((camX + VIEW_W) / TILE) + 1);
  for (let ty = 0; ty < L.h; ty++){
    for (let tx = c0; tx <= c1; tx++){
      const ch = grid[ty][tx];
      if (ch === '.') continue;
      drawTile(ch, tx*TILE - camX, ty*TILE, tx, ty);
    }
  }

  // ---------- falling tiles
  for (let i = 0; i < fallers.length; i++){
    const f = fallers[i];
    ctx.save();
    ctx.translate(f.x - camX + TILE/2, f.y + TILE/2);
    ctx.rotate(f.a);
    ctx.globalAlpha = clamp(1 - (f.y - (L.h * TILE - 200)) / 200, 0, 1);
    drawBlock(-TILE/2, -TILE/2, TILE, TILE, '#5b6b86', true);
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  // ---------- door
  drawDoor(doorPos(), camX);

  // ---------- particles
  for (let i = 0; i < particles.length; i++){
    const pt = particles[i];
    ctx.globalAlpha = clamp(pt.life / 0.6, 0, 1);
    ctx.fillStyle = pt.color;
    ctx.fillRect(pt.x - camX, pt.y, pt.size, pt.size);
  }
  ctx.globalAlpha = 1;

  // ---------- player
  if (state !== 'dying' || deathTimer > DEATH_PAUSE - 0.18) drawPlayer(camX);

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  // ---------- offscreen door arrow
  drawDoorArrow(camX);

  // ---------- vignette
  const vg = ctx.createRadialGradient(VIEW_W/2, VIEW_H/2, VIEW_H*0.35, VIEW_W/2, VIEW_H/2, VIEW_H*0.95);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.55)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, VIEW_W, VIEW_H);
}

function drawBlock(x, y, w, h, col, highlight){
  ctx.fillStyle = col;
  ctx.fillRect(x, y, w, h);
  if (highlight){
    ctx.fillStyle = 'rgba(255,255,255,0.10)';
    ctx.fillRect(x, y, w, 3);
  }
  ctx.fillStyle = 'rgba(0,0,0,0.22)';
  ctx.fillRect(x, y + h - 3, w, 3);
}

function drawTile(ch, sx, sy, tx, ty){
  if (ch === '#'){
    drawBlock(sx, sy, TILE, TILE, '#3d4a63', true);
    ctx.fillStyle = 'rgba(255,255,255,0.045)';
    ctx.fillRect(sx + 1, sy + 1, TILE - 2, 1);
    ctx.strokeStyle = 'rgba(0,0,0,0.30)';
    ctx.lineWidth = 1;
    ctx.strokeRect(sx + 0.5, sy + 0.5, TILE - 1, TILE - 1);
    return;
  }
  if (ch === 'f'){
    drawBlock(sx, sy, TILE, TILE, '#3d4a63', true);
    ctx.strokeStyle = 'rgba(255,120,120,0.55)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(sx + 6, sy + 5);  ctx.lineTo(sx + 14, sy + 15);
    ctx.lineTo(sx + 9,  sy + 25);
    ctx.moveTo(sx + 14, sy + 15); ctx.lineTo(sx + 25, sy + 19);
    ctx.moveTo(sx + 6,  sy + 5);  ctx.lineTo(sx + 21, sy + 7);
    ctx.stroke();
    return;
  }
  if (ch === 'g'){
    // deliberately identical to solid rock — that is the joke
    drawBlock(sx, sy, TILE, TILE, '#3d4a63', true);
    ctx.fillStyle = 'rgba(255,255,255,0.045)';
    ctx.fillRect(sx + 1, sy + 1, TILE - 2, 1);
    ctx.strokeStyle = 'rgba(0,0,0,0.30)';
    ctx.lineWidth = 1;
    ctx.strokeRect(sx + 0.5, sy + 0.5, TILE - 1, TILE - 1);
    return;
  }
  if (ch === '^' || ch === 'v'){
    const up = ch === '^';
    const g = ctx.createLinearGradient(0, sy, 0, sy + TILE);
    if (up){ g.addColorStop(0, '#ff8a95'); g.addColorStop(1, '#c0202f'); }
    else   { g.addColorStop(0, '#c0202f'); g.addColorStop(1, '#ff8a95'); }
    ctx.fillStyle = g;
    const base = up ? sy + TILE : sy;
    for (let k = 0; k < 4; k++){
      const x = sx + k * 8;
      ctx.beginPath();
      ctx.moveTo(x, base);
      ctx.lineTo(x + 4, up ? sy + 3 : sy + TILE - 3);
      ctx.lineTo(x + 8, base);
      ctx.closePath();
      ctx.fill();
    }
    ctx.fillStyle = 'rgba(255,255,255,0.22)';
    ctx.fillRect(sx, up ? sy + TILE - 3 : sy, TILE, 3);
    return;
  }
}

function drawDoor(d, camX){
  const x = d.x * TILE - camX, y = d.y * TILE;
  const pulse = 0.5 + 0.5 * Math.sin(gameTime * 3);
  ctx.save();
  // glow
  const g = ctx.createRadialGradient(x + TILE/2, y + TILE/2, 2, x + TILE/2, y + TILE/2, TILE * 1.7);
  g.addColorStop(0, 'rgba(255,209,102,' + (0.34 + 0.16 * pulse) + ')');
  g.addColorStop(1, 'rgba(255,209,102,0)');
  ctx.fillStyle = g;
  ctx.fillRect(x - TILE * 1.7, y - TILE * 1.7, TILE * 4.4, TILE * 4.4);

  // frame
  ctx.fillStyle = '#ffd166';
  roundRect(ctx, x + 3, y + 1, TILE - 6, TILE - 2, 5);
  ctx.fill();
  // opening
  ctx.fillStyle = '#241c08';
  roundRect(ctx, x + 6, y + 4, TILE - 12, TILE - 5, 4);
  ctx.fill();
  // shimmer inside
  ctx.globalAlpha = 0.35 + 0.35 * pulse;
  ctx.fillStyle = '#ffe9a8';
  roundRect(ctx, x + 8, y + 6, TILE - 16, TILE - 11, 3);
  ctx.fill();
  ctx.globalAlpha = 1;
  // knob
  ctx.fillStyle = '#ffd166';
  ctx.beginPath(); ctx.arc(x + TILE - 10, y + TILE/2 + 2, 1.9, 0, 6.29); ctx.fill();
  ctx.restore();
}

function drawDoorArrow(camX){
  const d = doorPos();
  const dx = d.x * TILE + TILE/2 - camX;
  if (dx >= 0 && dx <= VIEW_W) return;
  const right = dx > VIEW_W;
  const ax = right ? VIEW_W - 26 : 26;
  const ay = clamp(p.y + PH/2, 40, VIEW_H - 40);
  const pulse = 0.55 + 0.45 * Math.sin(gameTime * 5);
  ctx.save();
  ctx.globalAlpha = pulse;
  ctx.fillStyle = '#ffd166';
  ctx.beginPath();
  if (right) { ctx.moveTo(ax + 12, ay); ctx.lineTo(ax - 4, ay - 10); ctx.lineTo(ax - 4, ay + 10); }
  else       { ctx.moveTo(ax - 12, ay); ctx.lineTo(ax + 4, ay - 10); ctx.lineTo(ax + 4, ay + 10); }
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

function drawPlayer(camX){
  const x = p.x - camX + PW/2, y = p.y + PH;
  const stretch = 1 / p.squash;
  const sx = p.squash, sy = stretch;

  ctx.save();
  ctx.translate(x, y);
  ctx.scale(sx, sy);
  ctx.translate(0, -PH);

  // body
  const grad = ctx.createLinearGradient(0, 0, 0, PH);
  grad.addColorStop(0, '#ffffff');
  grad.addColorStop(1, '#c9d5e8');
  ctx.fillStyle = grad;
  roundRect(ctx, -PW/2, 0, PW, PH, 6);
  ctx.fill();
  ctx.strokeStyle = 'rgba(20,26,38,0.85)';
  ctx.lineWidth = 1.6;
  roundRect(ctx, -PW/2, 0, PW, PH, 6);
  ctx.stroke();

  // eyes track the door
  const d = doorPos();
  const tx = (d.x * TILE + TILE/2) - (p.x + PW/2);
  const ty = (d.y * TILE + TILE/2) - (p.y + PH/2);
  const len = Math.max(1, Math.hypot(tx, ty));
  const lookX = clamp(tx / len * 2.0, -2.2, 2.2);
  const lookY = clamp(ty / len * 1.4, -1.8, 1.8);
  const bob = p.onGround ? Math.sin(p.runPhase) * 1.0 : 0;

  ctx.fillStyle = '#141a26';
  ctx.beginPath(); ctx.arc(-4 + lookX, 10 + lookY + bob, 3.0, 0, 6.29); ctx.fill();
  ctx.beginPath(); ctx.arc( 4 + lookX, 10 + lookY + bob, 3.0, 0, 6.29); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.beginPath(); ctx.arc(-4 + lookX + 1.1, 10 + lookY - 1.1 + bob, 0.9, 0, 6.29); ctx.fill();
  ctx.beginPath(); ctx.arc( 4 + lookX + 1.1, 10 + lookY - 1.1 + bob, 0.9, 0, 6.29); ctx.fill();

  // mouth: worried in the air, content on the ground
  ctx.strokeStyle = '#141a26';
  ctx.lineWidth = 1.4;
  ctx.beginPath();
  if (p.onGround) ctx.arc(0, 17, 3.2, 0.15 * Math.PI, 0.85 * Math.PI);
  else            ctx.arc(0, 22, 3.0, 1.18 * Math.PI, 1.82 * Math.PI);
  ctx.stroke();

  ctx.restore();
}

function roundRect(c, x, y, w, h, r){
  if (w < 2*r) r = w/2;
  if (h < 2*r) r = h/2;
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y,     x + w, y + h, r);
  c.arcTo(x + w, y + h, x,     y + h, r);
  c.arcTo(x,     y + h, x,     y,     r);
  c.arcTo(x,     y,     x + w, y,     r);
  c.closePath();
}

// ---------------------------------------------------------------- loop
let dpr = 1;
function resize(){
  dpr = Math.min(2, window.devicePixelRatio || 1);
  canvas.width  = Math.round(VIEW_W * dpr);
  canvas.height = Math.round(VIEW_H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);

let rafId = 0;
let last = performance.now(), acc = 0;

function frame(now){
  rafId = requestAnimationFrame(frame);
  let raw = (now - last) / 1000;
  last = now;
  if (raw > 0.25) raw = 0.25;          // tab was hidden

  acc += raw;
  let guard = 0;
  while (acc >= STEP && guard++ < 12){
    if (state === 'play' || state === 'dying' || state === 'win') stepPhysics(STEP);
    acc -= STEP;
  }
  if (acc > STEP * 12) acc = 0;

  if (state === 'dying'){
    deathTimer -= raw;
    if (deathTimer <= 0) { respawn(); state = 'play'; }
  }
  if (state === 'win'){
    winTimer -= raw;
    if (winTimer <= 0) nextLevel();
  }

  // smooth camera
  const target = camTarget();
  camera.x += (target - camera.x) * Math.min(1, raw * 12);
  if (Math.abs(target - camera.x) < 0.4) camera.x = target;

  camera.shakeX = (Math.random() * 2 - 1) * shake;
  camera.shakeY = (Math.random() * 2 - 1) * shake;

  render();
}

// ---------------------------------------------------------------- boot
try {
  initStars();
  resize();
  loadLevel(0);
  state = 'title';
  showOverlay('LEVEL DEVIL',
    'Reach the door. The level will lie, collapse, crush and betray you.<br><br>' +
    '<kbd>←</kbd> <kbd>→</kbd> move &nbsp; <kbd>Space</kbd> jump &nbsp; <kbd>R</kbd> retry',
    'Start', 'red');
  rafId = requestAnimationFrame(frame);
} catch (e){
  el.err.style.display = 'block';
  el.err.textContent = 'Error: ' + (e && e.stack || e);
}

  return function stop(){
    cancelAnimationFrame(rafId);
    window.removeEventListener('keydown', keyDown);
    window.removeEventListener('keyup', keyUp);
    window.removeEventListener('blur', onBlur);
    window.removeEventListener('resize', resize);
    clearTimeout(showIntro._t);
    document.body.classList.remove('touch');
    Sfx.suspend();
  };
};


</script>

<script>
(function () {
    'use strict';

    /* Shell: mount one game at a time and tear it down cleanly. */
    var TITLES = {
        hangman: "Hangman — Andrew's Projects",
        devil: "Level Devil — Andrew's Projects"
    };
    var HOME_TITLE = "Andrew's Game Collection — Hangman & Level Devil";

    var picker = document.getElementById('picker');
    var viewport = document.getElementById('viewport');
    var switchBtn = document.getElementById('switchBtn');
    var stopFn = null;

    function unmount() {
        if (stopFn) {
            try { stopFn(); } catch (e) { /* game already torn down */ }
            stopFn = null;
        }
        viewport.innerHTML = '';
    }

    function mount(mode) {
        var tpl = document.getElementById('tpl-' + mode);
        if (!tpl || !window.__GAMES || !window.__GAMES[mode]) return;
        unmount();
        viewport.appendChild(tpl.content.cloneNode(true));
        try {
            stopFn = window.__GAMES[mode](viewport) || null;
        } catch (e) {
            stopFn = null;
        }
        picker.hidden = true;
        switchBtn.hidden = false;
        document.title = TITLES[mode];
    }

    function showPicker() {
        unmount();
        picker.hidden = false;
        switchBtn.hidden = true;
        document.title = HOME_TITLE;
    }

    Array.prototype.forEach.call(document.querySelectorAll('.pk-card'), function (card) {
        card.addEventListener('click', function () { mount(card.dataset.mode); });
    });
    switchBtn.addEventListener('click', showPicker);
    document.title = HOME_TITLE;
})();
</script>

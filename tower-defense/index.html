function selectPacket(key) {
    Sfx.unlock();
    if (state.phase === 'over' || state.phase === 'won') return;
    if (buildType === key) buildType = null;
    else {
        const T = PLANT_TYPES[key];
        if ((state.cooldowns[key] || 0) > 0) { toast(T.name + ' 还在冷却中', true); return; }
        if (state.sun < T.cost) { toast('阳光不足，需要 ' + T.cost + ' ☀', true); return; }
        buildType = key;
        shovelMode = false;
    }
    selected = null;
    towerSel = null;
    if (COMBO) towerType = null;
    syncSelectionUI();
    renderSelectedPanel();
}

function syncSelectionUI() {
    for (const n of el('packets').children) n.classList.toggle('sel', n.dataset.key === buildType);
    el('shovel').classList.toggle('sel', shovelMode);
    if (COMBO) for (const n of el('towerList').children) n.classList.toggle('sel', n.dataset.key === towerType);
}

function cancelSelection() {
    buildType = null;
    shovelMode = false;
    towerType = null;
    syncSelectionUI();
}

// 清掉草坪上的选中状态（植物和炮塔共用）
function clearSelection() {
    selected = null;
    towerSel = null;
}

function updatePackets() {
    for (const n of el('packets').children) {
        const key = n.dataset.key;
        const T = PLANT_TYPES[key];
        const cd = state.cooldowns[key] || 0;
        n.classList.toggle('poor', state.sun < T.cost);
        n.classList.toggle('cool', cd > 0);
        n.querySelector('.cd').style.height = (cd > 0 ? clamp(cd / T.cd, 0, 1) * 100 : 0) + '%';
    }
    if (COMBO) {
        for (const n of el('towerList').children) {
            const T = TOWER_TYPES[n.dataset.key];
            if (T) n.classList.toggle('poor', state.gold < T.cost);
        }
    }
    el('startWave').disabled = state.phase !== 'prep';
}

function renderWavePanel() {
    const nextIdx = state.phase === 'running' ? state.wave - 1 : state.wave;
    const preview = el('wavePreview');
    if (preview.dataset.wave !== String(nextIdx)) {
        preview.dataset.wave = String(nextIdx);
        preview.innerHTML = '';
        const data = waves[nextIdx];
        if (data) {
            const counts = {};
            for (const e of data.list) counts[e.kind] = (counts[e.kind] || 0) + 1;
            for (const kind of Object.keys(counts)) {
                const T = ZOMBIE_TYPES[kind];
                const chip = document.createElement('div');
                chip.className = 'chip';
                chip.innerHTML = '<i style="background:' + T.edge + '">' + T.glyph + '</i>' + T.name + ' ×' + counts[kind];
                preview.appendChild(chip);
            }
        }
    }
    const btn = el('startWave');
    if (state.phase === 'prep') {
        const n = state.wave + 1;
        btn.textContent = state.betweenTimer != null
            ? '马上开始第 ' + n + ' 波 · ' + Math.ceil(state.betweenTimer) + 's'
            : '开始第 ' + n + ' 波';
    } else if (state.phase === 'running') {
        btn.textContent = '第 ' + state.wave + ' 波进行中…';
    } else {
        btn.textContent = state.phase === 'won' ? '全部波次已清除' : '草坪失守';
    }
}

function renderSelectedPanel() {
    const box = el('selBox');
    if (COMBO && towerSel) { renderTowerPanel(); return; }
    if (!selected || !selected.alive) { box.style.display = 'none'; return; }
    const T = PLANT_TYPES[selected.type];

        el('selKv1').textContent = '生命值';

    el('selDmg').textContent = T.dmg ? T.dmg : '—';
    el('selRate').textContent = T.rate ? (T.rate).toFixed(2) + ' /s' : '—';
    const extraRow = el('selExtraRow');
    if (T.sunEvery) { extraRow.style.display = ''; el('selExtraKey').textContent = '产阳光'; el('selExtraVal').textContent = '+25 / ' + T.sunEvery + 's'; }
    else if (T.bomb) {

// ------------------------------- Persistence -----------------------------
const SAVE_KEY = COMBO ? 'comb_save_v1' : 'pvz3_save_v1';
const PREFS_KEY = COMBO ? 'comb_prefs_v1' : 'pvz3_prefs_v1';
const SAVE_VERSION = 1;

const Store = (() => {
    let ok = null;
    function test() {
        if (ok === null) {
            try {
                window.localStorage.setItem('__pvz3_probe__', '1');
                window.localStorage.removeItem('__pvz3_probe__');
                ok = true;
            } catch (e) { ok = false; }
        }
        return ok;
    }
    return {
        get available() { return test(); },
        read(key) {
            if (!test()) return null;
            try { return window.localStorage.getItem(key); } catch (e) { return null; }
        },
        write(key, value) {
            if (!test()) return false;
            try { window.localStorage.setItem(key, value); return true; } catch (e) { return false; }
        },
        remove(key) {
            if (!test()) return;
            try { window.localStorage.removeItem(key); } catch (e) { /* ignore */ }
        }
    };
})();

function savePrefs() {
    Store.write(PREFS_KEY, JSON.stringify({
        speed: state.speed, muted: Sfx.muted, waves: totalWaves
    }));
}

function applyPrefs() {
    const raw = Store.read(PREFS_KEY);
    if (raw) {
        try {
            const p = JSON.parse(raw);
            if (p && p.speed >= 1 && p.speed <= 3) state.speed = p.speed;
            if (p && typeof p.muted === 'boolean') Sfx.setMuted(p.muted);
            if (p && typeof p.waves === 'number') totalWaves = clampWaveTotal(p.waves);
        } catch (e) { /* ignore corrupt prefs */ }
    }
    for (const btn of el('speedGroup').children) {
        btn.classList.toggle('on', Number(btn.dataset.speed) === state.speed);
    }
    el('btnMute').textContent = Sfx.muted ? '🔇 静音' : '🔊 音效';
    updateRabbitButton();
    syncWaveTotal();
}

function serializeGame() {
    return {
        v: SAVE_VERSION,
        at: Date.now(),
        sun: state.sun,
        wave: state.wave,
        t: state.t,
        phase: state.phase === 'running' ? 'running' : 'prep',
        betweenTimer: state.betweenTimer,
        spawnTimer: state.spawnTimer,
        waveTotal: state.waveTotal,
        skySunTimer: state.skySunTimer,
        bossSpawnTimer: state.bossSpawnTimer,
        speed: state.speed,
        waves: totalWaves,
        rabbit: state.rabbit,
        cooldowns: state.cooldowns,
        spawnQueue: state.spawnQueue.map(s => ({ k: s.kind, t: s.t, h: s.hpMul })),
        plants: plants.filter(p => p.alive).map(p => ({
            k: p.type, c: p.c, r: p.r, h: Math.round(p.hp), m: p.maxHp,
            st: p.sunTimer, cl: p.cool, fu: p.fuse, ar: p.armed
        })),
        zombies: zombies.filter(z => z.alive).map(z => ({
            k: z.kind, r: z.r, x: Math.round(z.x), h: Math.round(z.hp), m: Math.round(z.maxHp),
            a: Math.round(z.armor), am: Math.round(z.maxArmor), sl: z.slowT, sf: z.slowF
        })),
        suns: suns.map(s => ({ x: s.x, y: s.y, ty: s.ty, v: s.value, l: s.life, b: s.born, s: s.fromSky })),
        mowers: mowers.map(m => ({ r: m.r, x: Math.round(m.x), s: m.state })),
        gold: state.gold,
        wall: state.wall,
        towers: towers.map(t => ({ k: t.type, lv: t.level, c: t.c, r: t.r }))
    };
}

function validSave(d) {
    return d && d.v === SAVE_VERSION && typeof d.sun === 'number' &&
        typeof d.wave === 'number' && d.wave <= clampWaveTotal(d.waves) &&
        Array.isArray(d.plants) && Array.isArray(d.zombies) &&
        Array.isArray(d.mowers) && d.mowers.length === ROWS &&
        (!COMBO || Array.isArray(d.towers));
}

function restoreGame(d) {
    resetState();
    totalWaves = clampWaveTotal(d.waves);
    buildWaves();
    syncWaveTotal();
    state.sun = d.sun;
    state.wave = d.wave;
    state.t = d.t || 0;
    state.phase = d.phase === 'running' ? 'running' : 'prep';
    state.betweenTimer = typeof d.betweenTimer === 'number' ? d.betweenTimer : null;
    state.spawnTimer = d.spawnTimer || 0;
    state.waveTotal = d.waveTotal || 0;
    state.skySunTimer = typeof d.skySunTimer === 'number' ? d.skySunTimer : 7;
    state.bossSpawnTimer = typeof d.bossSpawnTimer === 'number' ? d.bossSpawnTimer : 8;
    state.cooldowns = d.cooldowns || {};
    state.rabbit = !!d.rabbit;
    if (state.rabbit) spawnRabbit();
    state.spawnQueue = (d.spawnQueue || []).map(s => ({ kind: s.k, t: s.t, hpMul: s.h }));

    for (const p of d.plants) {
        const T = PLANT_TYPES[p.k];
        if (!T) continue;
        plants.push({
            type: p.k, c: p.c, r: p.r, alive: true,
            x: cellCX(p.c), y: cellCY(p.r),
            hp: p.h, maxHp: p.m || T.hp,
            cool: p.cl || 0,
            sunTimer: typeof p.st === 'number' ? p.st : (T.sunEvery || 0),
            fuse: typeof p.fu === 'number' ? p.fu : (MINE_BOMBS[T.bomb] ? 14 : (T.bomb ? 1.6 : 0)),
            armed: p.ar !== false,
            grow: 1, hurtT: 0, anim: Math.random() * 6.28
        });
    }
    for (const z of d.zombies) {
        const T = ZOMBIE_TYPES[z.k];
        if (!T) continue;
        zombies.push({
            kind: z.k, r: z.r, x: z.x, y: cellCY(z.r),
            hp: z.h, maxHp: z.m, armor: z.a, maxArmor: z.am,
            speed: T.speed, slowT: z.sl || 0, slowF: z.sf || 1,
            alive: true, eating: null, walkPhase: Math.random() * 6.28,
            biteTimer: 0, hurtT: 0, spendT: 0
        });
    }
    for (const s of (d.suns || [])) {
        suns.push({ x: s.x, y: s.y, ty: s.ty, vy: 42, value: s.v, life: s.l, born: s.b || 0, taken: false, fromSky: !!s.s });
    }
    mowers = d.mowers.map(m => ({ r: m.r, x: m.x, state: m.s }));

    if (COMBO) {
        state.gold = typeof d.gold === 'number' ? d.gold : START_GOLD;
        state.wall = typeof d.wall === 'number' ? d.wall : START_WALL;
        towers = (d.towers || [])
            .filter(t => TOWER_TYPES[t.k] && t.lv >= 1 && t.lv <= TOWER_MAX_LEVEL && inLawn(t.c, t.r))
            .map(t => ({
                type: t.k, level: t.lv, c: t.c, r: t.r,
                x: cellCX(t.c), y: cellCY(t.r),
                stats: statsFor(t.k, t.lv), cd: 0, aim: Math.PI
            }));
    }

    state.paused = false;
    el('btnPause').textContent = '暂停';
    updateHud();
    renderWavePanel();
    renderSelectedPanel();
}

function saveGame(quiet) {
    if (state.phase === 'over' || state.phase === 'won') return;
    const ok = Store.write(SAVE_KEY, JSON.stringify(serializeGame()));
    if (!quiet) toast(ok ? '进度已保存' : '无法写入存档（浏览器限制）', !ok);
}

function scheduleAutoSave() {
    clearTimeout(scheduleAutoSave._t);
    scheduleAutoSave._t = setTimeout(() => saveGame(true), 700);
}

function readSave() {
    const raw = Store.read(SAVE_KEY);
    if (!raw) return null;
    try {
        const d = JSON.parse(raw);
        return validSave(d) ? d : null;
    } catch (e) { return null; }
}

function clearSave() { Store.remove(SAVE_KEY); }

function loadGame() {
    const d = readSave();
    if (!d) { toast('没有找到存档', true); return; }
    Sfx.unlock();
    hideOverlay();
    restoreGame(d);
    buildType = null; shovelMode = false; selected = null; towerSel = null;
    syncSelectionUI();
    toast('已读取存档 · 第 ' + d.wave + ' 波');
}

function newGame() {
    clearSave();
    resetState();
    applyPrefs();
    buildWaves();
    buildType = null; shovelMode = false; selected = null; towerSel = null; towerType = null;
    syncSelectionUI();
    updateHud();
    renderWavePanel();
    renderSelectedPanel();
    banner('先种几株向日葵积攒阳光');
}

// ------------------------------- Input -----------------------------------
function canvasPos(evt) {
    const rect = cv.getBoundingClientRect();
    return {
        x: (evt.clientX - rect.left) * (CANVAS_W / rect.width),
        y: (evt.clientY - rect.top) * (CANVAS_H / rect.height)
    };
}

function tryCollectSun(x, y) {
    let best = null, bestD = 34 * 34;
    for (const s of suns) {
        if (s.taken) continue;
        const d = dist2(s.x, s.y, x, y);
        if (d < bestD) { bestD = d; best = s; }
    }
    if (best) { collectSun(best); return true; }
    return false;
}

function togglePause() {
    if (state.phase === 'over' || state.phase === 'won') return;
    state.paused = !state.paused;
    el('btnPause').textContent = state.paused ? '继续' : '暂停';
}

function wireInput() {
    cv.addEventListener('pointermove', e => {
        const p = canvasPos(e);
        const c = cellOf(p.x, p.y);
        hover = inLawn(c.c, c.r) ? c : { c: -1, r: -1 };
        if (drag) {
            drag.x = p.x;
            drag.y = p.y;
            if (Math.hypot(p.x - drag.sx, p.y - drag.sy) > 10) drag.moved = true;
        }
    });
    cv.addEventListener('pointerleave', () => { hover = { c: -1, r: -1 }; });

    cv.addEventListener('pointerdown', e => {
        Sfx.unlock();
        if (e.button === 2) { cancelSelection(); clearSelection(); renderSelectedPanel(); return; }
        if (state.paused || state.phase === 'over' || state.phase === 'won') return;
        const p = canvasPos(e);
        if (tryCollectSun(p.x, p.y)) return;

        const cell = cellOf(p.x, p.y);
        if (!inLawn(cell.c, cell.r)) {
            cancelSelection();
            clearSelection();
            renderSelectedPanel();
            return;
        }
        const existing = plantAt(cell.c, cell.r);
        const existingTower = COMBO ? towerAt(cell.c, cell.r) : null;

        if (shovelMode) {
            if (existing) { digPlant(existing); renderSelectedPanel(); }
            else toast('这里没有植物', true);
            return;
        }
        if (COMBO && towerType) {
            const key = towerType;
            if (placeTower(key, cell.c, cell.r)) {
                // keep the tower armed while you can still afford another
                if (state.gold < TOWER_TYPES[key].cost) towerType = null;
                syncSelectionUI();
            }
            return;
        }
        if (buildType) {
            const key = buildType;
            if (placePlant(key, cell.c, cell.r)) {
                const T = PLANT_TYPES[key];
                if (state.sun < T.cost || (state.cooldowns[key] || 0) > 0 || !canPlant(cell.c, cell.r)) {
                    buildType = null;
                }
                syncSelectionUI();
            }
            return;
        }
        if (existingTower) {
            towerSel = existingTower;
            selected = null;
            renderSelectedPanel();
            return;
        }
        selected = existing || null;
        towerSel = null;
        renderSelectedPanel();
        // 按住植物拖动 = 把它拖到另一株植物身上融合
        if (existing) drag = { plant: existing, x: p.x, y: p.y, sx: p.x, sy: p.y, moved: false };
    });

    window.addEventListener('pointerup', () => {
        if (!drag) return;
        const d = drag;
        drag = null;
        if (!d.moved || !d.plant.alive) return;
        const cell = cellOf(d.x, d.y);
        if (!inLawn(cell.c, cell.r)) return;
        const target = plantAt(cell.c, cell.r);
        if (target && target !== d.plant) tryFuse(d.plant, target);
    });

    cv.addEventListener('contextmenu', e => {
        e.preventDefault();
        cancelSelection();
        clearSelection();
        renderSelectedPanel();
    });

    window.addEventListener('keydown', e => {
        if (e.key >= '1' && e.key <= '9') {
            const i = Number(e.key) - 1;
            if (i < PLANT_ORDER.length) selectPacket(PLANT_ORDER[i]);
            return;
        }
        if (COMBO) {
            const ti = 'qwer'.indexOf(e.key.toLowerCase());
            if (e.key.length === 1 && ti >= 0) { selectTowerType(TOWER_ORDER[ti]); return; }
        }
        if (e.key === 'Escape') {
            cancelSelection();
            clearSelection();
            renderSelectedPanel();
        } else if (e.key === ' ') {
            e.preventDefault();
            togglePause();
        } else if (e.key === 'n' || e.key === 'N') {
            if (state.phase === 'prep') { Sfx.unlock(); startWave(); }
        }
    });
}

function wireButtons() {
    el('startWave').addEventListener('click', () => {
        Sfx.unlock();
        if (state.phase === 'prep') startWave();
    });
    el('shovel').addEventListener('click', () => {
        Sfx.unlock();
        shovelMode = !shovelMode;
        if (shovelMode) { buildType = null; towerType = null; }
        selected = null;
        towerSel = null;
        syncSelectionUI();
        renderSelectedPanel();
        if (shovelMode) toast('点一下草坪上的植物即可铲除');
    });
    el('btnDig').addEventListener('click', () => {
        if (selected) { digPlant(selected); renderSelectedPanel(); }
    });
    if (COMBO) {
        el('btnUpgrade').addEventListener('click', () => { Sfx.unlock(); upgradeSelectedTower(); });
        el('btnSell').addEventListener('click', () => { Sfx.unlock(); sellSelectedTower(); });
    }
    el('waveTotal').addEventListener('input', () => { el('waveTotalVal').textContent = el('waveTotal').value; });
    el('waveTotal').addEventListener('change', () => setWaveTotal(el('waveTotal').value));
    el('btnPause').addEventListener('click', togglePause);
    el('btnMute').addEventListener('click', () => {
        Sfx.unlock();
        Sfx.setMuted(!Sfx.muted);
        el('btnMute').textContent = Sfx.muted ? '🔇 静音' : '🔊 音效';
        savePrefs();
    });
    el('btnRabbit').addEventListener('click', () => { Sfx.unlock(); buyRabbit(); });
    for (const btn of el('speedGroup').children) {
        btn.addEventListener('click', () => {
            state.speed = Number(btn.dataset.speed);
            for (const b of el('speedGroup').children) b.classList.toggle('on', b === btn);
            savePrefs();
        });
    }
    el('btnSave').addEventListener('click', () => saveGame(false));
    el('btnLoad').addEventListener('click', loadGame);
    el('btnRestart').addEventListener('click', () => {
        if (!el('btnRestart').dataset.armed) {
            el('btnRestart').dataset.armed = '1';
            el('btnRestart').textContent = '确认重开？';
            setTimeout(() => {
                delete el('btnRestart').dataset.armed;
                el('btnRestart').textContent = '重新开始';
            }, 2600);
            return;
        }
        delete el('btnRestart').dataset.armed;
        el('btnRestart').textContent = '重新开始';
        hideOverlay();
        newGame();
        toast('已重新开始');
    });
    el('btnClear').addEventListener('click', () => {
        clearSave();
        toast('存档已清除');
    });
}

// ------------------------------- Main loop -------------------------------
let last = 0;
let uiTimer = 0;

function frame(now) {
    if (!__alive) return;
    if (!last) last = now;
    let dt = (now - last) / 1000;
    last = now;
    if (dt > 0.05) dt = 0.05;
    if (dt < 0) dt = 0;

    if (!state.paused && (state.phase === 'prep' || state.phase === 'running')) {
        for (let i = 0; i < state.speed; i++) update(dt);
    } else {
        state.t += dt;
    }

    uiTimer -= dt;
    if (uiTimer <= 0) {
        uiTimer = 0.2;
        updatePackets();
        updateHud();
        if (state.phase === 'prep' || state.phase === 'running') renderWavePanel();
        if (selected || towerSel) renderSelectedPanel();
        else if (el('selBox').style.display !== 'none') el('selBox').style.display = 'none';
    }

    renderTowerList();

    wireInput();

    updateHud();

    for (const id of __timers) window.clearTimeout(id);
    __timers.length = 0;
    root.innerHTML = '';
};

        '？': '?',
        '、': ', ',
        '；': '; ',
        '：': ': '
    };

    const zhKeys = Object.keys(DICT).sort((a, b) => b.length - a.length);
    let fragRe = null;
    function fragPattern() {
        if (!fragRe) {
            const escaped = zhKeys.map(k => k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
            fragRe = new RegExp(escaped.join('|'), 'g');
        }
        return fragRe;
    }

    let lang = 'zh';
    try {
        const saved = window.localStorage.getItem(KEY);
        if (saved === 'en' || saved === 'zh') lang = saved;
    } catch (e) { /* storage blocked - Chinese it is */ }

    // Whole string first, then the longest fragments inside it. Whitespace
    // around the node keeps its shape; HTML collapses any doubled space.
    function t(s) {
        if (lang !== 'en' || !s || !CJK.test(s)) return s;
        const m = /^(\s*)([\s\S]*?)(\s*)$/.exec(s);
        const core = m[2];
        if (DICT[core] !== undefined) return m[1] + DICT[core] + m[3];
        const out = core.replace(fragPattern(), k => (DICT[k] !== undefined ? DICT[k] : k));
        return out === core ? s : m[1] + out + m[3];
    }

    // Nodes keep their Chinese original, so a toggle back to 中文 is exact.
    const zhText = new WeakMap();
    const zhAttr = new WeakMap();
    let zhTitle = null;

    function doText(node) {
        const v = node.nodeValue;
        if (lang === 'en') {
            if (!v || !CJK.test(v)) return;
            const en = t(v);
            if (en !== v) { zhText.set(node, v); node.nodeValue = en; }
            return;
        }
        const zh = zhText.get(node);
        if (zh === undefined) return;
        zhText.delete(node);
        // the page wrote fresh Chinese over our English - leave it alone
        if (!CJK.test(v)) node.nodeValue = zh;
    }

    function doAttrs(elm) {
        let saved = zhAttr.get(elm);
        for (const a of ATTRS) {
            const v = elm.getAttribute(a);
            if (v == null) continue;
            if (lang === 'en') {
                if (!CJK.test(v)) continue;
                const en = t(v);
                if (en === v) continue;
                if (!saved) { saved = {}; zhAttr.set(elm, saved); }
                saved[a] = v;
                elm.setAttribute(a, en);
            } else if (saved && saved[a] !== undefined) {
                // the page rewrote it in Chinese over our English - leave it be
                if (!CJK.test(v)) elm.setAttribute(a, saved[a]);
                delete saved[a];
            }
        }
    }

    function walk(node) {
        for (let n = node.firstChild; n; n = n.nextSibling) {
            if (n.nodeType === 3) { doText(n); continue; }
            if (n.nodeType !== 1) continue;
            if (SKIP_TAG[n.tagName] || n.hasAttribute('data-lang-toggle')) continue;
            doAttrs(n);
            walk(n);
        }
    }

    function doTitle() {
        if (lang === 'en') {
            const v = document.title;
            if (!CJK.test(v)) return;
            const en = t(v);
            if (en !== v) { zhTitle = v; document.title = en; }
        } else if (zhTitle !== null && document.title !== zhTitle) {
            document.title = zhTitle;
            zhTitle = null;
        }
    }

    function label() {
        for (const b of document.querySelectorAll('[data-lang-toggle]')) {
            b.textContent = lang === 'en' ? '中' : 'EN';
            const hint = lang === 'en' ? '切换到中文 · Switch to Chinese' : 'Switch to English · 切换语言';
            b.setAttribute('title', hint);
            b.setAttribute('aria-label', hint);
        }
    }

    function apply() {
        label();
        doTitle();
        walk(document.body);
    }

    function set(next) {
        lang = next === 'en' ? 'en' : 'zh';
        try { window.localStorage.setItem(KEY, lang); } catch (e) { /* storage blocked */ }
        apply();
    }

    document.addEventListener('click', e => {
        const btn = e.target && e.target.closest ? e.target.closest('[data-lang-toggle]') : null;
        if (!btn) return;
        e.preventDefault();
        set(lang === 'en' ? 'zh' : 'en');
    });

    // The games rebuild their own DOM on a timer, so keep sweeping the page.
    // Text that is already English has no CJK left in it and costs one test.
    function tick() {
        apply();
        window.requestAnimationFrame(tick);
    }
    window.requestAnimationFrame(tick);

    return {
        get lang() { return lang; },
        t,
        set,
        apply
    };
})();
</script>
<script>

(() => {
'use strict';

const SAVE_KEYS = { gwd: 'gwd_save_v1', pvz: 'pvz3_save_v1', comb: 'comb_save_v1' };
const TITLES = {
    gwd: '长城守卫战 · Great Wall Defense',
    pvz: '植物大战僵尸 3 · Plants vs. Zombies 3',
    comb: '组合模式 · Wall × Lawn'
};
const HOME_TITLE = 'Andrew 的游戏合集 · Game Collection';

const picker = document.getElementById('picker');
const viewport = document.getElementById('viewport');
const switchBtn = document.getElementById('switchBtn');
let stopFn = null;

function readSave(key) {
    try {
        const raw = window.localStorage.getItem(key);
        return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
}

function setSaveText(key, text) {
    const node = document.querySelector('[data-save="' + key + '"]');
    if (node) node.textContent = text;
}

function refreshSaves() {
    const g = readSave(SAVE_KEYS.gwd);
    const p = readSave(SAVE_KEYS.pvz);
    const c = readSave(SAVE_KEYS.comb);
    setSaveText('gwd', g
        ? '存档 · 第 ' + g.wave + ' / ' + (g.waves || 20) + ' 波 · 银两 ' + g.gold + ' · 城墙 ' + g.life
        : '暂无存档');
    setSaveText('pvz', p
        ? '存档 · 第 ' + p.wave + ' / ' + (p.waves || 20) + ' 波 · 阳光 ' + Math.floor(p.sun) + ' · 割草机 ' +
          (p.mowers || []).filter(m => m.s === 'idle').length
        : '暂无存档');
    setSaveText('comb', c
        ? '存档 · 第 ' + c.wave + ' / ' + (c.waves || 20) + ' 波 · 阳光 ' + Math.floor(c.sun) + ' · 银两 ' + (c.gold || 0) +
          ' · 城墙 ' + (c.wall != null ? c.wall : '-')
        : '暂无存档');
}

function unmount() {
    if (stopFn) {
        try { stopFn(); } catch (e) { /* already torn down */ }
        stopFn = null;
    }
    viewport.classList.remove('comb');
    viewport.innerHTML = '';
}

function mount(mode) {
    // combined mode reuses the lawn template, plus the tower pieces it adds
    const tpl = document.getElementById(mode === 'comb' ? 'tpl-pvz' : 'tpl-' + mode);
    if (!tpl || !window.__GAMES[mode]) return;
    unmount();
    viewport.appendChild(tpl.content.cloneNode(true));
    if (mode === 'comb') viewport.classList.add('comb');
    stopFn = window.__GAMES[mode](viewport, true);
    picker.hidden = true;
    switchBtn.hidden = false;
    document.title = TITLES[mode];
}

function showPicker() {
    unmount();
    refreshSaves();
    picker.hidden = false;
    switchBtn.hidden = true;
    document.title = HOME_TITLE;
}

for (const card of document.querySelectorAll('.pk-card')) {
    card.addEventListener('click', () => mount(card.dataset.mode));
}
switchBtn.addEventListener('click', showPicker);

// The cards must always mirror the saves on disk, not the state when the page
// was opened. Refresh them whenever something outside the picker could have
// changed a save: another tab wrote or cleared one, or the page came back from
// the back/forward cache or from a background tab.
const SAVE_KEY_LIST = Object.keys(SAVE_KEYS).map(k => SAVE_KEYS[k]);
function isGameSaveKey(key) { return key === null || SAVE_KEY_LIST.indexOf(key) >= 0; }
window.addEventListener('storage', e => { if (isGameSaveKey(e.key)) refreshSaves(); });
window.addEventListener('pageshow', refreshSaves);
document.addEventListener('visibilitychange', () => { if (!document.hidden) refreshSaves(); });
// Slow safety net for anything the events above miss (e.g. storage cleared from
// outside the page): cheap, and only ticks while the picker is what you see.
setInterval(() => { if (!picker.hidden) refreshSaves(); }, 2000);

refreshSaves();
})();

</script>
</body>
</html>

// ------------------------------- Waves -----------------------------------
let waves = [];

function buildWaves() {
    waves = [];
    for (let w = 1; w <= totalWaves; w++) {
        const row = waveRow(w);
        const hpMul = waveHpMul(w);
        const countMul = waveCountMul(w);
        const list = [];
        for (const key of Object.keys(row)) {
            if (key === 'boss' || key === 'boss2') { list.push({ kind: row[key], t: 0 }); continue; }
            for (let i = 0; i < Math.round(row[key] * countMul); i++) list.push({ kind: key, t: 0 });
        }
        const n = list.length;
        const dur = Math.max(16, 18 + (((w - 1) % waveTable().length) + 1) * 1.2);
        let idx2 = 0;
        for (const e of list) {
            if (ZOMBIE_TYPES[e.kind].flag || ZOMBIE_TYPES[e.kind].boss) e.t = 0;
            else e.t = (idx2++ / Math.max(1, n)) * dur + rand(-0.7, 0.7);
            if (e.t < 0) e.t = 0;
        }
        list.sort((a, b) => a.t - b.t);
        // keep spawns from stacking on top of each other
        let last = -1;
        for (const e of list) { e.t = Math.max(e.t, last + 0.45); last = e.t; }
        waves.push({ hpMul, list, total: n, dur });
    }
}

// 第 w 波套用波表里的哪一行：走完一圈从头再来，同时难度升一档。
function waveTable() { return COMBO ? COMBO_WAVE_TABLE : WAVE_TABLE; }
function waveRow(w) { return waveTable()[(w - 1) % waveTable().length]; }
function waveTier(w) { return Math.floor((w - 1) / waveTable().length); }
function waveCountMul(w) { return 1 + waveTier(w) * 0.3; }
function waveHpMul(w) {
    const pos = ((w - 1) % waveTable().length) + 1;
    return (1 + (pos - 1) * 0.08) * (1 + waveTier(w) * 0.40);
}

// ------------------------------- Wave count ------------------------------
function clampWaveTotal(n) {
    return clamp(Math.round((Number(n) || WAVE_MIN) / WAVE_STEP) * WAVE_STEP, WAVE_MIN, WAVE_MAX);
}

function syncWaveTotal() {
    const input = el('waveTotal');
    if (!input) return;
    input.value = totalWaves;
    el('waveTotalVal').textContent = totalWaves;
}

// 滑块选的是整局的总波数：已经打过的波不动，多出来的部分重新生成。
function setWaveTotal(n) {
    const next = clampWaveTotal(n);
    if (next === totalWaves) { syncWaveTotal(); return; }
    if (next <= state.wave) {
        toast('总波数不能少于当前第 ' + state.wave + ' 波', true);
        syncWaveTotal();
        return;
    }
    totalWaves = next;
    buildWaves();
    savePrefs();
    syncWaveTotal();
    updateHud();
    renderWavePanel();
}

function currentWaveData() { return waves[state.wave - 1] || null; }

function startWave() {
    if (state.phase !== 'prep') return;
    state.wave++;
    const data = currentWaveData();
    if (!data) return;
    state.spawnQueue = data.list.map(e => ({ kind: e.kind, t: e.t, hpMul: data.hpMul }));
    state.spawnTimer = 0;
    state.waveTotal = data.total;
    state.phase = 'running';
    state.betweenTimer = null;
    state.bossSpawnTimer = 8;

    const isFlag = state.wave % 5 === 0;
    if (isFlag) {
        banner('一大波僵尸正在接近！', true);
        Sfx.horn();
    } else {
        banner('第 ' + state.wave + ' 波来了');
        Sfx.wave();
    }
    if (data.list.some(e => ZOMBIE_TYPES[e.kind].boss)) Sfx.boss();
    renderWavePanel();
    updateHud();
}

function updateWaves(dt) {
    if (state.phase === 'prep') {
        if (state.betweenTimer != null) {
            state.betweenTimer -= dt;
            if (state.betweenTimer <= 0) startWave();
        }
        return;
    }
    if (state.phase !== 'running') return;

    state.spawnTimer += dt;
    while (state.spawnQueue.length && state.spawnQueue[0].t <= state.spawnTimer) {
        const s = state.spawnQueue.shift();
        spawnZombie(s.kind, s.hpMul);
    }

    // the zombie doctor calls for reinforcements
    if (zombies.some(z => z.alive && ZOMBIE_TYPES[z.kind].spawner)) {
        state.bossSpawnTimer -= dt;
        if (state.bossSpawnTimer <= 0) {
            state.bossSpawnTimer = rand(7, 10);
            spawnZombie('basic', currentWaveData() ? currentWaveData().hpMul : 1);
        }
    }

    if (!state.spawnQueue.length && !zombies.some(z => z.alive)) onWaveCleared();
}

function onWaveCleared() {
    if (state.phase !== 'running') return;
    if (state.wave >= totalWaves) {
        state.phase = 'won';
        Sfx.win();
        showOverlay('victory');
        clearSave();
        return;
    }
    state.phase = 'prep';
    state.betweenTimer = 10;
    banner('第 ' + state.wave + ' 波已清除');
    // 长局里阳光也得跟上，否则后面几档只能干看着
    addSun(25 + waveTier(state.wave) * 15);
    saveGame(true);
    renderWavePanel();
    updateHud();
}

function spawnZombie(kind, hpMul) {
    const T = ZOMBIE_TYPES[kind];
    const r = (Math.random() * ROWS) | 0;
    const hp = T.hp * (hpMul || 1);
    zombies.push({
        kind, r,
        x: CANVAS_W + rand(20, 120),
        y: cellCY(r),
        hp,
        maxHp: hp,
        armor: T.armor * (hpMul || 1),
        maxArmor: T.armor * (hpMul || 1),
        speed: T.speed,
        slowT: 0,
        slowF: 1,
        healTimer: T.healEvery ? T.healEvery * 0.5 : 0,
        dashTimer: T.dashEvery ? T.dashEvery * 0.5 : 0,
        dashFor: 0,
        spitTimer: T.spitEvery ? T.spitEvery * 0.5 : 0,
        stealTimer: T.stealEvery ? T.stealEvery * 0.5 : 0,
        vaultFor: 0,
        vaulted: false,
        alive: true,
        eating: null,
        walkPhase: Math.random() * 6.28,
        biteTimer: 0,
        hurtT: 0,
        spendT: 0
    });
}

// ------------------------------- Sun economy -----------------------------
function addSun(n) {
    state.sun += n;
    flashStat('statSunBox');
    updateHud();
}

function spendSun(n) {
    if (state.sun < n) return false;
    state.sun -= n;
    updateHud();
    return true;
}

function dropSun(x, y, value, fromSky, tyTarget) {
    suns.push({
        x, y,
        ty: tyTarget != null ? tyTarget : (fromSky ? y + rand(40, 90) : y + 26),
        vy: fromSky ? 42 : 90,
        value: value || 25,
        life: fromSky ? 14 : 11,
        born: 0,
        taken: false,
        fromSky: !!fromSky
    });
}

function collectSun(s) {
    if (s.taken) return;
    s.taken = true;
    addSun(s.value);
    pushFloat(s.x, s.y - 14, '+' + s.value, '#f7dd7a');
    Sfx.collect();
}

function updateSuns(dt) {
    state.skySunTimer -= dt;
    if (state.skySunTimer <= 0) {
        state.skySunTimer = rand(7, 11);
        const c = (Math.random() * COLS) | 0;
        const r = (Math.random() * ROWS) | 0;
        dropSun(cellCX(c) + rand(-18, 18), LAWN_Y - 24, 25, true, cellCY(r) + rand(-16, 16));
    }
    for (const s of suns) {
        if (s.taken) continue;
        s.born += dt;
        if (s.y < s.ty) {
            s.y = Math.min(s.ty, s.y + s.vy * dt);
        } else {
            s.life -= dt;
        }
    }
    suns = suns.filter(s => !s.taken && s.life > 0);
}

// ------------------------------- 兔子园丁 · rabbit gardener ---------------
// Hired once for RABBIT_COST sun. From then on it lives on the lawn and hops
// over to pick up every sun that lands, then waits right there for the next one.
const RABBIT_SPEED = 250;
const RABBIT_SPAWN = { x: LAWN_X + 26, y: LAWN_B - 16 };
let rabbit = null;

function spawnRabbit() {
    rabbit = { x: RABBIT_SPAWN.x, y: RABBIT_SPAWN.y, face: 1, anim: 0, hopAmp: 0, hold: 0 };
}

// 找最近的一颗阳光；快消失的优先，免得白跑。
function rabbitTarget() {
    let best = null, bestScore = Infinity;
    for (const s of suns) {
        if (s.taken || s.y < s.ty) continue;
        const score = Math.hypot(s.x - rabbit.x, s.y - rabbit.y) + s.life * 20;
        if (score < bestScore) { bestScore = score; best = s; }
    }
    return best;
}

function updateRabbit(dt) {
    if (!rabbit) return;
    rabbit.anim += dt;
    if (rabbit.hold > 0) rabbit.hold -= dt;

    const target = rabbit.hold > 0 ? null : rabbitTarget();
    let d = 0;
    if (target) {
        const ty = clamp(target.y, LAWN_Y + 14, LAWN_B - 14);
        const dx = target.x - rabbit.x, dy = ty - rabbit.y;
        d = Math.hypot(dx, dy);
        if (d > 2) {
            const step = Math.min(d, RABBIT_SPEED * dt);
            rabbit.x += dx / d * step;
            rabbit.y += dy / d * step;
            if (Math.abs(dx) > 1) rabbit.face = dx < 0 ? -1 : 1;
        }
    }
    // 只有跑起来才蹦；没有阳光要捡就原地趴着
    if (target && d > 22) rabbit.hopAmp = Math.min(1, rabbit.hopAmp + dt * 6);
    else rabbit.hopAmp = Math.max(0, rabbit.hopAmp - dt * 6);

    if (target && d < 22) {
        collectSun(target);
        rabbit.hold = 0.3;
    }
    // 阳光快消失了，兔子来不及跑到就先收起来，别白白浪费
    for (const s of suns) {
        if (!s.taken && s.y >= s.ty && s.life < 1.5) collectSun(s);
    }
}

// ------------------------------- Plants ----------------------------------
function plantAt(c, r) { return plants.find(p => p.c === c && p.r === r && p.alive); }

function canPlant(c, r) {
    return inLawn(c, r) && !plantAt(c, r) && !towerAt(c, r);
}

function makePlant(key, c, r) {
    const T = PLANT_TYPES[key];
    return {
        type: key, c, r, alive: true,
        x: cellCX(c), y: cellCY(r),
        hp: T.hp, maxHp: T.hp,
        cool: T.rate ? T.rate * 0.55 : 0,
        sunTimer: T.sunEvery ? T.sunEvery * 0.5 : 0,
        healTimer: T.healEvery ? T.healEvery * 0.5 : 0,
        stripTimer: T.stripEvery ? T.stripEvery * 0.7 : 0,
        shockTimer: T.shockEvery ? T.shockEvery * 0.6 : 0,
        pushTimer: T.pushEvery ? T.pushEvery * 0.6 : 0,
        fuse: MINE_BOMBS[T.bomb] ? 14 : (T.bomb ? 1.6 : 0),
        armed: !MINE_BOMBS[T.bomb],
        grow: 0,
        hurtT: 0,
        anim: Math.random() * 6.28
    };
}

function placePlant(key, c, r) {
    const T = PLANT_TYPES[key];
    if (!T || !inLawn(c, r)) return false;
    if (state.phase === 'over' || state.phase === 'won') return false;
    if (!canPlant(c, r)) { toast('这里已经有植物了', true); return false; }
    if ((state.cooldowns[key] || 0) > 0) { toast(T.name + ' 还在冷却中', true); return false; }
    if (state.sun < T.cost) { toast('阳光不足，需要 ' + T.cost + ' ☀', true); return false; }

    spendSun(T.cost);
    state.cooldowns[key] = T.cd;
    plants.push(makePlant(key, c, r));
    Sfx.plant();
    hover = { c: -1, r: -1 };
    scheduleAutoSave();
    return true;
}

// 把 a 拖到 b 身上：两者消失，在 b 的位置长出一株融合植物。
function tryFuse(a, b) {
    if (!a || !b || a === b || !a.alive || !b.alive) return false;
    const outKey = fusionOf(a.type, b.type);
    if (!outKey) {
        toast(PLANT_TYPES[a.type].name + ' + ' + PLANT_TYPES[b.type].name + ' 无法融合', true);
        return false;
    }
    const H = PLANT_TYPES[outKey];
    a.alive = false;
    b.alive = false;
    const fused = makePlant(outKey, b.c, b.r);
    fused.grow = 0.25;
    plants.push(fused);
    burst(fused.x, fused.y - 8, H.color, 28, 210);
    pushFloat(fused.x, fused.y - 40, '融合 · ' + H.name, '#ffe98f');
    Sfx.fuse();
    selected = fused;
    renderSelectedPanel();
    scheduleAutoSave();
    return true;
}

function damagePlant(p, dmg) {
    if (!p.alive) return;
    p.hp -= dmg;
    p.hurtT = 0.12;
    if (p.hp <= 0) {
        p.alive = false;
        p.hp = 0;
        burst(p.x, p.y, PLANT_TYPES[p.type].color, 10, 90);
    }
}

function digPlant(p) {
    if (!p || !p.alive) return;
    p.alive = false;
    pushFloat(p.x, p.y - 16, '已铲除', '#cfdcbb');
    Sfx.dig();
    if (selected === p) selected = null;
    scheduleAutoSave();
}

function updatePlants(dt) {
    for (const p of plants) {
        if (!p.alive) continue;
        const T = PLANT_TYPES[p.type];
        p.anim += dt;
        if (p.hurtT > 0) p.hurtT -= dt;
        if (p.grow < 1) p.grow = Math.min(1, p.grow + dt * 2.6);

        if (T.sunEvery) {
            p.sunTimer -= dt;
            if (p.sunTimer <= 0) {
                p.sunTimer = T.sunEvery;
                dropSun(p.x, p.y - 6, T.sunValue || 25, false);
            }
        }

        if (T.heal) {
            p.healTimer -= dt;
            if (p.healTimer <= 0) {
                p.healTimer = T.healEvery;
                const target = plants
                    .filter(other => other !== p && other.alive && other.hp < other.maxHp &&
                        Math.abs(other.c - p.c) <= 1 && Math.abs(other.r - p.r) <= 1)
                    .sort((a, b) => (a.hp / a.maxHp) - (b.hp / b.maxHp))[0];
                if (target) {
                    target.hp = Math.min(target.maxHp, target.hp + T.heal);
                    burst(target.x, target.y - 18, T.color, 10, 70);
                    pushFloat(target.x, target.y - 28, '+' + T.heal, '#bdf49d');
                }
            }
        }

        // 地刺：僵尸踩在格子上就一直掉血（它啃不动，只能踩过去）
        if (T.spikeDps) {
            for (const z of zombies) {
                if (!z.alive || z.r !== p.r) continue;
                if (Math.abs(z.x - p.x) > 44) continue;
                hitZombie(z, T.spikeDps * dt, p.x);
            }
        }

        // 磁力菇：定期吸掉附近护甲最厚的僵尸身上的护甲
        if (T.stripEvery) {
            p.stripTimer -= dt;
            if (p.stripTimer <= 0) {
                p.stripTimer = T.stripEvery;
                const armored = zombies
                    .filter(z => z.alive && z.armor > 0 &&
                        Math.hypot(z.x - p.x, (z.r - p.r) * CELL_H) <= T.stripRange)
                    .sort((a, b) => b.armor - a.armor)[0];
                if (armored) {
                    const taken = Math.min(armored.armor, T.strip);
                    armored.armor -= taken;
                    burst(armored.x, armored.y - 22, '#c77fe0', 14, 120);
                    pushFloat(armored.x, armored.y - 48, '-' + Math.round(taken) + ' 护甲', '#e2b0f0');
                    Sfx.fuse();
                }
            }
        }

        // 寒霜兰：持续散发寒气，光环内的僵尸一直被减速
        if (T.auraSlow) {
            for (const z of zombies) {
                if (!z.alive) continue;
                if (Math.hypot(z.x - p.x, (z.r - p.r) * CELL_H) > T.auraRange) continue;
                applySlow(z, T.auraSlow, 0.3);
            }
        }

        // 震地瓜：按节奏震出一圈冲击波
        if (T.shockEvery) {
            p.shockTimer -= dt;
            if (p.shockTimer <= 0) {
                p.shockTimer = T.shockEvery;
                burst(p.x, p.y, '#e0b56e', 24, 210);
                for (const z of zombies) {
                    if (!z.alive) continue;
                    if (Math.hypot(z.x - p.x, (z.r - p.r) * CELL_H) > T.shockRange) continue;
                    hitZombie(z, T.shockDmg, p.x);
                }
                Sfx.boom();
            }
        }

        // 疾风荚：把同一排前方的僵尸往回吹
        if (T.pushEvery) {
            p.pushTimer -= dt;
            if (p.pushTimer <= 0) {
                p.pushTimer = T.pushEvery;
                let pushed = 0;
                for (const z of zombies) {
                    if (!z.alive || z.r !== p.r) continue;
                    if (z.x < p.x || z.x - p.x > T.pushRange) continue;
                    z.x = Math.min(CANVAS_W + 40, z.x + T.pushPx);
                    pushed++;
                }
                if (pushed) {
                    burst(p.x + 26, p.y, '#cfeee2', 14, 190);
                    pushFloat(p.x + 24, p.y - 34, '阵风', '#cdf0e2');
                    Sfx.snow();
                }
            }
        }

        if (T.bomb) {
            if (MINE_BOMBS[T.bomb]) {
                if (!p.armed) {
                    p.fuse -= dt;
                    if (p.fuse <= 0) { p.fuse = 0; p.armed = true; }
                    continue;
                }
                const z = zombies.find(zz => zz.alive && zz.r === p.r && Math.abs(zz.x - p.x) < 48);
                if (z) detonate(p);
                continue;
            }
            p.fuse -= dt;
            if (p.fuse <= 0) detonate(p);
            continue;
        }

        if (T.dmg) {
            const rows = attackRows(T, p.r);
            const target = rows.some(rr => laneHasZombie(rr, p.x));
            p.cool -= dt;
            if (p.cool <= 0 && target) {
                p.cool = T.rate;
                for (const rr of rows) {
                    const y = rr === p.r ? p.y : cellCY(rr) + (rr < p.r ? 8 : -8);
                    firePea(p, rr, p.x + 22, y, 0);
                    for (let i = 1; i < (T.burst || 1); i++) {
                        setTimeout(() => { if (p.alive) firePea(p, rr, p.x + 22, y, 0); }, 130 * i);
                    }
                }
            }
        }
    }
    plants = plants.filter(p => p.alive);
}

function attackRows(T, row) {
    if (!T.rows) return [row];
    const count = Math.min(ROWS, T.rows);
    const first = clamp(row - Math.floor(count / 2), 0, ROWS - count);
    return Array.from({ length: count }, (_, i) => first + i);
}

function laneHasZombie(r, fromX) {
    for (const z of zombies) {
        if (!z.alive || z.r !== r) continue;
        if (z.x + 26 > fromX) return z;
    }
    return null;
}

function firePea(p, r, x, y, dmg) {
    const T = PLANT_TYPES[p.type];
    shots.push({
        x, y, r,
        vx: 330,
        dmg: dmg || T.dmg,
        proj: T.proj,
        slow: T.slow || 0,
        slowDur: T.slowDur || 0,
        splash: T.splash || 0,
        chain: T.chain || 0,
        remainingHits: (T.pierce || 0) + 1,
        hitUntilX: -Infinity
    });
    if (T.proj === 'snow') Sfx.snow(); else Sfx.pea();
}

function detonate(p) {
    const T = PLANT_TYPES[p.type];
    p.alive = false;
    Sfx.boom();
    state.flash = (T.bomb === 'mega' || T.bomb === 'inferno') ? 0.3 : 0.22;
    if (T.bomb === 'inferno') {
        burst(p.x, p.y, '#ff8a3d', 34, 260);
        for (const z of zombies) {
            if (z.alive && Math.abs(z.r - p.r) <= 1) hitZombie(z, 2200, p.x);
        }
    } else if (T.bomb === 'frostburst') {
        burst(p.x, p.y, '#81ddff', 30, 230);
        for (const z of zombies) {
            if (!z.alive || Math.hypot(z.x - p.x, (z.r - p.r) * CELL_H) > CELL_W * 1.6) continue;
            hitZombie(z, 180, p.x);
            applySlow(z, 0.35, 4.5);
        }
    } else if (T.bomb === 'blizzard') {
        state.flash = 0.3;
        burst(p.x, p.y, '#9ce7ff', 40, 280);
        burst(p.x, p.y, '#e8fbff', 22, 200);
        for (const z of zombies) {
            if (!z.alive) continue;
            if (Math.abs(z.r - p.r) <= 1 && Math.abs(z.x - p.x) < CELL_W * 2.4) {
                hitZombie(z, 320, p.x);
                applySlow(z, 0.28, 6);
            }
        }
    } else if (T.bomb === 'mega') {
        burst(p.x, p.y, '#ff6a3d', 42, 300);
        for (const z of zombies) {
            if (!z.alive) continue;
            if (Math.abs(z.r - p.r) <= 2 && Math.abs(z.x - p.x) < CELL_W * 2.6) hitZombie(z, 2800, p.x);
        }
    } else if (T.bomb === 'minemulti') {
        burst(p.x, p.y, '#e0a83c', 24, 210);
        zombies.filter(z => z.alive && z.r === p.r && Math.abs(z.x - p.x) < CELL_W * 1.6)
            .sort((a, b) => Math.abs(a.x - p.x) - Math.abs(b.x - p.x))
            .slice(0, 3)
            .forEach(z => hitZombie(z, 2800, p.x));
    } else if (T.bomb === 'jalapeno') {
        burst(p.x, p.y, '#ff8a3d', 26, 220);
        for (const z of zombies) {
            if (z.alive && z.r === p.r && Math.abs(z.x - p.x) < 1400) hitZombie(z, 1800, p.x);
        }
    } else if (T.bomb === 'cherry') {
        burst(p.x, p.y, '#c0392b', 30, 240);
        for (const z of zombies) {
            if (!z.alive) continue;
            if (Math.abs(z.r - p.r) <= 1 && Math.abs(z.x - p.x) < CELL_W * 1.6) hitZombie(z, 1800, p.x);
        }
    } else {
        burst(p.x, p.y, '#e0a83c', 18, 180);
        for (const z of zombies) {
            if (z.alive && z.r === p.r && Math.abs(z.x - p.x) < CELL_W * 0.9) hitZombie(z, 1800, p.x);
        }
    }
    scheduleAutoSave();
}

// ------------------------------- Shots -----------------------------------
function updateShots(dt) {
    for (const s of shots) {
        s.x += s.vx * dt;
        if (s.x > CANVAS_W + 10) { s.dead = true; continue; }
        for (const z of zombies) {
            if (!z.alive || z.r !== s.r) continue;
            const R = ZOMBIE_TYPES[z.kind].radius;
            if (s.x <= s.hitUntilX) continue;
            if (s.x > z.x - R && s.x < z.x + R) {
                hitZombie(z, s.dmg, s.x);
                if (s.slow) applySlow(z, s.slow, s.slowDur);
                if (s.splash) {
                    for (const nearby of zombies) {
                        if (!nearby.alive || nearby === z) continue;
                        if (Math.hypot(nearby.x - z.x, (nearby.r - z.r) * CELL_H) <= s.splash) {
                            hitZombie(nearby, Math.round(s.dmg * 0.65), s.x);
                        }
                    }
                }
                if (s.chain) {
                    const chained = zombies
                        .filter(nearby => nearby.alive && nearby !== z &&
                            Math.hypot(nearby.x - z.x, (nearby.r - z.r) * CELL_H) <= 125)
                        .sort((a, b) => dist2(a.x, a.y, z.x, z.y) - dist2(b.x, b.y, z.x, z.y))
                        .slice(0, s.chain);
                    for (const nearby of chained) {
                        hitZombie(nearby, Math.round(s.dmg * 0.7), s.x);
                        if (s.slow) applySlow(nearby, s.slow, s.slowDur);
                        burst(nearby.x, nearby.y, '#a5f4ff', 6, 75);
                    }
                }
                const shotColor = s.proj === 'snow' ? '#bfe9ff' : s.proj === 'ember' ? '#ff9b51' :
                    s.proj === 'thorn' ? '#c5e58a' : s.proj === 'pollen' ? '#f4df77' :
                    s.proj === 'star' ? '#ffe17b' : s.proj === 'pulse' ? '#a5f4ff' : '#9ede63';
                burst(s.x, s.y, shotColor, 5, 70);
                s.remainingHits -= 1;
                s.hitUntilX = z.x + R;
                if (s.remainingHits <= 0) s.dead = true;
                break;
            }
        }
    }
    shots = shots.filter(s => !s.dead);
}

// ------------------------------- Zombies ---------------------------------
function plantToEat(z) {
    const mouth = z.x - 26;
    let best = null;
    for (const p of plants) {
        if (!p.alive || p.r !== z.r) continue;
        if (PLANT_TYPES[p.type].uneatable) continue;   // 地刺躺在地上，僵尸只能踩过去
        if (mouth <= p.x + 22 && z.x > p.x - 30) {
            if (!best || p.x > best.x) best = p;
        }
    }
    return best;
}

// 僵尸前方射程内最靠前的一株植物（喷吐僵尸用）
function frontPlant(z, range) {
    let best = null;
    for (const p of plants) {
        if (!p.alive || p.r !== z.r) continue;
        if (p.x > z.x || z.x - p.x > range) continue;
        if (!best || p.x > best.x) best = p;
    }
    return best;
}

function applySlow(z, factor, dur) {
    const resistance = ZOMBIE_TYPES[z.kind].slowResist || 0;
    z.slowF = Math.min(z.slowF, Math.max(resistance, factor));
    z.slowT = Math.max(z.slowT, dur);
}

function hitZombie(z, dmg, fromX) {
    if (!z.alive) return;
    // 连续伤害（荆棘反伤）每帧都会打进来，只有全新的一次命中才溅碎屑，
    // 否则一帧一发会把整个屏幕糊满粒子。
    const fresh = z.hurtT <= 0;
    z.hurtT = 0.12;
    if (fresh && fromX != null) {
        const dir = z.x >= fromX ? 1 : -1;
        for (let i = 0; i < 5; i++) {
            fx.push({
                x: z.x + dir * rand(4, 12), y: z.y - rand(12, 30),
                vx: dir * rand(45, 115), vy: rand(-95, -25),
                life: rand(0.18, 0.34), max: 0.34,
                color: i % 3 ? '#bcd98a' : '#7fa85c', r: rand(1.6, 3.1)
            });
        }
    }
    if (z.armor > 0) {
        const absorbed = Math.min(z.armor, dmg);
        z.armor -= absorbed;
        z.hp -= (dmg - absorbed);
    } else {
        z.hp -= dmg;
    }
    if (z.hp <= 0) killZombie(z, fromX);
}

function killZombie(z, fromX) {
    if (!z.alive) return;
    z.alive = false;
    const T = ZOMBIE_TYPES[z.kind];
    burst(z.x, z.y, T.coat, 14, 130);
    pushFloat(z.x, z.y - 20, '☠', '#c9d3b8');
    // 爆裂僵尸：炸开时连带炸伤旁边的植物
    if (T.deathBlast) {
        Sfx.boom();
        burst(z.x, z.y - 6, '#ff9b51', 26, 240);
        for (const p of plants) {
            if (!p.alive) continue;
            if (Math.hypot(p.x - z.x, (p.r - z.r) * CELL_H) > T.blastRange) continue;
            damagePlant(p, T.deathBlast);
            burst(p.x, p.y - 10, '#e0715f', 10, 110);
        }
    }
    if (COMBO) {
        const bounty = T.reward != null ? T.reward : (COMBO_BOUNTY[z.kind] || 0);
        if (bounty) {
            addGold(bounty);
            pushFloat(z.x + 20, z.y - 44, '+' + bounty + ' 银两', '#f2cf7a');
        }
    }
    Sfx.groan();
}

function updateZombies(dt) {
    for (const z of zombies) {
        if (!z.alive) continue;
        const T = ZOMBIE_TYPES[z.kind];
        if (z.hurtT > 0) z.hurtT -= dt;
        if (z.slowT > 0) { z.slowT -= dt; if (z.slowT <= 0) z.slowF = 1; }
        if (z.spendT > 0) z.spendT -= dt;
        if (T.heal) {
            z.healTimer -= dt;
            if (z.healTimer <= 0) {
                z.healTimer = T.healEvery;
                for (const ally of zombies) {
                    if (!ally.alive || ally === z || ally.hp >= ally.maxHp ||
                        !!INVADER_TYPES[ally.kind] !== !!INVADER_TYPES[z.kind] ||
                        Math.hypot(ally.x - z.x, (ally.r - z.r) * CELL_H) > T.healRange) continue;
                    ally.hp = Math.min(ally.maxHp, ally.hp + T.heal);
                    burst(ally.x, ally.y - 14, '#9de68b', 5, 55);
                }
            }
        }
        // 窃阳僵尸：一边走一边顺手摸走你的阳光
        if (T.stealEvery) {
            z.stealTimer -= dt;
            if (z.stealTimer <= 0) {
                z.stealTimer = T.stealEvery;
                const taken = Math.min(state.sun, T.stealSun);
                if (taken > 0) {
                    state.sun -= taken;
                    flashStat('statSunBox');
                    updateHud();
                    burst(z.x, z.y - 30, '#f7dd7a', 8, 80);
                    pushFloat(z.x, z.y - 52, '-' + Math.round(taken) + ' ☀', '#f0b7a0');
                    Sfx.collect();
                }
            }
        }
        // 撑杆僵尸：遇到第一株植物就撑杆跳过去
        if (T.vault && !z.vaulted) {
            const ahead = plants.find(p => p.alive && p.r === z.r && !PLANT_TYPES[p.type].uneatable &&
                p.x + 22 >= z.x - 34 && p.x < z.x);
            if (ahead) { z.vaulted = true; z.vaultFor = T.vaultDuration || 0.55; }
        }
        if (T.dashEvery) {
            z.dashTimer -= dt;
            z.dashFor = Math.max(0, z.dashFor - dt);
            if (z.dashTimer <= 0) {
                z.dashTimer = T.dashEvery;
                z.dashFor = T.dashDuration;
            }
        }
        z.walkPhase += dt * 4.4 * z.slowF;

        // 撑杆跳的这段时间里它在空中，够不到植物也啃不到
        const target = z.vaultFor > 0 ? null : plantToEat(z);

        if (target && target.alive) {
            z.eating = target;
            z.biteTimer -= dt;
            if (z.biteTimer <= 0) {
                z.biteTimer = 0.5;
                Sfx.chomp();
            }
            damagePlant(target, T.dps * dt);
            if (target.alive && PLANT_TYPES[target.type].retaliate) {
                hitZombie(z, PLANT_TYPES[target.type].retaliate * dt, target.x);
            }
            if (!z.alive) continue;
        } else {
            z.eating = null;
            // 喷吐僵尸：站在射程外往前面那株植物吐酸液
            let holding = false;
            if (T.spitEvery) {
                const victim = frontPlant(z, T.spitRange);
                if (victim) {
                    holding = true;
                    z.spitTimer -= dt;
                    if (z.spitTimer <= 0) {
                        z.spitTimer = T.spitEvery;
                        damagePlant(victim, T.spitDmg);
                        burst(victim.x, victim.y - 18, '#c8e07a', 12, 130);
                        Sfx.pea();
                    }
                }
            }
            if (!holding) {
                const rallied = zombies.some(other => other !== z && other.alive &&
                    ZOMBIE_TYPES[other.kind].rally && other.r === z.r && Math.abs(other.x - z.x) < 150);
                // 撑杆跳是一记定长的飞跃（不被减速影响），必须越过植物的啃咬范围，
                // 否则落地后又站在原地啃起来。
                const step = z.vaultFor > 0 ? 220 : T.speed * z.slowF * (rallied ? 1.3 : 1) *
                    (z.dashFor > 0 ? T.dashMultiplier : 1);
                z.x -= step * dt;
                if (z.vaultFor > 0) z.vaultFor = Math.max(0, z.vaultFor - dt);
            }
        }

        if (z.x < LAWN_X - 24) {
            const m = mowers.find(mm => mm.r === z.r && mm.state === 'idle');
            if (m) {
                m.state = 'run';
                Sfx.mower();
                toast('割草机启动！');
            } else if (z.x < 13) {
                if (COMBO) {
                    // 组合模式：漏一个不立刻结束，先啃城墙
                    damageWall(T.wall || 1, z.x, z.r);
                    z.alive = false;
                    burst(z.x, z.y, T.coat, 12, 120);
                } else {
                    loseGame();
                    return;
                }
            }
        }
    }
    zombies = zombies.filter(z => z.alive);
}

function updateMowers(dt) {
    for (const m of mowers) {
        if (m.state !== 'run') continue;
        m.x += 520 * dt;
        for (const z of zombies) {
            if (z.alive && z.r === m.r && Math.abs(z.x - m.x) < 46) {
                z.hp = 0; z.armor = 0; killZombie(z, m.x);
            }
        }
        if (m.x > CANVAS_W + 60) m.state = 'spent';
    }
}

function mowersLeft() { return mowers.filter(m => m.state === 'idle').length; }

function loseGame() {
    if (state.phase === 'over') return;
    state.phase = 'over';
    Sfx.lose();
    clearSave();
    showOverlay('gameover');
    updateHud();
}

// ------------------------------- 炮塔 · towers (combined mode) ----------
function addGold(n) {
    if (!COMBO) return;
    state.gold += n;
    flashStat('statGoldBox');
    updateHud();
}

function spendGold(n) {
    if (state.gold < n) return false;
    state.gold -= n;
    updateHud();
    return true;
}

// 漏过去的敌人先啃城墙，城墙归零才算输。
function damageWall(n, x, r) {
    if (!COMBO) return;
    state.wall = Math.max(0, state.wall - n);
    flashStat('statWallBox');
    pushFloat(x + 24, cellCY(r) - 30, '-' + n + ' 城墙', '#e88b7f');
    Sfx.groan();
    updateHud();
    if (state.wall <= 0) loseGame();
}

function towerAt(c, r) {
    return towers.find(t => t.c === c && t.r === r) || null;
}

function statsFor(typeKey, level) {
    const t = TOWER_TYPES[typeKey];
    const m = level - 1;
    return {
        damage:  Math.round(t.damage * Math.pow(1.40, m)),
        range:   Math.round(t.range * Math.pow(1.09, m)),
        rate:    t.rate * Math.pow(1.15, m),
        splash:  t.splash ? Math.round(t.splash * Math.pow(1.10, m)) : 0,
        slow:    t.slow ? Math.min(0.7, t.slow + m * 0.09) : 0,
        slowDur: t.slowDur ? t.slowDur + m * 0.4 : 0,
        chain:   t.chain ? t.chain + m : 0
    };
}

function upgradeCostFor(typeKey, level) {
    return Math.round(TOWER_TYPES[typeKey].cost * 0.85 * Math.pow(1.75, level - 1));
}

function sellValueFor(tw) {
    let spent = TOWER_TYPES[tw.type].cost;
    for (let lv = 1; lv < tw.level; lv++) spent += upgradeCostFor(tw.type, lv);
    return Math.floor(spent * 0.5);
}

function canBuildTower(c, r) {
    return inLawn(c, r) && !plantAt(c, r) && !towerAt(c, r);
}

function placeTower(key, c, r) {
    const T = TOWER_TYPES[key];
    if (!COMBO || !T || !inLawn(c, r)) return false;
    if (state.phase === 'over' || state.phase === 'won') return false;
    if (towerAt(c, r)) { toast('这里已经有炮塔了', true); return false; }
    if (plantAt(c, r)) { toast('这里已经有植物了', true); return false; }
    if (state.gold < T.cost) { toast('银两不足，需要 ' + T.cost + ' 银两', true); return false; }

    spendGold(T.cost);
    towers.push({
        type: key, level: 1, c, r,
        x: cellCX(c), y: cellCY(r),
        stats: statsFor(key, 1), cd: 0, aim: Math.PI
    });
    Sfx.build();
    hover = { c: -1, r: -1 };
    scheduleAutoSave();
    return true;
}

function selectTowerType(key) {
    Sfx.unlock();
    if (!COMBO || state.phase === 'over' || state.phase === 'won') return;
    if (towerType === key) towerType = null;
    else {
        const T = TOWER_TYPES[key];
        if (state.gold < T.cost) { toast('银两不足，需要 ' + T.cost + ' 银两', true); return; }
        towerType = key;
        buildType = null;
        shovelMode = false;
    }
    selected = null;
    towerSel = null;
    syncSelectionUI();
    renderSelectedPanel();
}

function upgradeSelectedTower() {
    if (!towerSel) return;
    const tw = towerSel;
    if (tw.level >= TOWER_MAX_LEVEL) { toast('这座塔已经升到满级', true); return; }
    const cost = upgradeCostFor(tw.type, tw.level);
    if (!spendGold(cost)) { toast('银两不足，需要 ' + cost + ' 银两', true); return; }
    tw.level++;
    tw.stats = statsFor(tw.type, tw.level);
    burst(tw.x, tw.y - 12, '#e8c169', 18, 130);
    pushFloat(tw.x, tw.y - 44, '升级 Lv.' + tw.level, '#ffe98f');
    Sfx.fuse();
    renderSelectedPanel();
    scheduleAutoSave();
}

function sellSelectedTower() {
    if (!towerSel) return;
    const tw = towerSel;
    const back = sellValueFor(tw);
    towers = towers.filter(t => t !== tw);
    addGold(back);
    burst(tw.x, tw.y - 6, '#a8967c', 14, 110);
    pushFloat(tw.x, tw.y - 36, '+' + back + ' 银两', '#f2cf7a');
    towerSel = null;
    Sfx.dig();
    renderSelectedPanel();
    scheduleAutoSave();
}

function findTarget(tw) {
    const r2 = tw.stats.range * tw.stats.range;
    let best = null;
    for (const z of zombies) {
        if (!z.alive) continue;
        if (dist2(z.x, z.y, tw.x, tw.y) > r2) continue;
        if (!best || z.x < best.x) best = z;   // 最靠近城墙的先打
    }
    return best;
}

function updateTowers(dt) {
    for (const tw of towers) {
        tw.cd -= dt;
        const target = findTarget(tw);
        if (!target) continue;
        tw.aim = Math.atan2(target.y - tw.y, target.x - tw.x);
        if (tw.cd > 0) continue;
        tw.cd = 1 / tw.stats.rate;
        fireTower(tw, target);
    }
}

function fireTower(tw, target) {
    const s = tw.stats;
    const kind = TOWER_TYPES[tw.type].proj;
    const muzzleY = tw.y - 22;

    if (kind === 'bolt') {
        Sfx.zap();
        let cur = target, dmg = s.damage;
        const hit = [cur];
        const pts = [{ x: tw.x, y: muzzleY }, { x: cur.x, y: cur.y }];
        hitZombie(cur, dmg, tw.x);
        for (let i = 0; i < s.chain - 1; i++) {
            let next = null, bd = 100 * 100;
            for (const z of zombies) {
                if (!z.alive || hit.indexOf(z) !== -1) continue;
                const dd = dist2(z.x, z.y, cur.x, cur.y);
                if (dd < bd) { bd = dd; next = z; }
            }
            if (!next) break;
            dmg *= 0.75;
            hitZombie(next, dmg, tw.x);
            pts.push({ x: next.x, y: next.y });
            hit.push(next);
            cur = next;
        }
        fx.push({ kind: 'bolt', pts, life: 0.18, max: 0.18 });
        return;
    }

    if (kind === 'fire') Sfx.boom(); else Sfx.pea();
    towerShots.push({
        kind,
        x: tw.x, y: muzzleY,
        lx: target.x, ly: target.y,
        target,
        speed: kind === 'fire' ? 260 : kind === 'ice' ? 330 : 430,
        angle: tw.aim,
        stats: s
    });
}

function updateTowerShots(dt) {
    for (let i = towerShots.length - 1; i >= 0; i--) {
        const p = towerShots[i];
        let tx = p.lx, ty = p.ly;
        if (p.target && p.target.alive) { tx = p.target.x; ty = p.target.y; p.lx = tx; p.ly = ty; }
        const dx = tx - p.x, dy = ty - p.y;
        const d = Math.hypot(dx, dy) || 1;
        const step = p.speed * dt;
        p.angle = Math.atan2(dy, dx);
        if (d <= step) {
            p.x = tx; p.y = ty;
            towerImpact(p);
            towerShots.splice(i, 1);
        } else {
            p.x += dx / d * step;
            p.y += dy / d * step;
        }
    }
}

function towerImpact(p) {
    const s = p.stats;
    if (p.kind === 'fire') {
        fx.push({ kind: 'boom', x: p.x, y: p.y, r: s.splash, life: 0.35, max: 0.35 });
        for (const z of zombies) {
            if (z.alive && dist2(z.x, z.y, p.x, p.y) <= s.splash * s.splash) hitZombie(z, s.damage, p.x);
        }
    } else if (p.kind === 'ice') {
        fx.push({ kind: 'frost', x: p.x, y: p.y, r: 22, life: 0.3, max: 0.3 });
        if (p.target && p.target.alive) {
            hitZombie(p.target, s.damage, p.x);
            applySlow(p.target, s.slow, s.slowDur);
        }
    } else {
        if (p.target && p.target.alive) hitZombie(p.target, s.damage, p.x);
        fx.push({ x: p.x, y: p.y, vx: rand(-30, 30), vy: rand(-40, -10), life: 0.25, max: 0.25, color: '#7d5b34', r: 2 });
    }
}

// ------------------------------- FX --------------------------------------
function burst(x, y, color, n, speed) {
    for (let i = 0; i < n; i++) {
        const a = Math.random() * Math.PI * 2;
        const v = rand(speed * 0.3, speed);
        fx.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 30, life: rand(0.3, 0.7), max: 0.7, color, r: rand(2, 5) });
    }
}

function pushFloat(x, y, text, color) {
    floats.push({ x, y, text, color, life: 1.1 });
}

function updateFx(dt) {
    for (const p of fx) {
        p.life -= dt;
        // tower blasts (boom / frost / bolt) sit where they landed; only the
        // bursting particles carry a velocity
        if (p.vx !== undefined) {
            p.x += p.vx * dt;
            p.y += p.vy * dt;
            p.vy += 260 * dt;
        }
    }
    fx = fx.filter(p => p.life > 0);
    for (const f of floats) { f.life -= dt; f.y -= 34 * dt; }
    floats = floats.filter(f => f.life > 0);
}

// ------------------------------- Update loop -----------------------------
function update(dt) {
    state.t += dt;
    if (state.flash > 0) state.flash -= dt;

    updateWaves(dt);
    updateSuns(dt);
    updateRabbit(dt);
    updatePlants(dt);
    updateShots(dt);
    updateZombies(dt);
    updateMowers(dt);
    if (COMBO) {
        updateTowers(dt);
        updateTowerShots(dt);
    }
    updateFx(dt);

    for (const k of Object.keys(state.cooldowns)) {
        if (state.cooldowns[k] > 0) state.cooldowns[k] = Math.max(0, state.cooldowns[k] - dt);
    }
}

// ------------------------------- Background ------------------------------
let bg = null;

function buildBackground() {
    const b = document.createElement('canvas');
    b.width = CANVAS_W; b.height = CANVAS_H;
    const g = b.getContext('2d');

    // soil / dirt everywhere
    g.fillStyle = '#3b2b1a';
    g.fillRect(0, 0, CANVAS_W, CANVAS_H);
    for (let i = 0; i < 700; i++) {
        g.fillStyle = 'rgba(0,0,0,' + rand(0.03, 0.12).toFixed(3) + ')';
        g.fillRect(rand(0, CANVAS_W), rand(0, CANVAS_H), rand(2, 7), rand(2, 7));
    }

    // lawn rows
    for (let r = 0; r < ROWS; r++) {
        g.fillStyle = r % 2 === 0 ? '#6fae3f' : '#63a038';
        g.fillRect(LAWN_X, LAWN_Y + r * CELL_H, COLS * CELL_W, CELL_H);
    }
    // vertical column seams
    g.strokeStyle = 'rgba(0,0,0,0.07)';
    g.lineWidth = 1;
    for (let c = 1; c < COLS; c++) {
        g.beginPath(); g.moveTo(LAWN_X + c * CELL_W, LAWN_Y); g.lineTo(LAWN_X + c * CELL_W, LAWN_B); g.stroke();
    }
    // soft top-down light on the lawn
    const lg = g.createLinearGradient(0, LAWN_Y, 0, LAWN_B);
    lg.addColorStop(0, 'rgba(255,255,255,0.10)');
    lg.addColorStop(0.45, 'rgba(255,255,255,0.0)');
    lg.addColorStop(1, 'rgba(0,0,0,0.14)');
    g.fillStyle = lg;
    g.fillRect(LAWN_X, LAWN_Y, COLS * CELL_W, ROWS * CELL_H);

    // blade texture
    for (let i = 0; i < 520; i++) {
        const x = rand(LAWN_X, LAWN_R), y = rand(LAWN_Y, LAWN_B);
        g.strokeStyle = 'rgba(255,255,255,0.07)';
        g.lineWidth = 1;
        g.beginPath(); g.moveTo(x, y); g.lineTo(x + rand(-2, 2), y - rand(3, 6)); g.stroke();
    }

    // top + bottom fence rails
    for (const y of [0, LAWN_B]) {
        g.fillStyle = '#6b4a2a';
        g.fillRect(0, y, CANVAS_W, 30);
        g.fillStyle = 'rgba(0,0,0,0.22)';
        for (let x = 0; x < CANVAS_W; x += 34) g.fillRect(x, y, 4, 30);
        g.fillStyle = 'rgba(255,255,255,0.10)';
        g.fillRect(0, y, CANVAS_W, 4);
    }

    // the house on the left / 长城关楼 on the left (combined mode)
    if (COMBO) {
        g.fillStyle = '#8a7256';
        g.fillRect(0, 30, LAWN_X, LAWN_B - LAWN_Y);
        g.strokeStyle = 'rgba(60,44,26,0.45)';
        g.lineWidth = 1.6;
        let row = 0;
        for (let y = 30; y < LAWN_B; y += 15, row++) {
            g.beginPath(); g.moveTo(0, y); g.lineTo(LAWN_X, y); g.stroke();
            for (let x = (row % 2 ? 0 : 13); x < LAWN_X; x += 26) {
                g.beginPath(); g.moveTo(x, y); g.lineTo(x, Math.min(y + 15, LAWN_B)); g.stroke();
            }
        }
        g.fillStyle = '#6d5a42';
        for (let x = 0; x < LAWN_X; x += 18) g.fillRect(x, 30, 11, 13);
        g.fillStyle = 'rgba(0,0,0,0.16)';
        g.fillRect(LAWN_X - 12, 30, 12, LAWN_B - LAWN_Y);

        // 关门: a red gate in the middle of the rampart
        const gateY = LAWN_Y + CELL_H * 1.1;
        g.fillStyle = '#5b4630';
        roundRect(g, 6, gateY - 26, LAWN_X - 12, 168, 8); g.fill();
        g.fillStyle = '#7d1f18';
        roundRect(g, 10, gateY - 22, LAWN_X - 20, 160, 6); g.fill();
        g.fillStyle = 'rgba(0,0,0,0.30)';
        roundRect(g, 10, gateY + 58, LAWN_X - 20, 80, 6); g.fill();

        g.fillStyle = '#e8c169';
        g.font = 'bold 26px ' + CJK;
        g.textAlign = 'center';
        g.textBaseline = 'middle';
        g.fillText('守', LAWN_X / 2, gateY + 10);
        g.font = 'bold 20px ' + CJK;
        g.fillText('合', LAWN_X / 2, LAWN_B - 34);
        g.textBaseline = 'alphabetic';
    } else {
        g.fillStyle = '#7c3f2a';
        g.fillRect(0, 30, 48, LAWN_B - LAWN_Y);
        for (let y = 30, row = 0; y < LAWN_B; y += 17, row++) {
            g.strokeStyle = 'rgba(0,0,0,0.32)';
            g.lineWidth = 2;
            g.beginPath(); g.moveTo(0, y); g.lineTo(48, y); g.stroke();
            for (let x = (row % 2 ? 0 : 12); x < 48; x += 24) {
                g.beginPath(); g.moveTo(x, y); g.lineTo(x, Math.min(y + 17, LAWN_B)); g.stroke();
            }
        }
        // porch planks
        g.fillStyle = '#a67c4e';
        g.fillRect(48, 30, LAWN_X - 48, LAWN_B - LAWN_Y);
        g.strokeStyle = 'rgba(0,0,0,0.18)';
        for (let y = 30; y < LAWN_B; y += 11) { g.beginPath(); g.moveTo(48, y); g.lineTo(LAWN_X, y); g.stroke(); }
        // lit window
        g.fillStyle = '#f6d98a';
        roundRect(g, 12, cellCY(2) - 30, 24, 34, 4); g.fill();
        g.strokeStyle = '#4a2a18'; g.lineWidth = 3; g.stroke();
    }

    // fence at the far right (where the zombies crawl in)
    g.fillStyle = '#5c3f24';
    g.fillRect(LAWN_R, LAWN_Y, CANVAS_W - LAWN_R, ROWS * CELL_H);

    return b;
}

// ------------------------------- Draw: 炮塔 · towers ---------------------
function drawPagoda(x, y, tw) {
    const def = TOWER_TYPES[tw.type];

    ctx.save();
    ctx.translate(x, y);
    ctx.scale(1.6, 1.6);

    // ground shadow
    ctx.fillStyle = 'rgba(60,40,20,0.22)';
    ctx.beginPath(); ctx.ellipse(0, 12, 15, 5.5, 0, 0, Math.PI * 2); ctx.fill();

    // stone platform
    ctx.fillStyle = '#a8967c';
    roundRect(ctx, -13.5, 4, 27, 9, 2); ctx.fill();
    ctx.strokeStyle = 'rgba(70,50,28,0.55)';
    ctx.lineWidth = 1;
    roundRect(ctx, -13.5, 4, 27, 9, 2); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.20)';
    roundRect(ctx, -13.5, 4, 27, 3, 2); ctx.fill();

    // storeys, bottom to top
    for (let i = 0; i < tw.level; i++) {
        const t = TIERS[i];
        const bottom = (i === 0) ? 4 : TIERS[i - 1].by;
        const h = bottom - t.by;
        const w = t.hw * 1.30;

        // wall
        ctx.fillStyle = '#f0e2c6';
        ctx.fillRect(-w / 2, t.by, w, h);
        ctx.fillStyle = 'rgba(140,105,60,0.22)';
        ctx.fillRect(w / 2 - 2.6, t.by, 2.6, h);
        ctx.fillStyle = 'rgba(96,64,30,0.62)';
        ctx.fillRect(-w * 0.21, bottom - h * 0.58, w * 0.42, h * 0.44);
        ctx.strokeStyle = 'rgba(60,38,16,0.55)';
        ctx.lineWidth = 1;
        ctx.strokeRect(-w / 2, t.by, w, h);

        // roof
        ctx.fillStyle = def.roof;
        roof(t.hw, t.by, t.rh);
        ctx.strokeStyle = 'rgba(35,18,8,0.8)';
        ctx.lineWidth = 1.2;
        roof(t.hw, t.by, t.rh, true);

        // gilded ridge line
        ctx.strokeStyle = 'rgba(240,205,125,0.85)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(-t.hw * 0.86, t.by - t.rh * 0.30);
        ctx.quadraticCurveTo(0, t.by - t.rh * 0.96, t.hw * 0.86, t.by - t.rh * 0.30);
        ctx.stroke();
    }

    // finial spire
    const top = TIERS[tw.level - 1].by - TIERS[tw.level - 1].rh;
    ctx.strokeStyle = '#7d5f1e';
    ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(0, top + 1); ctx.lineTo(0, top - 5.5); ctx.stroke();
    ctx.fillStyle = '#e8c169';
    ctx.beginPath(); ctx.arc(0, top - 7, 3.1, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(60,36,10,0.85)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(0, top - 7, 3.1, 0, Math.PI * 2); ctx.stroke();

    // type badge on the platform
    ctx.fillStyle = def.color;
    ctx.beginPath(); ctx.arc(0, 9, 6.6, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(40,22,8,0.85)';
    ctx.lineWidth = 1.2; ctx.stroke();
    ctx.font = 'bold 9px ' + CJK;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#fff6e2';
    ctx.fillText(def.glyph, 0, 9.6);
    ctx.textBaseline = 'alphabetic';

    // aim indicator, floating by the finial
    ctx.save();
    ctx.translate(0, top - 7);
    ctx.rotate(tw.aim);
    ctx.fillStyle = '#e8c169';
    ctx.strokeStyle = 'rgba(60,36,10,0.9)';
    ctx.lineWidth = 0.8;
    ctx.beginPath();
    ctx.moveTo(13.5, 0); ctx.lineTo(7, -3.2); ctx.lineTo(7, 3.2);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.restore();

    ctx.restore();
}

// Flared roof with upturned eaves.
function roof(halfW, baseY, h, strokeOnly) {
    ctx.beginPath();
    ctx.moveTo(-halfW, baseY - h * 0.16);
    ctx.quadraticCurveTo(-halfW * 0.42, baseY - h * 0.30, 0, baseY - h);
    ctx.quadraticCurveTo(halfW * 0.42, baseY - h * 0.30, halfW, baseY - h * 0.16);
    ctx.quadraticCurveTo(halfW * 0.55, baseY + h * 0.22, 0, baseY + h * 0.15);
    ctx.quadraticCurveTo(-halfW * 0.55, baseY + h * 0.22, -halfW, baseY - h * 0.16);
    ctx.closePath();
    if (strokeOnly) ctx.stroke(); else ctx.fill();
}

function drawTowerShots() {
    for (const p of towerShots) {
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.angle);
        if (p.kind === 'arrow') {
            ctx.strokeStyle = '#5d4222';
            ctx.lineWidth = 2.4;
            ctx.beginPath(); ctx.moveTo(-8, 0); ctx.lineTo(6, 0); ctx.stroke();
            ctx.fillStyle = '#8c6a3a';
            ctx.beginPath(); ctx.moveTo(9, 0); ctx.lineTo(3, -3); ctx.lineTo(3, 3); ctx.closePath(); ctx.fill();
        } else if (p.kind === 'fire') {
            const gr = ctx.createRadialGradient(0, 0, 1, 0, 0, 9);
            gr.addColorStop(0, '#fff3b0');
            gr.addColorStop(0.4, '#f39c12');
            gr.addColorStop(1, 'rgba(192,57,43,0)');
            ctx.fillStyle = gr;
            ctx.beginPath(); ctx.arc(0, 0, 9, 0, Math.PI * 2); ctx.fill();
        } else {
            ctx.fillStyle = '#aed6f1';
            ctx.strokeStyle = '#2e6da4';
            ctx.lineWidth = 1.2;
            ctx.beginPath();
            ctx.moveTo(7, 0); ctx.lineTo(0, -5); ctx.lineTo(-7, 0); ctx.lineTo(0, 5);
            ctx.closePath(); ctx.fill(); ctx.stroke();
        }
        ctx.restore();
    }
}

function drawRange(x, y, r, color) {
    ctx.save();
    ctx.fillStyle = color.replace(/[\d.]+\)$/, '0.10)');
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = color;
    ctx.lineWidth = 1.6;
    ctx.setLineDash([7, 6]);
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
}

// 蛮族画成圆圈令牌 + 长矛，和长城那边的造型一致。
function drawInvader(z) {
    const T = ZOMBIE_TYPES[z.kind];
    const R = T.radius;
    const bob = Math.sin(z.walkPhase) * 1.6;

    ctx.save();
    ctx.translate(z.x, z.y + bob);

    ctx.fillStyle = 'rgba(50,35,15,0.28)';
    ctx.beginPath(); ctx.ellipse(0, R * 0.85 - bob, R * 0.9, R * 0.36, 0, 0, 6.29); ctx.fill();

    // spear, pointing the way they walk
    ctx.strokeStyle = '#6b4a2a';
    ctx.lineWidth = 2.4;
    ctx.beginPath(); ctx.moveTo(-R * 0.4, R * 0.25); ctx.lineTo(-R * 1.5, -R * 0.55); ctx.stroke();
    ctx.fillStyle = '#cfd6dd';
    ctx.beginPath();
    ctx.moveTo(-R * 1.95, -R * 0.85); ctx.lineTo(-R * 1.25, -R * 0.72); ctx.lineTo(-R * 1.5, -R * 0.3);
    ctx.closePath(); ctx.fill();

    // body token
    ctx.fillStyle = T.coat;
    ctx.beginPath(); ctx.arc(0, 0, R, 0, 6.29); ctx.fill();
    ctx.strokeStyle = T.edge;
    ctx.lineWidth = Math.max(1.6, R * 0.14);
    ctx.stroke();
    ctx.fillStyle = 'rgba(0,0,0,0.20)';
    ctx.beginPath(); ctx.arc(0, 0, R, Math.PI * 1.02, Math.PI * 1.98); ctx.fill();

    ctx.font = 'bold ' + Math.round(R * 1.05) + 'px ' + CJK;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#fff6e2';
    ctx.fillText(T.glyph, 0, R * 0.06);

    // 挨打时的柔光，和僵尸共用一套（hitZombie 对两者都喷碎屑）
    if (z.hurtT > 0) {
        const k = clamp(z.hurtT / 0.12, 0, 1);
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        const g = ctx.createRadialGradient(0, 0, 2, 0, 0, R * 1.5);
        g.addColorStop(0, 'rgba(255,252,240,' + (0.34 * k).toFixed(3) + ')');
        g.addColorStop(0.5, 'rgba(255,222,198,' + (0.2 * k).toFixed(3) + ')');
        g.addColorStop(1, 'rgba(255,150,110,0)');
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(0, 0, R * 1.5, 0, 6.29); ctx.fill();
        ctx.restore();
    }
    ctx.restore();

    // armour-aware health bar, like the Wall game
    const bw = R * 2.2, bh = T.boss ? 7 : 4;
    const by = z.y - R - 12;
    const pct = clamp(jobRatio(z), 0, 1);
    ctx.fillStyle = 'rgba(20,12,6,0.7)';
    roundRect(ctx, z.x - bw / 2, by, bw, bh, 2); ctx.fill();
    ctx.fillStyle = pct > 0.5 ? '#5cb85c' : pct > 0.22 ? '#e0a83c' : '#c0392b';
    roundRect(ctx, z.x - bw / 2, by, Math.max(1, bw * pct), bh, 2); ctx.fill();

    if (T.boss) {
        ctx.save();
        ctx.fillStyle = '#f2cf7a';
        ctx.font = 'bold 11px ' + CJK;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(tr(T.name), z.x, by - 10);
        ctx.restore();
    }
    if (z.slowT > 0) {
        ctx.fillStyle = 'rgba(150,220,255,0.30)';
        ctx.beginPath(); ctx.arc(z.x, z.y, R + 3, 0, 6.29); ctx.fill();
    }
}

// ------------------------------- Draw: lawn hints ------------------------
function drawHints() {
    if (buildType || shovelMode || towerType) {
        ctx.fillStyle = 'rgba(255,255,255,0.05)';
        for (let c = 0; c < COLS; c++)
            for (let r = 0; r < ROWS; r++)
                if (!plantAt(c, r) && !towerAt(c, r)) ctx.fillRect(LAWN_X + c * CELL_W + 3, LAWN_Y + r * CELL_H + 3, CELL_W - 6, CELL_H - 6);
    }
    if (COMBO && towerSel) drawRange(towerSel.x, towerSel.y, towerSel.stats.range, 'rgba(232,193,105,0.8)');
    if (!inLawn(hover.c, hover.r)) return;

    const x = LAWN_X + hover.c * CELL_W, y = LAWN_Y + hover.r * CELL_H;
    let ok = false;
    if (buildType) ok = canPlant(hover.c, hover.r) && state.sun >= PLANT_TYPES[buildType].cost && !(state.cooldowns[buildType] > 0);
    else if (towerType) ok = canBuildTower(hover.c, hover.r) && state.gold >= TOWER_TYPES[towerType].cost;
    else if (shovelMode) ok = !!plantAt(hover.c, hover.r);

    ctx.save();
    ctx.globalAlpha = 0.55;
    ctx.fillStyle = ok ? '#dcf3ac' : '#e0715f';
    roundRect(ctx, x + 3, y + 3, CELL_W - 6, CELL_H - 6, 10);
    ctx.fill();
    ctx.restore();

    if (buildType && ok) {
        ctx.save();
        ctx.globalAlpha = 0.5;
        drawPlantArt(buildType, cellCX(hover.c), cellCY(hover.r), 1, 0);
        ctx.restore();
    }
    if (towerType && ok) {
        drawRange(cellCX(hover.c), cellCY(hover.r), statsFor(towerType, 1).range, 'rgba(232,193,105,0.85)');
        ctx.save();
        ctx.globalAlpha = 0.55;
        drawPagoda(cellCX(hover.c), cellCY(hover.r), { type: towerType, level: 1, aim: Math.PI });
        ctx.restore();
    }
}

// ------------------------------- Draw: plants ----------------------------
function shadow(x, y, rx, ry) {
    ctx.fillStyle = 'rgba(0,0,0,0.22)';
    ctx.beginPath();
    ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
    ctx.fill();
}

function leafPair(x, y, s) {
    ctx.fillStyle = '#3f7a2a';
    ctx.beginPath(); ctx.ellipse(x - 16 * s, y - 6 * s, 13 * s, 6 * s, -0.5, 0, 6.29); ctx.fill();
    ctx.beginPath(); ctx.ellipse(x + 16 * s, y - 6 * s, 13 * s, 6 * s, 0.5, 0, 6.29); ctx.fill();
}

function stem(x, y, s, toY, color) {
    ctx.strokeStyle = color || '#3f7a2a';
    ctx.lineWidth = 5 * s;
    ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x, y + 26 * s); ctx.lineTo(x, toY); ctx.stroke();
}

function face(x, y, r, mood, mouth) {
    const ex = r * 0.42, er = r * 0.29, pr = r * 0.15;
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(x - ex, y, er, 0, 6.29); ctx.fill();
    ctx.beginPath(); ctx.arc(x + ex, y, er, 0, 6.29); ctx.fill();
    ctx.fillStyle = '#241a10';
    const px = mood === 'angry' ? -r * 0.20 : r * 0.10;
    ctx.beginPath(); ctx.arc(x - ex + px, y, pr, 0, 6.29); ctx.fill();
    ctx.beginPath(); ctx.arc(x + ex + px, y, pr, 0, 6.29); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.beginPath(); ctx.arc(x - ex + px + pr * 0.45, y - pr * 0.5, pr * 0.36, 0, 6.29); ctx.fill();
    ctx.beginPath(); ctx.arc(x + ex + px + pr * 0.45, y - pr * 0.5, pr * 0.36, 0, 6.29); ctx.fill();
    if (mood === 'angry') {
        ctx.strokeStyle = '#241a10';
        ctx.lineWidth = Math.max(1, r * 0.11);
        ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(x - ex * 1.3, y - er * 1.6); ctx.lineTo(x - ex * 0.45, y - er * 0.95); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(x + ex * 1.3, y - er * 1.6); ctx.lineTo(x + ex * 0.45, y - er * 0.95); ctx.stroke();
    }
    if (!mouth) return;
    ctx.strokeStyle = '#241a10';
    ctx.lineWidth = Math.max(1, r * 0.13);
    ctx.lineCap = 'round';
    if (mouth === 'smile') {
        ctx.beginPath(); ctx.arc(x, y + r * 0.34, r * 0.36, 0.32 * Math.PI, 0.68 * Math.PI); ctx.stroke();
    } else if (mouth === 'flat') {
        ctx.beginPath(); ctx.moveTo(x - r * 0.3, y + r * 0.6); ctx.lineTo(x + r * 0.3, y + r * 0.6); ctx.stroke();
    } else if (mouth === 'open') {
        ctx.fillStyle = '#3d1512';
        ctx.beginPath(); ctx.ellipse(x, y + r * 0.62, r * 0.3, r * 0.38, 0, 0, 6.29); ctx.fill();
    }
}

// 一圈花瓣：外圈深、内圈亮，花心才看得出层次。
function petalRing(cx, cy, radius, len, wid, count, phase, fill, tip) {
    for (let i = 0; i < count; i++) {
        const a = i * (Math.PI * 2 / count) + phase;
        ctx.save();
        ctx.translate(cx + Math.cos(a) * radius, cy + Math.sin(a) * radius);
        ctx.rotate(a);
        ctx.fillStyle = fill;
        ctx.beginPath(); ctx.ellipse(len * 0.55, 0, len * 0.62, wid, 0, 0, 6.29); ctx.fill();
        ctx.fillStyle = tip;
        ctx.beginPath(); ctx.ellipse(len * 1.02, 0, len * 0.22, wid * 0.6, 0, 0, 6.29); ctx.fill();
        ctx.restore();
    }
}

// 豌豆脑袋：带体积的球 + 一到两根炮管，射手 / 寒冰 / 双发 / 三线共用。
function peaHead(x, y, s, cold, barrels) {
    const head = cold ? '#4aa3d9' : '#6ab04c';
    const dark = cold ? '#2a6c96' : '#3f7a2a';
    const light = cold ? '#bdeeff' : '#c3ed9a';
    for (const [by, bh] of barrels) {
        ctx.fillStyle = dark;
        roundRect(ctx, x + 5 * s, y + by * s, 23 * s, bh * s, bh * 0.45 * s); ctx.fill();
        ctx.fillStyle = cold ? '#7fd4f0' : '#8fc95f';
        roundRect(ctx, x + 7 * s, y + (by + 1.8) * s, 19 * s, (bh - 3.6) * s, (bh - 3.6) * 0.45 * s); ctx.fill();
        ctx.fillStyle = '#14301c';
        ctx.beginPath();
        ctx.ellipse(x + 26.5 * s, y + (by + bh / 2) * s, 2.4 * s, bh * 0.3 * s, 0, 0, 6.29);
        ctx.fill();
    }
    const g = ctx.createRadialGradient(x - 8 * s, y - 9 * s, 1.5 * s, x, y, 19 * s);
    g.addColorStop(0, light); g.addColorStop(0.5, head); g.addColorStop(1, dark);
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x, y, 16 * s, 0, 6.29); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.38)';
    ctx.beginPath(); ctx.ellipse(x - 8 * s, y - 9 * s, 4.6 * s, 2.8 * s, -0.6, 0, 6.29); ctx.fill();
}

// 融合植物：两株植物的形象并排，外面罩一层金色光环。
function drawFusedArt(def, x, y, s, t) {
    const [a, b] = def.art;
    const g = ctx.createRadialGradient(x, y - 8, 4, x, y - 8, 48 * s);
    g.addColorStop(0, 'rgba(255,238,150,0.5)');
    g.addColorStop(0.6, 'rgba(255,214,90,0.2)');
    g.addColorStop(1, 'rgba(255,214,90,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x, y - 8, 48 * s, 0, 6.29); ctx.fill();

    ctx.fillStyle = 'rgba(255,244,190,0.9)';
    for (let i = 0; i < 3; i++) {
        const ang = t * 1.4 + i * 2.1;
        ctx.beginPath();
        ctx.arc(x + Math.cos(ang) * 30 * s, y - 16 + Math.sin(ang) * 22 * s, 2.4 * s, 0, 6.29);
        ctx.fill();
    }
    drawPlantArt(a, x - 13 * s, y, s * 0.76, t);
    drawPlantArt(b, x + 13 * s, y, s * 0.76, t + 1.7);
}

function drawPlantArt(key, x, y, s, t) {
    const def = PLANT_TYPES[key];
    if (def && def.art) { drawFusedArt(def, x, y, s, t); return; }
    const bob = Math.sin(t * 2.2) * 1.6;
    ctx.save();
    ctx.translate(x, y + bob);
    shadow(-0, 30 * s - bob, 22 * s, 7 * s);

    if (key === 'sunflower') {
        stem(0, 0, s, -16 * s);
        leafPair(0, 0, s);
        const cy = -26 * s, sway = Math.sin(t * 1.6) * 0.05;
        petalRing(0, cy, 9 * s, 13 * s, 6.6 * s, 12, sway + 0.26, '#d9a52c', '#f5c94f');
        petalRing(0, cy, 6 * s, 11 * s, 5.6 * s, 10, sway, '#f2c14e', '#ffe38f');
        const cg = ctx.createRadialGradient(-4 * s, cy - 5 * s, 2 * s, 0, cy, 16 * s);
        cg.addColorStop(0, '#a9722a'); cg.addColorStop(0.6, '#8a5a1e'); cg.addColorStop(1, '#5e3c11');
        ctx.fillStyle = cg;
        ctx.beginPath(); ctx.arc(0, cy, 14 * s, 0, 6.29); ctx.fill();
        ctx.fillStyle = 'rgba(60,38,10,0.45)';
        for (let i = 0; i < 14; i++) {
            const a = i * 2.399, rr = 4 + (i % 5) * 1.7;
            ctx.beginPath();
            ctx.arc(Math.cos(a) * rr * s, cy + Math.sin(a) * rr * s, 1.4 * s, 0, 6.29);
            ctx.fill();
        }
        face(0, cy - 1 * s, 10 * s, null, 'smile');
    } else if (key === 'peashooter' || key === 'snowpea' || key === 'repeater') {
        const cold = key === 'snowpea';
        const dark = cold ? '#2a6c96' : '#3f7a2a';
        stem(0, 0, s, -6 * s, dark);
        leafPair(0, 0, s);
        ctx.fillStyle = dark;
        ctx.beginPath(); ctx.ellipse(-7 * s, -3 * s, 6 * s, 3.4 * s, -0.7, 0, 6.29); ctx.fill();
        ctx.beginPath(); ctx.ellipse(7 * s, -3 * s, 6 * s, 3.4 * s, 0.7, 0, 6.29); ctx.fill();
        if (key === 'repeater') {
            peaHead(-2 * s, -20 * s, s, cold, [[-16, 12], [-2, 12]]);
            face(-6 * s, -20 * s, 12 * s, null, 'smile');
        } else {
            peaHead(-2 * s, -18 * s, s, cold, [[-7, 14]]);
            face(-6 * s, -18 * s, 12 * s, null, 'smile');
        }
        if (cold) {
            ctx.fillStyle = 'rgba(226,248,255,0.8)';
            for (let i = 0; i < 4; i++) {
                const a = t * 1.6 + i * 1.9;
                ctx.beginPath();
                ctx.arc(-2 * s + Math.cos(a) * 15 * s, -18 * s + Math.sin(a) * 13 * s, 2.1 * s, 0, 6.29);
                ctx.fill();
            }
            ctx.strokeStyle = 'rgba(205,242,255,0.85)';
            ctx.lineWidth = 2 * s;
            ctx.beginPath(); ctx.arc(-2 * s, -18 * s, 16 * s, Math.PI * 1.02, Math.PI * 1.78); ctx.stroke();
        }
    } else if (key === 'thorncactus') {
        stem(0, 0, s, -8 * s, '#347246');
        leafPair(0, 0, s);
        const cg = ctx.createLinearGradient(-12 * s, -42 * s, 14 * s, 8 * s);
        cg.addColorStop(0, '#8bcf73'); cg.addColorStop(1, '#347246');
        ctx.fillStyle = cg;
        roundRect(ctx, -13 * s, -47 * s, 26 * s, 47 * s, 12 * s); ctx.fill();
        ctx.fillStyle = '#e4f2be';
        for (const [px, py] of [[-14, -34], [14, -29], [-14, -18], [14, -11], [0, -49]]) {
            ctx.beginPath(); ctx.moveTo(px * s, py * s); ctx.lineTo((px + (px < 0 ? -7 : 7)) * s, (py - 3) * s); ctx.lineTo((px + (px < 0 ? -5 : 5)) * s, (py + 4) * s); ctx.fill();
        }
        face(0, -25 * s, 10 * s, null, 'smile');
    } else if (key === 'emberpod') {
        stem(0, 0, s, -8 * s, '#805039');
        leafPair(0, 0, s);
        const eg = ctx.createRadialGradient(-7 * s, -30 * s, 2 * s, 0, -20 * s, 26 * s);
        eg.addColorStop(0, '#ffe27c'); eg.addColorStop(0.48, '#ee8c45'); eg.addColorStop(1, '#963d35');
        ctx.fillStyle = eg;
        ctx.beginPath(); ctx.ellipse(0, -22 * s, 20 * s, 27 * s, -0.12, 0, 6.29); ctx.fill();
        ctx.fillStyle = 'rgba(255,238,160,0.8)';
        ctx.beginPath(); ctx.ellipse(-6 * s, -31 * s, 5 * s, 9 * s, -0.4, 0, 6.29); ctx.fill();
        face(2 * s, -18 * s, 10 * s, 'angry', 'smile');
    } else if (key === 'glowcap') {
        stem(0, 0, s, -10 * s, '#63946b');
        leafPair(0, 0, s);
        ctx.fillStyle = '#c2a1e8';
        ctx.beginPath(); ctx.ellipse(0, -27 * s, 26 * s, 17 * s, 0, Math.PI, 6.29); ctx.fill();
        ctx.fillStyle = '#8f65bf';
        roundRect(ctx, -8 * s, -29 * s, 16 * s, 30 * s, 7 * s); ctx.fill();
        ctx.fillStyle = '#f1e4ff';
        for (const [px, py] of [[-13, -30], [0, -38], [13, -30], [-6, -23], [8, -22]]) {
            ctx.beginPath(); ctx.arc(px * s, py * s, 2.1 * s, 0, 6.29); ctx.fill();
        }
        face(0, -14 * s, 9 * s, null, 'smile');
    } else if (key === 'frostbud') {
        stem(0, 0, s, -10 * s, '#4b8c9a');
        leafPair(0, 0, s);
        petalRing(0, -27 * s, 8 * s, 12 * s, 6 * s, 8, t * 0.12, '#64c5df', '#d6f8ff');
        petalRing(0, -27 * s, 5 * s, 8 * s, 4.5 * s, 6, -t * 0.1, '#a6ebf7', '#f4ffff');
        const ice = ctx.createRadialGradient(-4 * s, -31 * s, 1, 0, -26 * s, 14 * s);
        ice.addColorStop(0, '#f4ffff'); ice.addColorStop(0.5, '#a7e9f4'); ice.addColorStop(1, '#4389ad');
        ctx.fillStyle = ice;
        ctx.beginPath(); ctx.arc(0, -27 * s, 10 * s, 0, 6.29); ctx.fill();
        face(0, -28 * s, 7.5 * s, null, 'smile');
        ctx.strokeStyle = 'rgba(235,255,255,0.9)';
        ctx.lineWidth = 1.5 * s;
        ctx.beginPath(); ctx.moveTo(-19 * s, -28 * s); ctx.lineTo(-13 * s, -28 * s); ctx.moveTo(-16 * s, -31 * s); ctx.lineTo(-16 * s, -25 * s); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(17 * s, -39 * s); ctx.lineTo(23 * s, -39 * s); ctx.moveTo(20 * s, -42 * s); ctx.lineTo(20 * s, -36 * s); ctx.stroke();
    } else if (key === 'sunshard') {
        stem(0, 0, s, -13 * s, '#8a792d');
        leafPair(0, 0, s);
        const cy = -27 * s;
        petalRing(0, cy, 8 * s, 13 * s, 4.8 * s, 10, t * 0.12, '#d99427', '#fff0a0');
        petalRing(0, cy, 5 * s, 8 * s, 3.8 * s, 8, -t * 0.1, '#ffe26c', '#fff9d2');
        const sun = ctx.createRadialGradient(-5 * s, cy - 5 * s, 1, 0, cy, 13 * s);
        sun.addColorStop(0, '#fff9cb'); sun.addColorStop(0.55, '#f5c948'); sun.addColorStop(1, '#ba7727');
        ctx.fillStyle = sun;
        ctx.beginPath(); ctx.arc(0, cy, 11 * s, 0, 6.29); ctx.fill();
        face(0, cy, 8 * s, null, 'smile');
        ctx.strokeStyle = '#ffef9a';
        ctx.lineWidth = 2.4 * s;
        for (let i = 0; i < 3; i++) {
            const a = t * 0.35 + i * 2.1;
            ctx.beginPath();
            ctx.moveTo(Math.cos(a) * 23 * s, cy + Math.sin(a) * 23 * s);
            ctx.lineTo(Math.cos(a) * 29 * s, cy + Math.sin(a) * 29 * s);
            ctx.stroke();
        }
    } else if (key === 'pollenpuff') {
        stem(0, 0, s, -8 * s, '#8a7b36');
        leafPair(0, 0, s);
        const puff = ctx.createRadialGradient(-8 * s, -32 * s, 2 * s, 0, -22 * s, 27 * s);
        puff.addColorStop(0, '#fff1a0'); puff.addColorStop(0.55, '#e9c95a'); puff.addColorStop(1, '#b27e36');
        ctx.fillStyle = puff;
        ctx.beginPath(); ctx.arc(0, -23 * s, 20 * s, 0, 6.29); ctx.fill();
        ctx.fillStyle = 'rgba(255,248,190,0.8)';
        for (const [px, py, r] of [[-13, -32, 4], [-2, -40, 3], [11, -34, 4], [15, -21, 3], [-13, -18, 3]]) {
            ctx.beginPath(); ctx.arc(px * s, py * s, r * s, 0, 6.29); ctx.fill();
        }
        face(0, -23 * s, 10 * s, null, 'smile');
        for (let i = 0; i < 5; i++) {
            const a = t * 0.6 + i * 1.26;
            const px = Math.cos(a) * (29 + (i % 2) * 5) * s;
            const py = -24 * s + Math.sin(a) * 23 * s;
            ctx.fillStyle = 'rgba(255,238,143,0.8)';
            ctx.beginPath(); ctx.arc(px, py, 2.3 * s, 0, 6.29); ctx.fill();
        }
    } else if (key === 'starfruit') {
        stem(0, 0, s, -10 * s, '#8a6b2c');
        leafPair(0, 0, s);
        ctx.save();
        ctx.translate(0, -26 * s);
        ctx.rotate(t * 0.15);
        ctx.fillStyle = '#f3bd4e';
        ctx.strokeStyle = '#a96928';
        ctx.lineWidth = 2 * s;
        ctx.beginPath();
        for (let i = 0; i < 10; i++) {
            const a = -Math.PI / 2 + i * Math.PI / 5;
            const r = (i % 2 ? 13 : 25) * s;
            const px = Math.cos(a) * r, py = Math.sin(a) * r;
            if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        }
        ctx.closePath(); ctx.fill(); ctx.stroke();
        face(0, 0, 9 * s, null, 'smile');
        ctx.fillStyle = '#fff0a5';
        for (const [px, py] of [[-15, -8], [14, -10], [-12, 13], [13, 12]]) {
            ctx.beginPath(); ctx.arc(px * s, py * s, 2 * s, 0, 6.29); ctx.fill();
        }
        ctx.restore();
    } else if (key === 'pulsebloom') {
        stem(0, 0, s, -11 * s, '#356f7d');
        leafPair(0, 0, s);
        petalRing(0, -26 * s, 8 * s, 12 * s, 6 * s, 8, t * 0.16, '#4b9db8', '#b8f4ff');
        const core = ctx.createRadialGradient(-4 * s, -31 * s, 1, 0, -25 * s, 15 * s);
        core.addColorStop(0, '#f5ffff'); core.addColorStop(0.45, '#9ef1f5'); core.addColorStop(1, '#428bb2');
        ctx.fillStyle = core;
        ctx.beginPath(); ctx.arc(0, -26 * s, 12 * s, 0, 6.29); ctx.fill();
        face(0, -27 * s, 8.5 * s, null, 'smile');
        ctx.strokeStyle = 'rgba(178,247,255,0.9)';
        ctx.lineWidth = 2 * s;
        ctx.beginPath(); ctx.arc(0, -26 * s, (20 + Math.sin(t * 4) * 2) * s, t, t + Math.PI * 1.5); ctx.stroke();
        for (const [px, py] of [[-20, -43], [20, -37], [22, -14], [-22, -16]]) {
            ctx.fillStyle = '#dcffff';
            ctx.beginPath(); ctx.arc(px * s, py * s, 2.5 * s, 0, 6.29); ctx.fill();
        }
    } else if (key === 'thornbark') {
        leafPair(0, 0, s);
        const bark = ctx.createLinearGradient(-18 * s, -37 * s, 18 * s, 24 * s);
        bark.addColorStop(0, '#a18b55'); bark.addColorStop(0.48, '#76603a'); bark.addColorStop(1, '#493b29');
        ctx.fillStyle = bark;
        roundRect(ctx, -22 * s, -39 * s, 44 * s, 63 * s, 13 * s); ctx.fill();
        ctx.strokeStyle = '#403621';
        ctx.lineWidth = 2.5 * s;
        ctx.beginPath();
        ctx.moveTo(-10 * s, -33 * s); ctx.quadraticCurveTo(-4 * s, -15 * s, -11 * s, 10 * s);
        ctx.moveTo(5 * s, -35 * s); ctx.quadraticCurveTo(0, -12 * s, 8 * s, 20 * s);
        ctx.stroke();
        ctx.fillStyle = '#b6cd70';
        for (const [px, py, dir] of [[-20, -29, -1], [21, -20, 1], [-21, -7, -1], [20, 5, 1], [-13, 20, -1]]) {

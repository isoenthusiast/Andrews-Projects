        ctx.quadraticCurveTo(-10 * s, -30 * s, -1 * s, -29 * s);
        ctx.quadraticCurveTo(10 * s, -28 * s, 12 * s, -18 * s);
        ctx.quadraticCurveTo(2 * s, -23 * s, -13 * s, -19 * s);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = '#4a7c2a'; ctx.lineWidth = 4.5 * s; ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(-1 * s, -28 * s);
        ctx.quadraticCurveTo(3 * s, -36 * s, 9 * s, -39 * s);
        ctx.stroke();

        face(0, -6 * s, 12 * s, 'angry', 'open');
        ctx.restore();
    }
    ctx.restore();
}

function drawBuriedMine(p, s) {
    shadow(p.x, p.y + 22, 20 * s, 7 * s);
    ctx.fillStyle = '#5a4423';
    ctx.beginPath(); ctx.ellipse(p.x, p.y + 16, 22 * s, 11 * s, 0, 0, 6.29); ctx.fill();
    ctx.fillStyle = '#7a5d2e';
    ctx.beginPath(); ctx.ellipse(p.x, p.y + 12, 13 * s, 6 * s, 0, 0, 6.29); ctx.fill();
    if (p.fuse < 7.2) {
        ctx.fillStyle = 'rgba(240,80,50,' + (0.4 + 0.4 * Math.sin(state.t * 10)) + ')';
        ctx.beginPath(); ctx.arc(p.x + 10, p.y + 8, 4, 0, 6.29); ctx.fill();
    }
}

// ------------------------------- Draw: zombies ---------------------------
// 把 #rrggbb 往白（amt > 0）或黑（amt < 0）调，配色表里只写一个主色，衣服、
// 裤子、头发和高光的整套深浅都从它推出来。
function tint(hex, amt) {
    const n = parseInt(hex.slice(1), 16);
    const mix = c => clamp(Math.round(amt > 0 ? c + (255 - c) * amt : c * (1 + amt)), 0, 255);
    return 'rgb(' + mix((n >> 16) & 255) + ',' + mix((n >> 8) & 255) + ',' + mix(n & 255) + ')';
}

// 一个种类的配色只算一次。
const zombiePalettes = {};
function zombiePal(T, kind) {
    let p = zombiePalettes[kind];
    if (p) return p;
    p = zombiePalettes[kind] = {
        skin: T.skin, skinLt: tint(T.skin, 0.24), skinDk: tint(T.skin, -0.34),
        coat: T.coat, coatLt: tint(T.coat, 0.26), coatDk: tint(T.coat, -0.34),
        trim: T.edge,
        pants: tint(T.coat, -0.45), pantsDk: tint(T.coat, -0.62),
        boot: '#2c3327', bootDk: '#15190f',
        hair: tint(T.edge, 0.04), hairLt: tint(T.edge, 0.34),
        bone: '#e9e3cb'
    };
    return p;
}

// 一条腿：锥形裤腿、膝盖的褶、破裤脚和一只厚靴子。
function zombieLeg(x, tilt, pal) {
    ctx.save();
    ctx.translate(x, 0);
    ctx.rotate(tilt);
    ctx.fillStyle = pal.pants;
    ctx.beginPath();
    ctx.moveTo(-6.5, 0); ctx.lineTo(6.5, 0); ctx.lineTo(5.2, 30); ctx.lineTo(-5.2, 30);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = pal.pantsDk;
    ctx.beginPath();
    ctx.moveTo(-6, 14); ctx.lineTo(6, 14); ctx.lineTo(5.6, 20); ctx.lineTo(-5.6, 20);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.08)';
    roundRect(ctx, -5.8, 1, 2.4, 26, 1.2); ctx.fill();
    ctx.fillStyle = pal.pantsDk;
    for (let i = 0; i < 3; i++) {
        ctx.beginPath();
        ctx.moveTo(-5.4 + i * 3.6, 27); ctx.lineTo(-3.6 + i * 3.6, 32); ctx.lineTo(-1.8 + i * 3.6, 27);
        ctx.closePath(); ctx.fill();
    }
    ctx.fillStyle = pal.boot;
    roundRect(ctx, -7.5, 30, 15, 11, 4); ctx.fill();
    ctx.fillStyle = pal.bootDk;
    roundRect(ctx, -9, 38, 18, 4.5, 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.10)';
    roundRect(ctx, -6, 31.5, 3, 7, 1.5); ctx.fill();
    ctx.restore();
}

// 一条前伸的手臂：袖子、翻边的袖口、露出来的手腕和四根手指。
function zombieArm(y, rot, pal) {
    ctx.save();
    ctx.translate(-11, y);
    ctx.rotate(rot);
    ctx.fillStyle = pal.coatDk;
    roundRect(ctx, -29, -7, 28, 14, 6.5); ctx.fill();
    ctx.fillStyle = pal.coat;
    roundRect(ctx, -28.5, -6, 27, 12, 5.5); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.10)';
    roundRect(ctx, -26, -5, 20, 3.2, 1.6); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,0.18)';
    roundRect(ctx, -5, -6, 6, 12, 3); ctx.fill();
    ctx.fillStyle = pal.trim;
    roundRect(ctx, -30, -6.4, 5.5, 12.8, 2.4); ctx.fill();
    ctx.fillStyle = pal.skin;
    roundRect(ctx, -35.5, -5, 8.5, 10, 3); ctx.fill();
    for (let i = 0; i < 4; i++) {
        ctx.fillStyle = i % 2 ? pal.skin : pal.skinLt;
        roundRect(ctx, -43 + i * 0.7, -5 + i * 3.1, 8.5, 2.5, 1.25); ctx.fill();
    }
    ctx.strokeStyle = 'rgba(0,0,0,0.14)';
    ctx.lineWidth = 0.8;
    for (let i = 1; i < 4; i++) {
        ctx.beginPath();
        ctx.moveTo(-36, -5 + i * 3.1); ctx.lineTo(-30, -5 + i * 3.1); ctx.stroke();
    }
    ctx.restore();
}

// 脑袋：渐变头骨、陷进去的眼窝、参差的牙和缝过线的嘴。
function zombieHead(hy, pal, T, eat) {
    ctx.fillStyle = pal.skinDk;
    ctx.beginPath(); ctx.ellipse(-14.5, hy + 1.5, 3.2, 4.6, -0.25, 0, 6.29); ctx.fill();
    ctx.beginPath(); ctx.ellipse(14.5, hy + 1.5, 3.2, 4.6, 0.25, 0, 6.29); ctx.fill();

    const hg = ctx.createRadialGradient(-5.5, hy - 7, 2, 0, hy, 19.5);
    hg.addColorStop(0, pal.skinLt); hg.addColorStop(0.55, pal.skin); hg.addColorStop(1, pal.skinDk);
    ctx.fillStyle = hg;
    ctx.beginPath(); ctx.arc(0, hy, 15, 0, 6.29); ctx.fill();
    ctx.strokeStyle = tint(T.skin, -0.5); ctx.lineWidth = 1.3; ctx.stroke();

    ctx.fillStyle = 'rgba(0,0,0,0.15)';
    ctx.beginPath(); ctx.ellipse(0, hy + 8.5, 12, 5.5, 0, 0, 6.29); ctx.fill();
    ctx.beginPath(); ctx.ellipse(12.5, hy - 4, 4.5, 7, 0.3, 0, 6.29); ctx.fill();

    ctx.fillStyle = 'rgba(22,30,18,0.45)';
    roundRect(ctx, -10.6, hy - 8.6, 10, 9.4, 4.5); ctx.fill();
    roundRect(ctx, -1, hy - 8.6, 10, 9.4, 4.5); ctx.fill();

    ctx.fillStyle = '#efeadd';
    ctx.beginPath(); ctx.arc(-5.5, hy - 3, 4.2, 0, 6.29); ctx.fill();
    ctx.beginPath(); ctx.arc(3, hy - 3, 4.2, 0, 6.29); ctx.fill();
    ctx.strokeStyle = 'rgba(150,80,60,0.45)'; ctx.lineWidth = 0.7;
    ctx.beginPath(); ctx.moveTo(-8, hy - 4.6); ctx.lineTo(-3.4, hy - 2.4); ctx.stroke();

    ctx.fillStyle = T.boss ? '#c0392b' : '#1a2415';
    ctx.beginPath(); ctx.arc(-6.5, hy - 3, 2.1, 0, 6.29); ctx.fill();
    ctx.beginPath(); ctx.arc(2, hy - 3, 2.1, 0, 6.29); ctx.fill();
    if (T.boss || T.hat === 'cinder') {
        ctx.fillStyle = 'rgba(255,190,90,0.85)';
        ctx.beginPath(); ctx.arc(-6.4, hy - 3.5, 0.85, 0, 6.29); ctx.fill();
        ctx.beginPath(); ctx.arc(2.1, hy - 3.5, 0.85, 0, 6.29); ctx.fill();
    }

    ctx.strokeStyle = 'rgba(26,20,12,0.7)'; ctx.lineWidth = 2.3; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-11, hy - 10.6); ctx.lineTo(-1.2, hy - 7.4); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(11, hy - 10.6); ctx.lineTo(1.2, hy - 7.4); ctx.stroke();

    ctx.fillStyle = 'rgba(28,24,14,0.5)';
    ctx.beginPath(); ctx.ellipse(-1.7, hy + 1.3, 1.1, 1.6, 0, 0, 6.29);
    ctx.ellipse(1.7, hy + 1.3, 1.1, 1.6, 0, 0, 6.29); ctx.fill();

    const mh = eat ? 9 : 5;
    ctx.fillStyle = '#2a130e';
    roundRect(ctx, -7.5, hy + 4, 15, mh, 3); ctx.fill();
    ctx.fillStyle = pal.bone;
    for (let i = 0; i < 4; i++) ctx.fillRect(-6.2 + i * 3.5, hy + 4, 2.3, eat ? 3.4 : 2.6);
    if (eat) for (let i = 0; i < 3; i++) ctx.fillRect(0.4 + i * 3.6, hy + mh - 3.4, 2.3, 3.4);
    ctx.strokeStyle = 'rgba(30,20,12,0.5)'; ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(-7.5, hy + 5); ctx.lineTo(-10.5, hy + 3.8);
    ctx.moveTo(-7.5, hy + 8.4); ctx.lineTo(-10.5, hy + 9.6);
    ctx.stroke();

    ctx.strokeStyle = 'rgba(60,36,26,0.65)'; ctx.lineWidth = 1.5;      // 脸上的旧伤
    ctx.beginPath(); ctx.moveTo(-13, hy - 1.5); ctx.lineTo(-8, hy + 4.5); ctx.stroke();
    ctx.strokeStyle = 'rgba(238,230,212,0.7)'; ctx.lineWidth = 1;
    for (let i = 0; i < 2; i++) {
        ctx.beginPath();
        ctx.moveTo(-11.6 + i * 2.2, hy - 0.6 + i * 1.3);
        ctx.lineTo(-9.4 + i * 2.2, hy + 1.4 + i * 1.3);
        ctx.stroke();
    }

    ctx.fillStyle = pal.hair;
    ctx.beginPath();
    ctx.moveTo(-14, hy - 3); ctx.quadraticCurveTo(-2, hy - 23, 13, hy - 7);
    ctx.quadraticCurveTo(5, hy - 13, -14, hy - 3); ctx.closePath(); ctx.fill();
    ctx.fillStyle = pal.hairLt;
    ctx.beginPath();
    ctx.moveTo(-11, hy - 6.5); ctx.quadraticCurveTo(-3.5, hy - 17, 6.5, hy - 9.5);
    ctx.quadraticCurveTo(-1, hy - 12.5, -11, hy - 6.5); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = pal.hairLt; ctx.lineWidth = 1.7; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-9, hy - 12); ctx.lineTo(-12.5, hy - 19);
    ctx.moveTo(-4, hy - 15); ctx.lineTo(-6, hy - 23);
    ctx.stroke();
}

function drawZombie(z) {
    const T = ZOMBIE_TYPES[z.kind];
    if (INVADER_TYPES[z.kind]) { drawInvader(z); return; }
    const s = T.radius / 22;
    const eat = !!z.eating;
    const swing = eat ? 0 : Math.sin(z.walkPhase) * 7;
    // hurtT 从 0.12 掉回 0。recoil 是中间高、两头低的包络：单次命中看起来是"挨了一下再站稳"，
    // 而荆棘反伤这种每帧刷新的连续伤害不会把身体锁在后仰姿势里抽搐。
    const hurt = clamp(z.hurtT / 0.12, 0, 1);
    const recoil = Math.sin(Math.PI * (1 - hurt));

    ctx.save();
    ctx.translate(z.x, z.y);
    ctx.scale(s, s);
    if (z.vaultFor > 0) {                              // 撑杆跳的那一下：往前上方窜
        const arc = Math.sin((1 - z.vaultFor / (T.vaultDuration || 0.55)) * Math.PI);
        ctx.translate(-7 * arc, -36 * arc);
        ctx.rotate(-0.22 * arc);
    }
    if (recoil > 0.01) {
        // 向后仰并轻微压扁，围绕脚底缩放，脚不动
        ctx.translate(5 * recoil, 0);
        ctx.rotate(0.075 * recoil);
        ctx.translate(0, 40); ctx.scale(1 + 0.05 * recoil, 1 - 0.075 * recoil); ctx.translate(0, -40);
    }

    shadow(0, 41 + (eat ? 0 : Math.abs(Math.sin(z.walkPhase)) * -1.5), 25, 7);

    const pal = zombiePal(T, z.kind);
    const hpFrac = clamp(z.hp / Math.max(1, z.maxHp), 0, 1);
    // 护具的磨损程度：路障、铁桶、石甲被打得越狠，裂缝和凹坑越多。
    const wear = T.armor ? clamp(1 - z.armor / Math.max(1, z.maxArmor), 0, 1) : 0;

    // 腿：后腿先画，前腿压在上面，走起来才有前后的关系
    zombieLeg(-13 + swing * 0.5, swing * 0.012, pal);
    zombieLeg(2 - swing * 0.5, -swing * 0.012, pal);

    // 外套：上亮下暗的渐变，配敞开的衣领、破下摆和一条腰带
    const cg = ctx.createLinearGradient(-15, -24, 15, 12);
    cg.addColorStop(0, pal.coatLt); cg.addColorStop(0.55, pal.coat); cg.addColorStop(1, pal.coatDk);
    ctx.fillStyle = cg;
    roundRect(ctx, -15, -24, 30, 34, 6); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,0.13)';
    roundRect(ctx, 7, -24, 8, 34, 4); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.09)';
    roundRect(ctx, -15, -23.5, 3.4, 32, 1.7); ctx.fill();
    ctx.fillStyle = pal.trim;
    ctx.beginPath();
    ctx.moveTo(-12, -23.5); ctx.lineTo(-1.5, -9); ctx.lineTo(-11, -5); ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(12, -23.5); ctx.lineTo(1.5, -9); ctx.lineTo(11, -5); ctx.closePath(); ctx.fill();
    ctx.fillStyle = pal.coatDk;
    ctx.beginPath();
    ctx.moveTo(-1.5, -9); ctx.lineTo(1.5, -9); ctx.lineTo(0, -1); ctx.closePath(); ctx.fill();
    ctx.fillStyle = pal.trim;
    ctx.beginPath();
    ctx.moveTo(-15, 4); ctx.lineTo(-9, 12.5); ctx.lineTo(-3, 4); ctx.lineTo(3, 12.5);
    ctx.lineTo(9, 4); ctx.lineTo(15, 11); ctx.lineTo(15, 8); ctx.lineTo(-15, 8);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    roundRect(ctx, -15.5, 0, 31, 5.6, 2); ctx.fill();
    ctx.fillStyle = '#c8a24a';
    roundRect(ctx, -4.4, -0.8, 8.8, 7.2, 2); ctx.fill();
    ctx.fillStyle = 'rgba(60,40,10,0.45)';
    roundRect(ctx, -1.2, 1.2, 2.4, 3.2, 1.2); ctx.fill();
    if (hpFrac < 0.7) {
        ctx.fillStyle = 'rgba(44,54,32,0.42)';
        ctx.beginPath(); ctx.ellipse(2.5, -14, 5.4, 4, 0.3, 0, 6.29); ctx.fill();
        ctx.fillStyle = pal.trim;                      // 肩膀被撕掉的一块布
        ctx.beginPath();
        ctx.moveTo(-15, -22); ctx.lineTo(-9, -16); ctx.lineTo(-15, -12); ctx.closePath(); ctx.fill();
        ctx.strokeStyle = 'rgba(232,224,200,0.5)'; ctx.lineWidth = 1.1;
        for (let i = 0; i < 3; i++) {
            ctx.beginPath();
            ctx.moveTo(0.4 + i * 2.6, -17.5 + i * 0.5); ctx.lineTo(-0.6 + i * 2.6, -10.6 + i * 0.5);
            ctx.stroke();
        }
    }
    if (hpFrac < 0.35) {
        ctx.fillStyle = 'rgba(44,54,32,0.45)';
        ctx.beginPath(); ctx.ellipse(-7.5, -7, 4.4, 6, -0.2, 0, 6.29);
        ctx.ellipse(6.5, -2, 3.4, 4.4, 0.3, 0, 6.29); ctx.fill();
    }

    // 两条前伸的胳膊，上面的那条先画
    const armBob = eat ? Math.sin(state.t * 15) * 3 : Math.sin(z.walkPhase) * 1.6;
    zombieArm(-18 + armBob, eat ? 0.06 : Math.sin(z.walkPhase) * 0.07, pal);
    zombieArm(-8 - armBob, eat ? -0.06 : -Math.sin(z.walkPhase) * 0.07, pal);

    // 脑袋
    const hy = -37 + (eat ? Math.sin(state.t * 15) * 2 : 0);
    zombieHead(hy, pal, T, eat);

    // 帽子
    if (T.hat === 'cone') {
        const coneW = y => 15 * (y + 48) / 38;         // 路障在高度 y 处的半宽
        ctx.fillStyle = '#8f4f18';
        roundRect(ctx, -17, hy - 12, 34, 9, 3); ctx.fill();
        ctx.fillStyle = '#c1762c';
        roundRect(ctx, -17, hy - 12, 34, 5, 2.5); ctx.fill();
        const cgd = ctx.createLinearGradient(-15, 0, 15, 0);
        cgd.addColorStop(0, '#f6ae57'); cgd.addColorStop(0.42, '#e08a30'); cgd.addColorStop(1, '#a2501a');
        ctx.fillStyle = cgd;
        const tip = wear > 0.5 ? -38 : -48;                 // 撞狠了，尖头被削掉一截
        const tw = coneW(tip);
        ctx.beginPath();
        ctx.moveTo(-tw, hy + tip);
        ctx.lineTo(-tw * 0.3, hy + tip + 2.5);
        ctx.lineTo(tw * 0.35, hy + tip - 2.5);
        ctx.lineTo(tw, hy + tip + 1);
        ctx.lineTo(15, hy - 10); ctx.lineTo(-15, hy - 10);
        ctx.closePath(); ctx.fill();
        ctx.fillStyle = 'rgba(255,250,236,0.88)';
        const bands = tip <= -42 ? [[-30, -23], [-41, -36]] : [[-30, -23]];
        for (const [y1, y2] of bands) {
            const w1 = coneW(y1) * 0.94, w2 = coneW(y2) * 0.94;
            ctx.beginPath();
            ctx.moveTo(-w1, hy + y1); ctx.lineTo(w1, hy + y1);
            ctx.lineTo(w2, hy + y2); ctx.lineTo(-w2, hy + y2);
            ctx.closePath(); ctx.fill();
        }
        if (wear > 0.2) {
            ctx.fillStyle = 'rgba(58,30,10,0.5)';
            ctx.beginPath();
            ctx.moveTo(-15, hy - 10); ctx.lineTo(-9, hy - 10); ctx.lineTo(-13.5, hy - 22);
            ctx.closePath(); ctx.fill();
            ctx.strokeStyle = 'rgba(70,38,12,0.5)'; ctx.lineWidth = 1.4;
            ctx.beginPath(); ctx.moveTo(4, hy - 35); ctx.lineTo(9.5, hy - 27); ctx.stroke();
        }
        if (wear > 0.6) {
            ctx.fillStyle = 'rgba(58,30,10,0.45)';
            ctx.beginPath();
            ctx.moveTo(15, hy - 10); ctx.lineTo(8, hy - 10); ctx.lineTo(12.5, hy - 24);
            ctx.closePath(); ctx.fill();
        }
    } else if (T.hat === 'bucket') {
        const bg = ctx.createLinearGradient(-18, 0, 18, 0);
        bg.addColorStop(0, '#e4ebf0'); bg.addColorStop(0.28, '#aab6be');
        bg.addColorStop(0.62, '#7f8c96'); bg.addColorStop(1, '#565f67');
        ctx.fillStyle = bg;
        ctx.beginPath();
        ctx.moveTo(-13, hy - 32); ctx.lineTo(13, hy - 32);
        ctx.lineTo(16, hy - 6); ctx.lineTo(-16, hy - 6);
        ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#ced8df';
        ctx.save();                                  // 凹了的桶口翻边
        ctx.translate(0, hy - 31);
        ctx.rotate(wear > 0.5 ? -0.15 : 0);
        roundRect(ctx, -16.5, -4, 33, 8, 3); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.5)';
        roundRect(ctx, -14, -2.6, 17, 2, 1); ctx.fill();
        if (wear > 0.5) {                            // 被砸出来的缺口
            ctx.fillStyle = 'rgba(40,50,58,0.75)';
            ctx.beginPath();
            ctx.moveTo(-16.5, 3.6); ctx.lineTo(-9, 1.5); ctx.lineTo(-14, -3.5);
            ctx.closePath(); ctx.fill();
        }
        ctx.restore();
        ctx.strokeStyle = 'rgba(46,56,64,0.45)'; ctx.lineWidth = 1.4;
        ctx.beginPath(); ctx.moveTo(-14.6, hy - 21); ctx.lineTo(14.6, hy - 21); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(-15.4, hy - 12); ctx.lineTo(15.4, hy - 12); ctx.stroke();
        ctx.fillStyle = '#eef3f6';
        ctx.beginPath(); ctx.arc(-10.5, hy - 27, 1.3, 0, 6.29); ctx.arc(10.5, hy - 27, 1.3, 0, 6.29); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.25)';
        roundRect(ctx, -9, hy - 31.5, 3.4, 25, 1.7); ctx.fill();
        if (wear > 0.15) {
            ctx.strokeStyle = 'rgba(40,50,58,0.45)'; ctx.lineWidth = 1.6;
            ctx.beginPath(); ctx.arc(-4, hy - 16, 4.6, -0.5, 1.5); ctx.stroke();
            ctx.beginPath(); ctx.arc(7, hy - 25, 3.8, 2.2, 4.2); ctx.stroke();
        }
        if (wear > 0.55) {
            ctx.strokeStyle = 'rgba(40,50,58,0.5)'; ctx.lineWidth = 1.4;
            ctx.beginPath(); ctx.arc(2, hy - 10, 5.4, 3.4, 5.6); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(-16, hy - 28); ctx.lineTo(-10, hy - 22); ctx.stroke();
        }
    } else if (T.hat === 'goggles') {
        ctx.fillStyle = tint(T.coat, -0.52);
        ctx.beginPath();
        ctx.moveTo(-15.5, hy + 1); ctx.quadraticCurveTo(-13.5, hy - 22, 0, hy - 23);
        ctx.quadraticCurveTo(13.5, hy - 22, 15.5, hy + 1);
        ctx.quadraticCurveTo(0, hy - 11, -15.5, hy + 1); ctx.closePath(); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.09)';
        ctx.beginPath();
        ctx.moveTo(-11, hy - 5); ctx.quadraticCurveTo(-9, hy - 18, -1, hy - 19.5);
        ctx.quadraticCurveTo(-6, hy - 14, -11, hy - 5); ctx.closePath(); ctx.fill();
        ctx.fillStyle = '#3a3226';
        roundRect(ctx, -16.5, hy - 9, 33, 7, 3); ctx.fill();
        ctx.fillStyle = '#c8a24a';
        ctx.beginPath(); ctx.arc(-6, hy - 4.5, 5.6, 0, 6.29); ctx.arc(6, hy - 4.5, 5.6, 0, 6.29); ctx.fill();
        ctx.fillStyle = '#8fd8d2';

    } else if (T.hat === 'medic') {
        ctx.fillStyle = '#5d7f52';
        ctx.beginPath();

    } else if (T.hat === 'cinder') {
        const pulse = 0.75 + 0.25 * Math.sin(state.t * 7);
        ctx.fillStyle = 'rgba(255,150,60,' + (0.26 * pulse).toFixed(3) + ')';
        ctx.beginPath(); ctx.ellipse(0, hy - 20, 21, 16, 0, 0, 6.29); ctx.fill();
        ctx.fillStyle = '#3c2a1d';
        ctx.beginPath();
        ctx.moveTo(-14, hy - 8); ctx.lineTo(-9, hy - 24); ctx.lineTo(-2, hy - 16);
        ctx.lineTo(2, hy - 28); ctx.lineTo(8, hy - 17); ctx.lineTo(14, hy - 26);

        ctx.beginPath();

        ctx.lineTo(3, hy - 24); ctx.lineTo(8, hy - 13); ctx.closePath(); ctx.fill();

        ctx.moveTo(-4, hy - 13); ctx.lineTo(-1, hy - 19); ctx.lineTo(3, hy - 13); ctx.closePath(); ctx.fill();
        ctx.fillStyle = 'rgba(255,190,90,' + (0.55 * pulse).toFixed(3) + ')';
        for (let i = 0; i < 3; i++) {                   // 火星
            const a = state.t * 3 + i * 2.1;

        roundRect(ctx, -16, hy - 12, 32, 3.6, 1.8); ctx.fill();

    } else if (T.hat === 'fuse') {
        const blink = 0.6 + 0.4 * Math.sin(state.t * 9);
        ctx.fillStyle = '#2f3238';
        ctx.beginPath(); ctx.arc(0, hy - 20, 13, 0, 6.29); ctx.fill();

        ctx.beginPath(); ctx.arc(4, hy - 48, 0.6 + 2.6 * blink, 0, 6.29); ctx.fill();
    } else if (T.hat === 'hood') {
        ctx.fillStyle = tint(T.coat, -0.36);

        ctx.fillStyle = '#f2e6cd';

    } else if (T.boss) {
        const hg = ctx.createLinearGradient(-19, hy - 28, 19, hy - 6);

        roundRect(ctx, -15.5, hy - 25.5, 7.5, 17, 3); ctx.fill();
        ctx.fillStyle = '#171d13';
        roundRect(ctx, -14, hy - 12, 28, 4.5, 2.2); ctx.fill();
        ctx.fillStyle = '#c8a24a';
        for (const rx of [-15, -5, 5, 15]) {
            ctx.beginPath(); ctx.arc(rx, hy - 25, 1.2, 0, 6.29); ctx.fill();

        ctx.beginPath(); ctx.arc(0, hy - 39, 4, 0, 6.29); ctx.fill();
        ctx.fillStyle = 'rgba(255,224,206,' + (0.85 * blink).toFixed(3) + ')';

        if (z.kind === 'gargantuar') {                  // 扛着的电线杆
            ctx.save();
            ctx.translate(6, -22);
            ctx.rotate(-0.5);
            ctx.fillStyle = '#6d4a29';
            roundRect(ctx, 0, -8, 16, 96, 7); ctx.fill();
            ctx.fillStyle = '#8a6136';
            roundRect(ctx, 1.6, -6, 12.8, 92, 6); ctx.fill();
            ctx.strokeStyle = 'rgba(70,46,22,0.45)'; ctx.lineWidth = 1.2;
            for (let i = 0; i < 3; i++) {
                ctx.beginPath();
                ctx.moveTo(4.2 + i * 3.4, -3); ctx.lineTo(4.8 + i * 3.4, 84); ctx.stroke();
            }
            ctx.fillStyle = '#42301c';
            roundRect(ctx, -1.2, 10, 18.4, 7, 3); ctx.fill();

    }
    if (T.vault) {                                     // 手里那根撑杆
        ctx.save();
        ctx.translate(-15, 4);
        ctx.rotate(z.vaultFor > 0 ? -1.2 : -0.45);
        const pole = ctx.createLinearGradient(0, -12, 0, 92);
        pole.addColorStop(0, '#e6d3a6'); pole.addColorStop(0.5, '#c3a469'); pole.addColorStop(1, '#8a6a34');
        ctx.fillStyle = pole;
        roundRect(ctx, -3, -14, 6, 98, 3); ctx.fill();

        roundRect(ctx, -3.7, 42, 7.4, 6, 2); ctx.fill();
        ctx.restore();
    }
    if (T.spitEvery) {                                 // 嘴里挂着的酸液
        const drool = 0.5 + 0.5 * Math.sin(state.t * 3);
        ctx.fillStyle = 'rgba(150,200,90,0.85)';
        ctx.beginPath();
        ctx.ellipse(0, hy + 11, 3.4, 4 + drool * 3.5, 0, 0, 6.29);
        ctx.fill();

    if (T.heal) {
        ctx.strokeStyle = 'rgba(140,220,120,' + (0.24 + 0.12 * Math.sin(state.t * 4)) + ')';
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(0, -8, T.healRange / s, 0, 6.29); ctx.stroke();
    }
    if (z.dashFor > 0) {
        ctx.strokeStyle = 'rgba(190,225,245,0.8)';
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(22, -18); ctx.lineTo(40, -18); ctx.moveTo(25, -7); ctx.lineTo(46, -7); ctx.stroke();
    }
    ctx.restore();

    // damage + slow overlays
    if (z.hurtT > 0) {
        // 贴着身体的一团加色柔光，比整块白色椭圆干净：边缘化开，看不出形状，
        // 亮起来的是僵尸本身而不是套在外面的一层壳。
        const cy = z.y - 18 * s;
        const r = 44 * s;
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        const glow = ctx.createRadialGradient(z.x, cy, 3 * s, z.x, cy, r);
        glow.addColorStop(0, 'rgba(255,252,240,' + (0.34 * hurt).toFixed(3) + ')');
        glow.addColorStop(0.45, 'rgba(255,222,198,' + (0.2 * hurt).toFixed(3) + ')');
        glow.addColorStop(1, 'rgba(255,150,110,0)');
        ctx.fillStyle = glow;
        ctx.beginPath(); ctx.ellipse(z.x, cy, r * 0.72, r, 0, 0, 6.29); ctx.fill();
        ctx.restore();
    }
    if (z.slowT > 0) {
        ctx.fillStyle = 'rgba(150,220,255,0.28)';
        ctx.beginPath(); ctx.ellipse(z.x, z.y - 6 * s, 24 * s, 42 * s, 0, 0, 6.29); ctx.fill();
    }

    // boss health bar
    if (T.boss) {
        const sc = clamp(s, 1, 2.2);
        const w = 70 * sc, h = 9;
        const bx = z.x - w / 2, by = Math.max(14, z.y - 78 * sc);
        ctx.fillStyle = 'rgba(0,0,0,0.6)';
        roundRect(ctx, bx - 2, by - 2, w + 4, h + 4, 4); ctx.fill();
        ctx.fillStyle = '#c0392b';
        roundRect(ctx, bx, by, Math.max(3, w * clamp(jobRatio(z), 0, 1)), h, 3); ctx.fill();
        ctx.fillStyle = '#f2e6cd';
        ctx.font = 'bold 11px ' + CJK;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(tr(T.name), z.x, by - 10);
    }
}

function jobRatio(z) {
    const total = z.maxHp + z.maxArmor;
    return total > 0 ? (z.hp + z.armor) / total : 0;
}

// ------------------------------- Draw: mowers ----------------------------
function drawMowers() {
    for (const m of mowers) {
        if (m.state === 'spent') continue;
        const y = cellCY(m.r) + 20;
        ctx.save();
        ctx.translate(m.x, y);
        shadow(0, 12, 22, 6);
        ctx.fillStyle = '#c0392b';
        roundRect(ctx, -20, -18, 40, 20, 6); ctx.fill();
        ctx.fillStyle = '#e0713f';
        roundRect(ctx, -20, -18, 40, 8, 5); ctx.fill();
        ctx.fillStyle = '#2b2b2b';
        ctx.beginPath(); ctx.arc(-11, 4, 8, 0, 6.29); ctx.fill();
        ctx.beginPath(); ctx.arc(11, 4, 8, 0, 6.29); ctx.fill();
        ctx.fillStyle = '#6b6b6b';
        ctx.beginPath(); ctx.arc(-11, 4, 3, 0, 6.29); ctx.fill();
        ctx.beginPath(); ctx.arc(11, 4, 3, 0, 6.29); ctx.fill();
        ctx.strokeStyle = '#8a8a8a'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(-16, -18); ctx.lineTo(-24, -32); ctx.stroke();
        if (m.state === 'run') {
            ctx.fillStyle = 'rgba(255,255,255,0.25)';
            ctx.beginPath(); ctx.arc(-22, -2, 24, 0, 6.29); ctx.fill();
        }
        ctx.restore();
    }
}

// ------------------------------- Draw: 兔子园丁 --------------------------
function drawRabbit() {
    if (!rabbit) return;
    const bob = Math.abs(Math.sin(rabbit.anim * 11)) * 7 * rabbit.hopAmp;
    const step = Math.sin(rabbit.anim * 11) * 3 * rabbit.hopAmp;

    ctx.save();
    ctx.fillStyle = 'rgba(30,20,10,0.26)';
    ctx.beginPath();
    ctx.ellipse(rabbit.x, rabbit.y + 10, 11, 4, 0, 0, 6.29);
    ctx.fill();
    ctx.restore();

    ctx.save();
    ctx.translate(rabbit.x, rabbit.y - bob);
    ctx.scale(rabbit.face, 1);

    // tail + body
    ctx.fillStyle = '#f2ece0';
    ctx.beginPath(); ctx.arc(-11, 1, 4.2, 0, 6.29); ctx.fill();
    ctx.fillStyle = '#fdfaf3';
    ctx.beginPath(); ctx.ellipse(-1, 3, 11, 8, 0, 0, 6.29); ctx.fill();

    // legs, alternating with the hop
    ctx.fillStyle = '#eae2d3';
    ctx.beginPath(); ctx.ellipse(-6 + step, 9, 4, 3, 0, 0, 6.29); ctx.fill();
    ctx.beginPath(); ctx.ellipse(3 - step, 9, 4, 3, 0, 0, 6.29); ctx.fill();

    // ears — they flop a little while hopping
    const wig = Math.sin(rabbit.anim * 6) * (0.1 + rabbit.hopAmp * 0.18);
    for (const e of [{ a: -0.4 + wig, x: 5 }, { a: 0.08 + wig, x: 9.5 }]) {
        ctx.save();
        ctx.translate(e.x, -7);
        ctx.rotate(e.a);
        ctx.fillStyle = '#fdfaf3';
        roundRect(ctx, -2.7, -16, 5.4, 17, 2.7); ctx.fill();
        ctx.fillStyle = '#f0b3bf';
        roundRect(ctx, -1.3, -14, 2.6, 12, 1.3); ctx.fill();
        ctx.restore();
    }

    // head
    ctx.fillStyle = '#fdfaf3';
    ctx.beginPath(); ctx.arc(7, -3, 7.2, 0, 6.29); ctx.fill();
    ctx.fillStyle = '#f0b3bf';
    ctx.beginPath(); ctx.arc(12.6, -2, 2.1, 0, 6.29); ctx.fill();
    ctx.fillStyle = '#2a2018';
    ctx.beginPath(); ctx.arc(9, -5, 1.7, 0, 6.29); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    ctx.beginPath(); ctx.arc(9.6, -5.6, 0.6, 0, 6.29); ctx.fill();

    // the sun it is carrying home
    if (rabbit.hold > 0) {
        const h = clamp(rabbit.hold / 0.3, 0, 1);
        ctx.fillStyle = '#f2c14e';
        ctx.beginPath(); ctx.arc(3, -20 - h * 4, 3 + h * 2, 0, 6.29); ctx.fill();
        ctx.fillStyle = '#ffe98f';
        ctx.beginPath(); ctx.arc(3, -20 - h * 4, 1.6 + h, 0, 6.29); ctx.fill();
    }

    ctx.restore();
}

// ------------------------------- Draw: shots -----------------------------
function drawShots() {
    for (const s of shots) {
        const cold = s.proj === 'snow';
        const ember = s.proj === 'ember';
        const thorn = s.proj === 'thorn';
        ctx.fillStyle = cold ? '#bfe9ff' : ember ? '#ff9b51' : thorn ? '#c5e58a' : '#9ede63';
        ctx.beginPath(); ctx.arc(s.x, s.y, 7, 0, 6.29); ctx.fill();
        ctx.strokeStyle = cold ? '#5aa8d0' : ember ? '#b95035' : thorn ? '#517c36' : '#4d8a2c';
        ctx.lineWidth = 1.6; ctx.stroke();
        ctx.fillStyle = 'rgba(255,255,255,0.75)';
        ctx.beginPath(); ctx.arc(s.x - 2, s.y - 2.4, 2.4, 0, 6.29); ctx.fill();
    }
}

// ------------------------------- Draw: suns ------------------------------
function drawSuns() {
    for (const s of suns) {
        const blink = s.life < 3.2 ? (0.35 + 0.65 * Math.abs(Math.sin(state.t * 7))) : 1;
        ctx.save();
        ctx.globalAlpha = blink;
        const pulse = 1 + Math.sin(state.t * 3 + s.x * 0.05) * 0.05;
        ctx.translate(s.x, s.y);
        ctx.scale(pulse, pulse);
        const g = ctx.createRadialGradient(0, 0, 2, 0, 0, 26);
        g.addColorStop(0, 'rgba(255,246,190,0.95)');
        g.addColorStop(0.5, 'rgba(247,221,122,0.55)');
        g.addColorStop(1, 'rgba(247,221,122,0)');
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(0, 0, 26, 0, 6.29); ctx.fill();
        ctx.fillStyle = '#f7dd7a';
        for (let i = 0; i < 8; i++) {
            ctx.save();
            ctx.rotate(i * Math.PI / 4 + state.t * 0.6);
            roundRect(ctx, -2.4, -22, 4.8, 8, 2.2); ctx.fill();
            ctx.restore();
        }
        ctx.fillStyle = '#ffe98f';
        ctx.beginPath(); ctx.arc(0, 0, 13, 0, 6.29); ctx.fill();
        ctx.fillStyle = '#f2c14e';
        ctx.beginPath(); ctx.arc(0, 0, 9, 0, 6.29); ctx.fill();
        ctx.restore();
    }
}

// ------------------------------- Draw: fx --------------------------------
function drawFx() {
    for (const p of fx) {
        ctx.globalAlpha = clamp(p.life / p.max, 0, 1);
        if (COMBO && p.kind === 'boom') {
            const r = p.r * (1.25 - (p.life / p.max) * 0.55);
            const gr = ctx.createRadialGradient(p.x, p.y, 2, p.x, p.y, r);
            gr.addColorStop(0, 'rgba(255,240,180,0.95)');
            gr.addColorStop(0.45, 'rgba(230,126,34,0.7)');
            gr.addColorStop(1, 'rgba(192,57,43,0)');
            ctx.fillStyle = gr;
            ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, 6.29); ctx.fill();
            continue;
        }
        if (COMBO && p.kind === 'frost') {
            ctx.strokeStyle = 'rgba(133,193,233,0.95)';
            ctx.lineWidth = 2;
            ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (1.6 - p.life / p.max), 0, 6.29); ctx.stroke();
            continue;
        }
        if (COMBO && p.kind === 'bolt') {
            ctx.strokeStyle = '#d6b3ff';
            ctx.shadowColor = '#9b59b6';
            ctx.shadowBlur = 14;
            ctx.lineWidth = 2.6;
            ctx.lineJoin = 'round';
            for (let i = 0; i < p.pts.length - 1; i++) {
                const a = p.pts[i], b = p.pts[i + 1];
                ctx.beginPath();
                ctx.moveTo(a.x, a.y);
                for (let sg = 1; sg <= 5; sg++) {
                    const tt = sg / 5;
                    const jx = sg === 5 ? 0 : rand(-6, 6);
                    const jy = sg === 5 ? 0 : rand(-6, 6);
                    ctx.lineTo(a.x + (b.x - a.x) * tt + jx, a.y + (b.y - a.y) * tt + jy);
                }
                ctx.stroke();
            }
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#fff';
            for (const q of p.pts) { ctx.beginPath(); ctx.arc(q.x, q.y, 2.4, 0, 6.29); ctx.fill(); }
            continue;
        }
        ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.29); ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = 'bold 14px ' + CJK;
    for (const f of floats) {
        ctx.globalAlpha = clamp(f.life, 0, 1);
        ctx.fillStyle = f.color;
        ctx.fillText(tr(f.text), f.x, f.y);
    }
    ctx.globalAlpha = 1;
}

// ------------------------------- Draw: progress bar ----------------------
function progressFraction() {
    if (state.phase === 'won') return 1;
    if (state.wave <= 0) return 0;
    if (state.phase === 'running') {
        const spawned = state.waveTotal - state.spawnQueue.length;
        const frac = state.waveTotal ? spawned / state.waveTotal : 0;
        return clamp((state.wave - 1 + frac) / totalWaves, 0, 1);
    }
    return clamp(state.wave / totalWaves, 0, 1);
}

function drawProgress() {
    const x0 = LAWN_X, w = LAWN_R - LAWN_X, h = 13, y0 = LAWN_B + 8;
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    roundRect(ctx, x0, y0, w, h, h / 2); ctx.fill();

    const frac = progressFraction();
    if (frac > 0) {
        ctx.save();
        roundRect(ctx, x0, y0, w, h, h / 2); ctx.clip();
        const g = ctx.createLinearGradient(x0, 0, x0 + w, 0);
        g.addColorStop(0, '#8dbd43');
        g.addColorStop(1, '#c9ec7a');
        ctx.fillStyle = g;
        ctx.fillRect(x0, y0, w * frac, h);
        ctx.restore();
    }
    ctx.strokeStyle = 'rgba(166,216,74,0.55)'; ctx.lineWidth = 2;
    roundRect(ctx, x0, y0, w, h, h / 2); ctx.stroke();

    for (let i = 1; i <= totalWaves / 5; i++) {
        const fx2 = x0 + w * (i * 5 / totalWaves);
        ctx.fillStyle = i === totalWaves / 5 ? '#c0392b' : 'rgba(242,230,205,0.85)';
        ctx.fillRect(fx2 - 1.5, y0 - 4, 3, h + 8);
    }

    const mx = x0 + w * frac;
    ctx.fillStyle = '#f2e6cd';
    ctx.beginPath();
    ctx.moveTo(mx, y0 - 5);
    ctx.lineTo(mx - 6, y0 - 15);
    ctx.lineTo(mx + 6, y0 - 15);
    ctx.closePath(); ctx.fill();
}

// ------------------------------- Draw ------------------------------------
function drawDragLayer() {
    if (!drag || !drag.moved) return;
    const cell = cellOf(drag.x, drag.y);
    if (inLawn(cell.c, cell.r)) {
        const target = plantAt(cell.c, cell.r);
        const ok = target && target !== drag.plant && !!fusionOf(drag.plant.type, target.type);
        ctx.save();
        ctx.globalAlpha = 0.55;
        ctx.fillStyle = ok ? '#dcf3ac' : (target ? '#e0715f' : 'rgba(255,255,255,0.18)');
        roundRect(ctx, LAWN_X + cell.c * CELL_W + 3, LAWN_Y + cell.r * CELL_H + 3, CELL_W - 6, CELL_H - 6, 10);
        ctx.fill();
        ctx.restore();
    }
    ctx.save();
    ctx.globalAlpha = 0.8;
    drawOnePlant({
        type: drag.plant.type, x: drag.x, y: drag.y, hp: 1, maxHp: 1,
        grow: 1, hurtT: 0, armed: true, anim: drag.plant.anim
    }, 1);
    ctx.restore();
}

function draw() {
    if (!bg) bg = buildBackground();
    ctx.clearRect(0, 0, CANVAS_W, CANVAS_H);
    ctx.drawImage(bg, 0, 0);
    drawHints();
    drawDragLayer();
    drawMowers();
    drawRabbit();

    const items = [];
    for (const p of plants) { if (p.alive) items.push({ d: p.r * 100 + 12, f: () => drawOnePlant(p) }); }
    if (COMBO) for (const tw of towers) items.push({ d: tw.r * 100 + 30, f: () => drawPagoda(tw.x, tw.y, tw) });
    for (const z of zombies) { if (z.alive) items.push({ d: z.r * 100 + 60, f: () => drawZombie(z) }); }
    items.sort((a, b) => a.d - b.d);
    for (const it of items) it.f();
    drawPlantBars();

    drawShots();
    if (COMBO) drawTowerShots();
    drawSuns();
    drawFx();
    drawProgress();

    if (state.flash > 0) {
        ctx.fillStyle = 'rgba(255,240,200,' + (state.flash * 0.8) + ')';
        ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
    }

    if (state.paused && (state.phase === 'prep' || state.phase === 'running')) {
        ctx.fillStyle = 'rgba(6,12,5,0.5)';
        ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
        ctx.fillStyle = '#dcf3ac';
        ctx.font = 'bold 40px ' + CJK;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(tr('暂停'), CANVAS_W / 2, CANVAS_H / 2 - 10);
        ctx.font = '14px ' + UI;
        ctx.fillStyle = '#a8b998';
        ctx.fillText(tr('按空格继续'), CANVAS_W / 2, CANVAS_H / 2 + 30);
    }
}

function drawOnePlant(p, s) {
    if (s == null) s = 0.72 + 0.28 * p.grow;
    const buried = p.type === 'potatomine' && !p.armed;
    if (buried) {
        drawBuriedMine(p, s);
    } else {
        ctx.save();
        if (p.hurtT > 0) ctx.globalAlpha = 0.72;
        drawPlantArt(p.type, p.x, p.y, s, p.anim + state.t * 0);
        ctx.restore();
        if (p.hurtT > 0) {
            ctx.fillStyle = 'rgba(255,90,70,0.45)';
            ctx.beginPath(); ctx.arc(p.x, p.y - 6, 26, 0, 6.29); ctx.fill();
        }
    }
}

// 植物头顶的小血条：绿 → 琥珀 → 红，和长城守卫战里敌人的血条同一套画法。
// 单独一趟绘制，压在植物和僵尸之上，免得被正在啃食的僵尸挡住。
// 只有被啃过才亮出来，满血的草坪保持干净。
function drawPlantBars() {
    for (const p of plants) {
        if (!p.alive || p.hp >= p.maxHp) continue;
        const s = 0.72 + 0.28 * p.grow;
        const buried = p.type === 'potatomine' && !p.armed;
        drawHpBar(p.x, p.y - (buried ? 24 : 44) * s, clamp(p.hp / p.maxHp, 0, 1));
    }
}

function drawHpBar(cx, barY, pct) {
    const bw = 32, bh = 4;
    ctx.fillStyle = 'rgba(30,18,10,0.7)';
    roundRect(ctx, cx - bw / 2, barY, bw, bh, 2); ctx.fill();
    ctx.fillStyle = pct > 0.5 ? '#5cb85c' : pct > 0.22 ? '#e0a83c' : '#c0392b';
    roundRect(ctx, cx - bw / 2, barY, Math.max(1, bw * pct), bh, 2); ctx.fill();
}

// ------------------------------- HUD + UI --------------------------------
function flashStat(id) {
    const n = el(id);
    if (!n) return;
    n.classList.remove('flash');
    void n.offsetWidth;
    n.classList.add('flash');
}

function updateHud() {
    el('statSun').textContent = Math.floor(state.sun);
    el('statLife').textContent = mowersLeft();
    el('statWave').textContent = state.wave + ' / ' + totalWaves;
    updateRabbitButton();
    if (COMBO) {
        el('statGold').textContent = Math.floor(state.gold);
        el('statWall').textContent = Math.max(0, state.wall);
        el('sunCount').textContent = '☀ ' + Math.floor(state.sun) + '   🪙 ' + Math.floor(state.gold);
    } else {
        el('sunCount').textContent = '☀ ' + Math.floor(state.sun);
    }
}

// 兔子园丁：花 RABBIT_COST 阳光买断一次，本局永久自动收集阳光，没有等级。
function buyRabbit() {
    if (state.phase === 'over' || state.phase === 'won') return;
    if (state.rabbit) { toast('兔子园丁已经在草坪上忙着了'); return; }
    if (state.sun < RABBIT_COST) { toast('阳光不足，需要 ' + RABBIT_COST + ' ☀', true); return; }
    spendSun(RABBIT_COST);
    state.rabbit = true;
    spawnRabbit();
    Sfx.build();
    toast('兔子园丁上岗：它会把阳光捡回来');
    updateRabbitButton();
    scheduleAutoSave();
}

function updateRabbitButton() {
    const b = el('btnRabbit');
    if (!b) return;
    b.classList.toggle('on', state.rabbit);
    b.classList.toggle('poor', !state.rabbit && state.sun < RABBIT_COST);
    b.textContent = state.rabbit
        ? '🐰 兔子园丁：在岗'
        : '🐰 兔子园丁 · ☀ ' + RABBIT_COST;
}

function banner(msg, big) {
    const b = el('waveBanner');
    b.textContent = msg;
    b.classList.toggle('big', !!big);
}

function toast(msg, bad) {
    const t = el('toast');
    t.textContent = msg;
    t.classList.toggle('bad', !!bad);
    t.classList.add('show');
    clearTimeout(toast._timer);
    toast._timer = setTimeout(() => t.classList.remove('show'), 1900);
}

// 种子卡上的图标直接用游戏里的植物画法绘制，保证和种到草坪上的样子一致：
// 把 drawPlantArt 画到一块离屏画布上，再贴进卡片。
const PIC_W = 54, PIC_H = 54, PIC_SCALE = 0.45;

function plantIconCanvas(key) {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const c = document.createElement('canvas');
    c.className = 'pic';
    c.width = PIC_W * dpr;
    c.height = PIC_H * dpr;
    c.style.width = PIC_W + 'px';
    c.style.height = PIC_H + 'px';
    c.setAttribute('aria-label', (PLANT_TYPES[key] || {}).name || key);
    c.setAttribute('role', 'img');

    const real = ctx;
    ctx = c.getContext('2d');
    ctx.scale(dpr, dpr);
    try {
        ctx.save();
        ctx.translate(PIC_W / 2, PIC_H * 0.565);
        drawPlantArt(key, 0, 0, PIC_SCALE, 0);
        ctx.restore();
    } catch (e) { /* a blank packet is better than a broken tray */ }
    ctx = real;
    return c;
}

function renderPackets() {
    const box = el('packets');
    box.innerHTML = '';
    PLANT_ORDER.forEach(key => {
        const T = PLANT_TYPES[key];
        const d = document.createElement('div');
        d.className = 'packet';
        d.dataset.key = key;
        d.innerHTML =
            '<div class="gl" style="background:linear-gradient(180deg,' + T.color + ',' + T.dark + ')"></div>' +
            '<div class="ct">☀ ' + T.cost + '</div>' +
            '<div class="cd"></div>';
        d.querySelector('.gl').appendChild(plantIconCanvas(key));
        d.title = T.name + ' · ' + T.cost + ' 阳光 · 冷却 ' + T.cd + 's · ' + T.desc;
        d.addEventListener('click', () => selectPacket(key));
        box.appendChild(d);
    });
}

function renderPlantList() {
    const box = el('plantList');
    box.innerHTML = '';
    PLANT_ORDER.forEach(key => {
        const T = PLANT_TYPES[key];
        const d = document.createElement('div');
        d.className = 'prow';
        d.innerHTML =
            '<div class="gl" style="background:linear-gradient(180deg,' + T.color + ',' + T.dark + ')">' + T.glyph + '</div>' +
            '<div><div class="nm">' + T.name + '</div><div class="ds">' + T.desc + '</div></div>' +
            '<div class="ct">☀' + T.cost + '</div>';
        box.appendChild(d);
    });
}

function renderTowerList() {
    const box = el('towerList');
    if (!COMBO || !box) return;
    box.innerHTML = '';
    TOWER_ORDER.forEach(key => {
        const T = TOWER_TYPES[key];
        const d = document.createElement('div');
        d.className = 'prow tcard';
        d.dataset.key = key;
        d.innerHTML =
            '<div class="gl" style="background:linear-gradient(180deg,' + T.color + ',' + T.roof + ')">' + T.glyph + '</div>' +
            '<div><div class="nm">' + T.name + ' <span class="lv">可升 3 级</span></div><div class="ds">' + T.desc + '</div></div>' +
            '<div class="ct">🪙' + T.cost + '</div>';
        d.title = T.name + ' · ' + T.cost + ' 银两 · 射程 ' + T.range + ' · ' + T.desc;
        d.addEventListener('click', () => selectTowerType(key));
        box.appendChild(d);
    });
}

function renderFusionList() {
    const box = el('fusionList');
    if (!box) return;
    box.innerHTML = '';
    for (const key of Object.keys(FUSIONS)) {
        const parts = key.split('+');
        const A = PLANT_TYPES[parts[0]], B = PLANT_TYPES[parts[1]];
        const H = PLANT_TYPES[FUSIONS[key]];
        if (!A || !B || !H) continue;
        const row = document.createElement('div');
        row.className = 'frow';
        row.title = A.name + ' + ' + B.name + ' → ' + H.name + ' · ' + H.desc;
        row.innerHTML =
            '<i style="background:linear-gradient(180deg,' + A.color + ',' + A.dark + ')">' + A.glyph + '</i>' +
            '<i style="background:linear-gradient(180deg,' + B.color + ',' + B.dark + ')">' + B.glyph + '</i>' +
            '<span class="ar">＝</span>' +
            '<span class="rs">' + H.name + '</span>';
        box.appendChild(row);
    }
}

function selectPacket(key) {
    Sfx.unlock();
    if (state.phase === 'over' || state.phase === 'won') return;
    if (buildType === key) buildType = null;
    else {
        const T = PLANT_TYPES[key];
        if ((state.cooldowns[key] || 0) > 0) { toast(T.name + ' 还在冷却中', true); return; }
        if (state.sun < T.cost) { toast('阳光不足，需要 ' + T.cost + ' ☀', true); return; }
        buildType = key;
        shovelMode = false;
    }
    selected = null;
    towerSel = null;
    if (COMBO) towerType = null;
    syncSelectionUI();
    renderSelectedPanel();
}

function syncSelectionUI() {
    for (const n of el('packets').children) n.classList.toggle('sel', n.dataset.key === buildType);
    el('shovel').classList.toggle('sel', shovelMode);
    if (COMBO) for (const n of el('towerList').children) n.classList.toggle('sel', n.dataset.key === towerType);
}

function cancelSelection() {
    buildType = null;
    shovelMode = false;
    towerType = null;
    syncSelectionUI();
}

// 清掉草坪上的选中状态（植物和炮塔共用）
function clearSelection() {
    selected = null;
    towerSel = null;
}

function updatePackets() {
    for (const n of el('packets').children) {
        const key = n.dataset.key;
        const T = PLANT_TYPES[key];
        const cd = state.cooldowns[key] || 0;
        n.classList.toggle('poor', state.sun < T.cost);
        n.classList.toggle('cool', cd > 0);
        n.querySelector('.cd').style.height = (cd > 0 ? clamp(cd / T.cd, 0, 1) * 100 : 0) + '%';
    }
    if (COMBO) {
        for (const n of el('towerList').children) {
            const T = TOWER_TYPES[n.dataset.key];
            if (T) n.classList.toggle('poor', state.gold < T.cost);
        }
    }
    el('startWave').disabled = state.phase !== 'prep';
}

function renderWavePanel() {
    const nextIdx = state.phase === 'running' ? state.wave - 1 : state.wave;
    const preview = el('wavePreview');
    if (preview.dataset.wave !== String(nextIdx)) {
        preview.dataset.wave = String(nextIdx);
        preview.innerHTML = '';
        const data = waves[nextIdx];
        if (data) {
            const counts = {};
            for (const e of data.list) counts[e.kind] = (counts[e.kind] || 0) + 1;
            for (const kind of Object.keys(counts)) {
                const T = ZOMBIE_TYPES[kind];
                const chip = document.createElement('div');
                chip.className = 'chip';
                chip.innerHTML = '<i style="background:' + T.edge + '">' + T.glyph + '</i>' + T.name + ' ×' + counts[kind];
                preview.appendChild(chip);
            }
        }
    }
    const btn = el('startWave');
    if (state.phase === 'prep') {
        const n = state.wave + 1;
        btn.textContent = state.betweenTimer != null
            ? '马上开始第 ' + n + ' 波 · ' + Math.ceil(state.betweenTimer) + 's'
            : '开始第 ' + n + ' 波';
    } else if (state.phase === 'running') {
        btn.textContent = '第 ' + state.wave + ' 波进行中…';
    } else {
        btn.textContent = state.phase === 'won' ? '全部波次已清除' : '草坪失守';
    }
}

function renderSelectedPanel() {
    const box = el('selBox');
    if (COMBO && towerSel) { renderTowerPanel(); return; }
    if (!selected || !selected.alive) { box.style.display = 'none'; return; }
    const T = PLANT_TYPES[selected.type];
    box.style.display = '';
    if (COMBO) {
        el('selKv1').textContent = '生命值';
        el('selKv2').textContent = '攻击力';
        el('selKv3').textContent = '射速';
        el('rowPlantActions').style.display = 'flex';
        el('rowTowerActions').style.display = 'none';
    }
    el('selName').textContent = T.name;
    el('selHp').textContent = Math.max(0, Math.ceil(selected.hp)) + ' / ' + selected.maxHp;
    el('selDmg').textContent = T.dmg ? T.dmg : '—';
    el('selRate').textContent = T.rate ? (T.rate).toFixed(2) + ' /s' : '—';
    const extraRow = el('selExtraRow');
    if (T.sunEvery) { extraRow.style.display = ''; el('selExtraKey').textContent = '产阳光'; el('selExtraVal').textContent = '+' + (T.sunValue || 25) + ' / ' + T.sunEvery + 's'; }
    else if (T.bomb) {
        extraRow.style.display = '';
        el('selExtraKey').textContent = MINE_BOMBS[T.bomb] ? '状态' : '引信';
        el('selExtraVal').textContent = MINE_BOMBS[T.bomb]
            ? (selected.armed ? '已就绪 · 等僵尸来' : Math.max(0, selected.fuse).toFixed(1) + 's 后埋伏完成')
            : Math.max(0, selected.fuse).toFixed(1) + 's';
    }
    else if (T.spikeDps) { extraRow.style.display = ''; el('selExtraKey').textContent = '踩踏伤害'; el('selExtraVal').textContent = T.spikeDps + ' /s'; }
    else if (T.stripEvery) { extraRow.style.display = ''; el('selExtraKey').textContent = '吸甲'; el('selExtraVal').textContent = '-' + T.strip + ' / ' + T.stripEvery + 's'; }
    else if (T.auraSlow) { extraRow.style.display = ''; el('selExtraKey').textContent = '寒气减速'; el('selExtraVal').textContent = '×' + T.auraSlow + ' · 范围 ' + T.auraRange; }
    else if (T.shockEvery) { extraRow.style.display = ''; el('selExtraKey').textContent = '冲击波'; el('selExtraVal').textContent = T.shockDmg + ' / ' + T.shockEvery + 's'; }
    else if (T.pushEvery) { extraRow.style.display = ''; el('selExtraKey').textContent = '击退'; el('selExtraVal').textContent = '-' + T.pushPx + ' / ' + T.pushEvery + 's'; }
    else if (T.retaliate) { extraRow.style.display = ''; el('selExtraKey').textContent = '反伤'; el('selExtraVal').textContent = T.retaliate + ' /s'; }
    else if (T.heal) { extraRow.style.display = ''; el('selExtraKey').textContent = '治疗'; el('selExtraVal').textContent = '+' + T.heal + ' / ' + T.healEvery + 's'; }
    else if (T.slow) { extraRow.style.display = ''; el('selExtraKey').textContent = '减速'; el('selExtraVal').textContent = '×' + T.slow; }
    else if (T.rows === 3) { extraRow.style.display = ''; el('selExtraKey').textContent = '攻击线路'; el('selExtraVal').textContent = '3 条'; }
    else extraRow.style.display = 'none';
}

// 组合模式：选中炮塔时换成炮塔的面板
function renderTowerPanel() {
    const box = el('selBox');
    const tw = towerSel;
    if (!COMBO || !tw) { box.style.display = 'none'; return; }
    const T = TOWER_TYPES[tw.type];
    box.style.display = '';
    el('selName').textContent = T.name + ' · Lv.' + tw.level;
    el('selKv1').textContent = '等级';
    el('selHp').textContent = tw.level + ' / ' + TOWER_MAX_LEVEL;
    el('selKv2').textContent = '攻击力';
    el('selDmg').textContent = tw.stats.damage;
    el('selKv3').textContent = '射程';
    el('selRate').textContent = tw.stats.range;

    const extraRow = el('selExtraRow');
    extraRow.style.display = '';
    el('selExtraKey').textContent = '射速 · 特效';
    const bits = [tw.stats.rate.toFixed(2) + ' /s'];
    if (tw.stats.splash) bits.push('溅射 ' + tw.stats.splash);
    if (tw.stats.slow) bits.push('减速 ×' + tw.stats.slow.toFixed(2));
    if (tw.stats.chain) bits.push('连锁 ' + tw.stats.chain);
    el('selExtraVal').textContent = bits.join(' · ');

    el('rowPlantActions').style.display = 'none';
    el('rowTowerActions').style.display = 'flex';
    const up = el('btnUpgrade');
    if (tw.level >= TOWER_MAX_LEVEL) {
        up.textContent = '已满级';
        up.disabled = true;
    } else {
        const cost = upgradeCostFor(tw.type, tw.level);
        up.textContent = '升级 · ' + cost + ' 银两';
        up.disabled = state.gold < cost;
    }
    el('btnSell').textContent = '拆除 · +' + sellValueFor(tw) + ' 银两';
}

// ------------------------------- Persistence -----------------------------
const SAVE_KEY = COMBO ? 'comb_save_v1' : 'pvz3_save_v1';
const PREFS_KEY = COMBO ? 'comb_prefs_v1' : 'pvz3_prefs_v1';
const SAVE_VERSION = 1;

const Store = (() => {
    let ok = null;
    function test() {
        if (ok === null) {
            try {
                window.localStorage.setItem('__pvz3_probe__', '1');
                window.localStorage.removeItem('__pvz3_probe__');
                ok = true;
            } catch (e) { ok = false; }
        }
        return ok;
    }
    return {
        get available() { return test(); },
        read(key) {
            if (!test()) return null;
            try { return window.localStorage.getItem(key); } catch (e) { return null; }
        },
        write(key, value) {
            if (!test()) return false;
            try { window.localStorage.setItem(key, value); return true; } catch (e) { return false; }
        },
        remove(key) {
            if (!test()) return;
            try { window.localStorage.removeItem(key); } catch (e) { /* ignore */ }
        }
    };
})();

function savePrefs() {
    Store.write(PREFS_KEY, JSON.stringify({
        speed: state.speed, muted: Sfx.muted, waves: totalWaves
    }));
}

function applyPrefs() {
    const raw = Store.read(PREFS_KEY);
    if (raw) {
        try {
            const p = JSON.parse(raw);
            if (p && p.speed >= 1 && p.speed <= 3) state.speed = p.speed;
            if (p && typeof p.muted === 'boolean') Sfx.setMuted(p.muted);
            if (p && typeof p.waves === 'number') totalWaves = clampWaveTotal(p.waves);
        } catch (e) { /* ignore corrupt prefs */ }
    }
    for (const btn of el('speedGroup').children) {
        btn.classList.toggle('on', Number(btn.dataset.speed) === state.speed);
    }
    el('btnMute').textContent = Sfx.muted ? '🔇 静音' : '🔊 音效';
    updateRabbitButton();
    syncWaveTotal();
}

function serializeGame() {
    return {
        v: SAVE_VERSION,
        at: Date.now(),
        sun: state.sun,
        wave: state.wave,
        t: state.t,
        phase: state.phase === 'running' ? 'running' : 'prep',
        betweenTimer: state.betweenTimer,
        spawnTimer: state.spawnTimer,
        waveTotal: state.waveTotal,
        skySunTimer: state.skySunTimer,
        bossSpawnTimer: state.bossSpawnTimer,
        speed: state.speed,
        waves: totalWaves,
        rabbit: state.rabbit,
        cooldowns: state.cooldowns,
        spawnQueue: state.spawnQueue.map(s => ({ k: s.kind, t: s.t, h: s.hpMul })),
        plants: plants.filter(p => p.alive).map(p => ({
            k: p.type, c: p.c, r: p.r, h: Math.round(p.hp), m: p.maxHp,
            st: p.sunTimer, ht: p.healTimer, cl: p.cool, fu: p.fuse, ar: p.armed,
            mt: p.stripTimer, qt: p.shockTimer, pt: p.pushTimer
        })),
        zombies: zombies.filter(z => z.alive).map(z => ({
            k: z.kind, r: z.r, x: Math.round(z.x), h: Math.round(z.hp), m: Math.round(z.maxHp),
            a: Math.round(z.armor), am: Math.round(z.maxArmor), sl: z.slowT, sf: z.slowF,
            ht: z.healTimer, dt: z.dashTimer, df: z.dashFor,
            st: z.spitTimer, kt: z.stealTimer, vf: z.vaultFor, vd: z.vaulted
        })),
        suns: suns.map(s => ({ x: s.x, y: s.y, ty: s.ty, v: s.value, l: s.life, b: s.born, s: s.fromSky })),
        mowers: mowers.map(m => ({ r: m.r, x: Math.round(m.x), s: m.state })),
        gold: state.gold,
        wall: state.wall,
        towers: towers.map(t => ({ k: t.type, lv: t.level, c: t.c, r: t.r }))
    };
}

function validSave(d) {
    return d && d.v === SAVE_VERSION && typeof d.sun === 'number' &&
        typeof d.wave === 'number' && d.wave <= clampWaveTotal(d.waves) &&
        Array.isArray(d.plants) && Array.isArray(d.zombies) &&
        Array.isArray(d.mowers) && d.mowers.length === ROWS &&
        (!COMBO || Array.isArray(d.towers));
}

function restoreGame(d) {
    resetState();
    totalWaves = clampWaveTotal(d.waves);
    buildWaves();
    syncWaveTotal();
    state.sun = d.sun;
    state.wave = d.wave;
    state.t = d.t || 0;
    state.phase = d.phase === 'running' ? 'running' : 'prep';
    state.betweenTimer = typeof d.betweenTimer === 'number' ? d.betweenTimer : null;
    state.spawnTimer = d.spawnTimer || 0;
    state.waveTotal = d.waveTotal || 0;
    state.skySunTimer = typeof d.skySunTimer === 'number' ? d.skySunTimer : 7;
    state.bossSpawnTimer = typeof d.bossSpawnTimer === 'number' ? d.bossSpawnTimer : 8;
    state.cooldowns = d.cooldowns || {};
    state.rabbit = !!d.rabbit;
    if (state.rabbit) spawnRabbit();
    state.spawnQueue = (d.spawnQueue || []).map(s => ({ kind: s.k, t: s.t, hpMul: s.h }));

    for (const p of d.plants) {
        const T = PLANT_TYPES[p.k];
        if (!T) continue;
        plants.push({
            type: p.k, c: p.c, r: p.r, alive: true,
            x: cellCX(p.c), y: cellCY(p.r),
            hp: p.h, maxHp: p.m || T.hp,
            cool: p.cl || 0,
            sunTimer: typeof p.st === 'number' ? p.st : (T.sunEvery || 0),
            healTimer: typeof p.ht === 'number' ? p.ht : (T.healEvery || 0),
            fuse: typeof p.fu === 'number' ? p.fu : (MINE_BOMBS[T.bomb] ? 14 : (T.bomb ? 1.6 : 0)),
            armed: p.ar !== false,
            stripTimer: typeof p.mt === 'number' ? p.mt : (T.stripEvery || 0),
            shockTimer: typeof p.qt === 'number' ? p.qt : (T.shockEvery || 0),
            pushTimer: typeof p.pt === 'number' ? p.pt : (T.pushEvery || 0),
            grow: 1, hurtT: 0, anim: Math.random() * 6.28
        });
    }
    for (const z of d.zombies) {
        const T = ZOMBIE_TYPES[z.k];
        if (!T) continue;
        zombies.push({
            kind: z.k, r: z.r, x: z.x, y: cellCY(z.r),
            hp: z.h, maxHp: z.m, armor: z.a, maxArmor: z.am,
            speed: T.speed, slowT: z.sl || 0, slowF: z.sf || 1,
            healTimer: typeof z.ht === 'number' ? z.ht : (T.healEvery ? T.healEvery * 0.5 : 0),
            dashTimer: typeof z.dt === 'number' ? z.dt : (T.dashEvery ? T.dashEvery * 0.5 : 0),
            dashFor: typeof z.df === 'number' ? z.df : 0,
            spitTimer: typeof z.st === 'number' ? z.st : (T.spitEvery ? T.spitEvery * 0.5 : 0),
            stealTimer: typeof z.kt === 'number' ? z.kt : (T.stealEvery ? T.stealEvery * 0.5 : 0),
            vaultFor: typeof z.vf === 'number' ? z.vf : 0,
            vaulted: !!z.vd,
            alive: true, eating: null, walkPhase: Math.random() * 6.28,
            biteTimer: 0, hurtT: 0, spendT: 0
        });
    }
    for (const s of (d.suns || [])) {
        suns.push({ x: s.x, y: s.y, ty: s.ty, vy: 42, value: s.v, life: s.l, born: s.b || 0, taken: false, fromSky: !!s.s });
    }
    mowers = d.mowers.map(m => ({ r: m.r, x: m.x, state: m.s }));

    if (COMBO) {
        state.gold = typeof d.gold === 'number' ? d.gold : START_GOLD;
        state.wall = typeof d.wall === 'number' ? d.wall : START_WALL;
        towers = (d.towers || [])
            .filter(t => TOWER_TYPES[t.k] && t.lv >= 1 && t.lv <= TOWER_MAX_LEVEL && inLawn(t.c, t.r))
            .map(t => ({
                type: t.k, level: t.lv, c: t.c, r: t.r,
                x: cellCX(t.c), y: cellCY(t.r),
                stats: statsFor(t.k, t.lv), cd: 0, aim: Math.PI
            }));
    }

    state.paused = false;
    el('btnPause').textContent = '暂停';
    updateHud();
    renderWavePanel();
    renderSelectedPanel();
}

function saveGame(quiet) {
    if (state.phase === 'over' || state.phase === 'won') return;
    const ok = Store.write(SAVE_KEY, JSON.stringify(serializeGame()));
    if (!quiet) toast(ok ? '进度已保存' : '无法写入存档（浏览器限制）', !ok);
}

function scheduleAutoSave() {
    clearTimeout(scheduleAutoSave._t);
    scheduleAutoSave._t = setTimeout(() => saveGame(true), 700);
}

function readSave() {
    const raw = Store.read(SAVE_KEY);
    if (!raw) return null;
    try {
        const d = JSON.parse(raw);
        return validSave(d) ? d : null;
    } catch (e) { return null; }
}

function clearSave() { Store.remove(SAVE_KEY); }

function loadGame() {
    const d = readSave();
    if (!d) { toast('没有找到存档', true); return; }
    Sfx.unlock();
    hideOverlay();
    restoreGame(d);
    buildType = null; shovelMode = false; selected = null; towerSel = null;
    syncSelectionUI();
    toast('已读取存档 · 第 ' + d.wave + ' 波');
}

function newGame() {
    clearSave();
    resetState();
    applyPrefs();
    buildWaves();
    buildType = null; shovelMode = false; selected = null; towerSel = null; towerType = null;
    syncSelectionUI();
    updateHud();
    renderWavePanel();
    renderSelectedPanel();
    banner('先种几株向日葵积攒阳光');
}

// ------------------------------- Input -----------------------------------
function canvasPos(evt) {
    const rect = cv.getBoundingClientRect();
    return {
        x: (evt.clientX - rect.left) * (CANVAS_W / rect.width),
        y: (evt.clientY - rect.top) * (CANVAS_H / rect.height)
    };
}

function tryCollectSun(x, y) {
    let best = null, bestD = 34 * 34;
    for (const s of suns) {
        if (s.taken) continue;
        const d = dist2(s.x, s.y, x, y);
        if (d < bestD) { bestD = d; best = s; }
    }
    if (best) { collectSun(best); return true; }
    return false;
}

function togglePause() {
    if (state.phase === 'over' || state.phase === 'won') return;
    state.paused = !state.paused;
    el('btnPause').textContent = state.paused ? '继续' : '暂停';
}

function wireInput() {
    cv.addEventListener('pointermove', e => {
        const p = canvasPos(e);
        const c = cellOf(p.x, p.y);
        hover = inLawn(c.c, c.r) ? c : { c: -1, r: -1 };
        if (drag) {
            drag.x = p.x;
            drag.y = p.y;
            if (Math.hypot(p.x - drag.sx, p.y - drag.sy) > 10) drag.moved = true;
        }
    });
    cv.addEventListener('pointerleave', () => { hover = { c: -1, r: -1 }; });

    cv.addEventListener('pointerdown', e => {
        Sfx.unlock();
        if (e.button === 2) { cancelSelection(); clearSelection(); renderSelectedPanel(); return; }
        if (state.paused || state.phase === 'over' || state.phase === 'won') return;
        const p = canvasPos(e);
        if (tryCollectSun(p.x, p.y)) return;

        const cell = cellOf(p.x, p.y);
        if (!inLawn(cell.c, cell.r)) {
            cancelSelection();
            clearSelection();
            renderSelectedPanel();
            return;
        }
        const existing = plantAt(cell.c, cell.r);
        const existingTower = COMBO ? towerAt(cell.c, cell.r) : null;

        if (shovelMode) {
            if (existing) { digPlant(existing); renderSelectedPanel(); }
            else toast('这里没有植物', true);
            return;
        }
        if (COMBO && towerType) {
            const key = towerType;
            if (placeTower(key, cell.c, cell.r)) {
                // keep the tower armed while you can still afford another
                if (state.gold < TOWER_TYPES[key].cost) towerType = null;
                syncSelectionUI();
            }
            return;
        }
        if (buildType) {
            const key = buildType;
            if (placePlant(key, cell.c, cell.r)) {
                const T = PLANT_TYPES[key];
                if (state.sun < T.cost || (state.cooldowns[key] || 0) > 0 || !canPlant(cell.c, cell.r)) {
                    buildType = null;
                }
                syncSelectionUI();
            }
            return;
        }
        if (existingTower) {
            towerSel = existingTower;
            selected = null;
            renderSelectedPanel();
            return;
        }
        selected = existing || null;
        towerSel = null;
        renderSelectedPanel();
        // 按住植物拖动 = 把它拖到另一株植物身上融合
        if (existing) drag = { plant: existing, x: p.x, y: p.y, sx: p.x, sy: p.y, moved: false };
    });

    window.addEventListener('pointerup', () => {
        if (!drag) return;
        const d = drag;
        drag = null;
        if (!d.moved || !d.plant.alive) return;
        const cell = cellOf(d.x, d.y);
        if (!inLawn(cell.c, cell.r)) return;
        const target = plantAt(cell.c, cell.r);
        if (target && target !== d.plant) tryFuse(d.plant, target);
    });

    cv.addEventListener('contextmenu', e => {
        e.preventDefault();
        cancelSelection();
        clearSelection();
        renderSelectedPanel();
    });

    window.addEventListener('keydown', e => {
        if (e.key >= '1' && e.key <= '9') {
            const i = Number(e.key) - 1;
            if (i < PLANT_ORDER.length) selectPacket(PLANT_ORDER[i]);
            return;
        }
        if (COMBO) {
            const ti = 'qwer'.indexOf(e.key.toLowerCase());
            if (e.key.length === 1 && ti >= 0) { selectTowerType(TOWER_ORDER[ti]); return; }
        }
        if (e.key === 'Escape') {
            cancelSelection();
            clearSelection();
            renderSelectedPanel();
        } else if (e.key === ' ') {
            e.preventDefault();
            togglePause();
        } else if (e.key === 'n' || e.key === 'N') {
            if (state.phase === 'prep') { Sfx.unlock(); startWave(); }
        }
    });
}

function wireButtons() {
    el('startWave').addEventListener('click', () => {
        Sfx.unlock();
        if (state.phase === 'prep') startWave();
    });
    el('shovel').addEventListener('click', () => {
        Sfx.unlock();
        shovelMode = !shovelMode;
        if (shovelMode) { buildType = null; towerType = null; }
        selected = null;
        towerSel = null;
        syncSelectionUI();
        renderSelectedPanel();
        if (shovelMode) toast('点一下草坪上的植物即可铲除');
    });
    el('btnDig').addEventListener('click', () => {
        if (selected) { digPlant(selected); renderSelectedPanel(); }
    });
    if (COMBO) {
        el('btnUpgrade').addEventListener('click', () => { Sfx.unlock(); upgradeSelectedTower(); });
        el('btnSell').addEventListener('click', () => { Sfx.unlock(); sellSelectedTower(); });
    }
    el('waveTotal').addEventListener('input', () => { el('waveTotalVal').textContent = el('waveTotal').value; });
    el('waveTotal').addEventListener('change', () => setWaveTotal(el('waveTotal').value));
    el('btnPause').addEventListener('click', togglePause);
    el('btnMute').addEventListener('click', () => {
        Sfx.unlock();
        Sfx.setMuted(!Sfx.muted);
        el('btnMute').textContent = Sfx.muted ? '🔇 静音' : '🔊 音效';
        savePrefs();
    });
    el('btnRabbit').addEventListener('click', () => { Sfx.unlock(); buyRabbit(); });
    for (const btn of el('speedGroup').children) {
        btn.addEventListener('click', () => {
            state.speed = Number(btn.dataset.speed);
            for (const b of el('speedGroup').children) b.classList.toggle('on', b === btn);
            savePrefs();
        });
    }
    el('btnSave').addEventListener('click', () => saveGame(false));
    el('btnLoad').addEventListener('click', loadGame);
    el('btnRestart').addEventListener('click', () => {
        if (!el('btnRestart').dataset.armed) {
            el('btnRestart').dataset.armed = '1';
            el('btnRestart').textContent = '确认重开？';
            setTimeout(() => {
                delete el('btnRestart').dataset.armed;
                el('btnRestart').textContent = '重新开始';
            }, 2600);
            return;
        }
        delete el('btnRestart').dataset.armed;
        el('btnRestart').textContent = '重新开始';
        hideOverlay();
        newGame();
        toast('已重新开始');
    });
    el('btnClear').addEventListener('click', () => {
        clearSave();
        toast('存档已清除');
    });
}

// ------------------------------- Main loop -------------------------------
let last = 0;
let uiTimer = 0;

function frame(now) {
    if (!__alive) return;
    if (!last) last = now;
    let dt = (now - last) / 1000;
    last = now;
    if (dt > 0.05) dt = 0.05;
    if (dt < 0) dt = 0;

    if (!state.paused && (state.phase === 'prep' || state.phase === 'running')) {
        for (let i = 0; i < state.speed; i++) update(dt);
    } else {
        state.t += dt;
    }

    uiTimer -= dt;
    if (uiTimer <= 0) {
        uiTimer = 0.2;
        updatePackets();
        updateHud();
        if (state.phase === 'prep' || state.phase === 'running') renderWavePanel();
        if (selected || towerSel) renderSelectedPanel();
        else if (el('selBox').style.display !== 'none') el('selBox').style.display = 'none';
    }

    draw();
    if (__alive) requestAnimationFrame(frame);
}

// ------------------------------- Boot ------------------------------------
function boot() {
    resetState();
    applyPrefs();          // the saved wave count has to be known before waves are built
    buildWaves();
    bg = buildBackground();
    if (COMBO) {
        el('appSeal').textContent = '合';
        el('appTitle').textContent = '组合模式';
        el('appSub').textContent = '长城守卫战 × 植物大战僵尸 3';
    }
    renderPackets();
    renderPlantList();
    renderTowerList();
    renderFusionList();
    wireInput();
    wireButtons();
    syncSelectionUI();
    updateHud();
    renderWavePanel();
    if (auto && readSave()) loadGame(); else showOverlay('start');
    if (__alive) requestAnimationFrame(frame);
}


boot();
return function stop() {
    if (!__alive) return;
    __alive = false;
    try { saveGame(true); } catch (e) { /* nothing worth saving */ }
    window.addEventListener = __nativeAdd;
    window.setTimeout = __nativeTimeout;
    for (const a of __captured) window.removeEventListener(a[0], a[1], a[2]);
    __captured.length = 0;
    for (const id of __timers) window.clearTimeout(id);
    __timers.length = 0;
    root.innerHTML = '';
};
}

window.__GAMES.pvz = function (root, auto) { return createLawnGame(root, auto, false); };
window.__GAMES.comb = function (root, auto) { return createLawnGame(root, auto, true); };

    const zhKeys = Object.keys(DICT).sort((a, b) => b.length - a.length);
    let fragRe = null;
    function fragPattern() {
        if (!fragRe) {
            const escaped = zhKeys.map(k => k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
            fragRe = new RegExp(escaped.join('|'), 'g');
        }
        return fragRe;
    }

    let lang = 'zh';
    try {
        const saved = window.localStorage.getItem(KEY);
        if (saved === 'en' || saved === 'zh') lang = saved;
    } catch (e) { /* storage blocked - Chinese it is */ }

    // Whole string first, then the longest fragments inside it. Whitespace
    // around the node keeps its shape; HTML collapses any doubled space.
    function t(s) {
        if (lang !== 'en' || !s || !CJK.test(s)) return s;
        const m = /^(\s*)([\s\S]*?)(\s*)$/.exec(s);
        const core = m[2];
        if (DICT[core] !== undefined) return m[1] + DICT[core] + m[3];
        const out = core.replace(fragPattern(), k => (DICT[k] !== undefined ? DICT[k] : k));
        return out === core ? s : m[1] + out + m[3];
    }

    // Nodes keep their Chinese original, so a toggle back to 中文 is exact.
    const zhText = new WeakMap();
    const zhAttr = new WeakMap();
    let zhTitle = null;

    function doText(node) {
        const v = node.nodeValue;
        if (lang === 'en') {
            if (!v || !CJK.test(v)) return;
            const en = t(v);
            if (en !== v) { zhText.set(node, v); node.nodeValue = en; }
            return;
        }
        const zh = zhText.get(node);
        if (zh === undefined) return;
        zhText.delete(node);
        // the page wrote fresh Chinese over our English - leave it alone
        if (!CJK.test(v)) node.nodeValue = zh;
    }

    function doAttrs(elm) {
        let saved = zhAttr.get(elm);
        for (const a of ATTRS) {
            const v = elm.getAttribute(a);
            if (v == null) continue;
            if (lang === 'en') {
                if (!CJK.test(v)) continue;
                const en = t(v);
                if (en === v) continue;
                if (!saved) { saved = {}; zhAttr.set(elm, saved); }
                saved[a] = v;
                elm.setAttribute(a, en);
            } else if (saved && saved[a] !== undefined) {
                // the page rewrote it in Chinese over our English - leave it be
                if (!CJK.test(v)) elm.setAttribute(a, saved[a]);
                delete saved[a];
            }
        }
    }

    function walk(node) {
        for (let n = node.firstChild; n; n = n.nextSibling) {
            if (n.nodeType === 3) { doText(n); continue; }
            if (n.nodeType !== 1) continue;
            if (SKIP_TAG[n.tagName] || n.hasAttribute('data-lang-toggle')) continue;
            doAttrs(n);
            walk(n);
        }
    }

    function doTitle() {
        if (lang === 'en') {
            const v = document.title;
            if (!CJK.test(v)) return;
            const en = t(v);
            if (en !== v) { zhTitle = v; document.title = en; }
        } else if (zhTitle !== null && document.title !== zhTitle) {
            document.title = zhTitle;
            zhTitle = null;
        }
    }

    function label() {
        for (const b of document.querySelectorAll('[data-lang-toggle]')) {
            b.textContent = lang === 'en' ? '中' : 'EN';
            const hint = lang === 'en' ? '切换到中文 · Switch to Chinese' : 'Switch to English · 切换语言';
            b.setAttribute('title', hint);
            b.setAttribute('aria-label', hint);
        }
    }

    function apply() {
        label();
        doTitle();
        walk(document.body);
    }

    function set(next) {
        lang = next === 'en' ? 'en' : 'zh';
        try { window.localStorage.setItem(KEY, lang); } catch (e) { /* storage blocked */ }
        apply();
    }

    document.addEventListener('click', e => {
        const btn = e.target && e.target.closest ? e.target.closest('[data-lang-toggle]') : null;
        if (!btn) return;
        e.preventDefault();
        set(lang === 'en' ? 'zh' : 'en');
    });

    // The games rebuild their own DOM on a timer, so keep sweeping the page.
    // Text that is already English has no CJK left in it and costs one test.
    function tick() {
        apply();
        window.requestAnimationFrame(tick);
    }
    window.requestAnimationFrame(tick);

    return {
        get lang() { return lang; },
        t,
        set,
        apply
    };
})();

<script>

(() => {
'use strict';

const SAVE_KEYS = { gwd: 'gwd_save_v1', pvz: 'pvz3_save_v1', comb: 'comb_save_v1' };
const TITLES = {
    gwd: '长城守卫战 · Great Wall Defense',
    pvz: '植物大战僵尸 3 · Plants vs. Zombies 3',
    comb: '组合模式 · Wall × Lawn'
};
const HOME_TITLE = 'Andrew 的游戏合集 · Game Collection';

const picker = document.getElementById('picker');
const viewport = document.getElementById('viewport');
const switchBtn = document.getElementById('switchBtn');
let stopFn = null;

function readSave(key) {
    try {
        const raw = window.localStorage.getItem(key);
        return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
}

function setSaveText(key, text) {
    const node = document.querySelector('[data-save="' + key + '"]');
    if (node) node.textContent = text;
}

function refreshSaves() {
    const g = readSave(SAVE_KEYS.gwd);
    const p = readSave(SAVE_KEYS.pvz);
    const c = readSave(SAVE_KEYS.comb);
    setSaveText('gwd', g
        ? '存档 · 第 ' + g.wave + ' / ' + (g.waves || 20) + ' 波 · 银两 ' + g.gold + ' · 城墙 ' + g.life
        : '暂无存档');
    setSaveText('pvz', p
        ? '存档 · 第 ' + p.wave + ' / ' + (p.waves || 20) + ' 波 · 阳光 ' + Math.floor(p.sun) + ' · 割草机 ' +
          (p.mowers || []).filter(m => m.s === 'idle').length
        : '暂无存档');
    setSaveText('comb', c
        ? '存档 · 第 ' + c.wave + ' / ' + (c.waves || 20) + ' 波 · 阳光 ' + Math.floor(c.sun) + ' · 银两 ' + (c.gold || 0) +
          ' · 城墙 ' + (c.wall != null ? c.wall : '-')
        : '暂无存档');
}

function unmount() {
    if (stopFn) {
        try { stopFn(); } catch (e) { /* already torn down */ }
        stopFn = null;
    }
    viewport.classList.remove('comb');
    viewport.innerHTML = '';
}

function mount(mode) {
    // combined mode reuses the lawn template, plus the tower pieces it adds
    const tpl = document.getElementById(mode === 'comb' ? 'tpl-pvz' : 'tpl-' + mode);
    if (!tpl || !window.__GAMES[mode]) return;
    unmount();
    viewport.appendChild(tpl.content.cloneNode(true));
    if (mode === 'comb') viewport.classList.add('comb');
    stopFn = window.__GAMES[mode](viewport, true);
    picker.hidden = true;
    switchBtn.hidden = false;
    document.title = TITLES[mode];
}

function showPicker() {
    unmount();
    refreshSaves();
    picker.hidden = false;
    switchBtn.hidden = true;
    document.title = HOME_TITLE;
}

for (const card of document.querySelectorAll('.pk-card')) {
    card.addEventListener('click', () => mount(card.dataset.mode));
}
switchBtn.addEventListener('click', showPicker);

// The cards must always mirror the saves on disk, not the state when the page
// was opened. Refresh them whenever something outside the picker could have
// changed a save: another tab wrote or cleared one, or the page came back from
// the back/forward cache or from a background tab.
const SAVE_KEY_LIST = Object.keys(SAVE_KEYS).map(k => SAVE_KEYS[k]);
function isGameSaveKey(key) { return key === null || SAVE_KEY_LIST.indexOf(key) >= 0; }
window.addEventListener('storage', e => { if (isGameSaveKey(e.key)) refreshSaves(); });
window.addEventListener('pageshow', refreshSaves);
document.addEventListener('visibilitychange', () => { if (!document.hidden) refreshSaves(); });
// Slow safety net for anything the events above miss (e.g. storage cleared from
// outside the page): cheap, and only ticks while the picker is what you see.
setInterval(() => { if (!picker.hidden) refreshSaves(); }, 2000);

refreshSaves();
})();

</script>

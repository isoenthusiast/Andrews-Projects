<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Andrew 的游戏合集 · Game Collection</title>
<style>

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        font-family: 'Segoe UI', system-ui, -apple-system, 'Microsoft YaHei', sans-serif;
        min-height: 100vh;
        color: #f0ead6;
        background: radial-gradient(circle at 50% 0%, #23303c 0%, #0f151b 55%, #05080b 100%);
    }

    /* the mounted game drops straight into the page flow */
    #viewport { display: contents; }

    #picker {
        position: fixed; inset: 0; z-index: 5;
        display: grid; place-items: center;
        padding: 26px;
        overflow: auto;
    }
    #picker[hidden] { display: none; }

    .pk { margin: auto; width: 100%; max-width: 900px; text-align: center; }
    .pk h1 {
        font-size: 2rem; letter-spacing: 4px; font-weight: 700;
        background: linear-gradient(90deg, #dff7a8, #a6d84a, #5f9b28);
        -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    }
    .pk-sub { font-size: 0.7rem; letter-spacing: 1.8px; text-transform: uppercase; color: #8b9a7a; margin: 8px 0 26px; }
    .pk-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 18px; }

    .pk-card {
        display: flex; flex-direction: column; align-items: center; gap: 7px;
        padding: 26px 22px 22px;
        border-radius: 18px;
        text-align: center;
        cursor: pointer;
        color: #f0ead6;
        background: linear-gradient(180deg, rgba(38,50,32,0.95), rgba(15,21,12,0.95));
        border: 1px solid rgba(166,216,74,0.3);
        box-shadow: 0 16px 40px rgba(0,0,0,0.55);
        transition: transform .12s ease, border-color .2s ease, box-shadow .2s ease;
    }
    .pk-card:hover { transform: translateY(-4px); border-color: #a6d84a; box-shadow: 0 20px 48px rgba(0,0,0,0.6), 0 0 26px rgba(166,216,74,0.25); }
    .pk-card:active { transform: translateY(-1px); }

    .pk-seal {
        width: 62px; height: 62px;
        display: grid; place-items: center;
        font-size: 1.7rem; font-weight: 700;
        color: #fff8ea;
        text-shadow: 0 1px 3px rgba(0,0,0,0.6);
    }
    .seal-gwd { border-radius: 14px; background: linear-gradient(145deg, #c0392b, #7d1f18); border: 2px solid #e8c169; box-shadow: 0 0 20px rgba(192,57,43,0.45); }
    .seal-pvz { border-radius: 50%; background: linear-gradient(145deg, #4e9440, #245c23); border: 2px solid #a6d84a; box-shadow: 0 0 20px rgba(120,200,80,0.45); }
    .seal-comb { border-radius: 16px; background: linear-gradient(145deg, #b7950b, #5d4416); border: 2px solid #e8c169; box-shadow: 0 0 20px rgba(232,193,105,0.45); }

    .pk-name { font-size: 1.25rem; font-weight: 700; letter-spacing: 2px; }
    .pk-en { font-size: 0.64rem; letter-spacing: 1.6px; text-transform: uppercase; color: #8b9a7a; }
    .pk-desc { font-size: 0.8rem; color: #c9d3b8; line-height: 1.65; margin-top: 5px; }
    .pk-save {
        font-size: 0.72rem; color: #dcf3ac;
        background: rgba(0,0,0,0.35);
        border: 1px solid rgba(166,216,74,0.25);
        border-radius: 999px;
        padding: 5px 13px;
        margin-top: 5px;
        font-variant-numeric: tabular-nums;
    }
    .pk-go {
        margin-top: 12px;
        font-size: 0.85rem; font-weight: 700; letter-spacing: 1px;
        color: #17280d;
        background: linear-gradient(180deg, #cfef94, #8dbd43);
        border-radius: 10px;
        padding: 9px 20px;
        box-shadow: 0 4px 0 #4b6b1f;
    }
    .pk-foot { margin-top: 24px; font-size: 0.68rem; color: #6f7b60; line-height: 1.7; }
    .pk-foot b { color: #a6d84a; }

    /* ---- 组合模式 · combined mode: pieces that only apply there ---- */
    /* hidden unless the mounted game asked for combined mode */
    #viewport .comb-only { display: none !important; }
    #viewport.comb .comb-only.stat { display: flex !important; }
    #viewport.comb .comb-only.box { display: block !important; }

    #viewport .prow.tcard { cursor: pointer; transition: background .15s ease, border-color .15s ease; }
    #viewport .prow.tcard:hover { background: rgba(232,193,105,0.12); border-color: rgba(232,193,105,0.45); }
    #viewport .prow.tcard.sel { background: rgba(232,193,105,0.18); border-color: #e8c169; box-shadow: 0 0 0 2px rgba(232,193,105,0.5); }
    #viewport .prow.tcard.poor { filter: grayscale(.7) brightness(.82); }
    #viewport .prow.tcard .lv { font-size: 0.62rem; color: #93a37f; }
    #viewport.comb .stat.gold b { color: #f2cf7a; }
    #viewport.comb .stat.wall b { color: #e8c169; }

    #switchBtn {
        position: fixed; right: 16px; bottom: 16px; z-index: 20;
        padding: 11px 17px;
        border-radius: 999px;
        font-family: inherit; font-size: 13px; font-weight: 700; letter-spacing: .4px;
        cursor: pointer;
        color: #17280d;
        background: linear-gradient(180deg, #cfef94, #8dbd43);
        border: 1px solid rgba(240,255,220,0.6);
        box-shadow: 0 8px 22px rgba(0,0,0,0.5);
    }
    #switchBtn:hover { filter: brightness(1.08); }
    #switchBtn[hidden] { display: none; }

    /* EN / 中 toggle: fixed on the title screen, a chip inside the HUD row in game */
    .lang-toggle {
        padding: 8px 13px;
        border-radius: 999px;
        font-family: inherit; font-size: 12px; font-weight: 700; letter-spacing: .6px;
        cursor: pointer;
        color: #eaf5d8;
        background: rgba(12,20,10,0.82);
        border: 1px solid rgba(166,216,74,0.45);
        box-shadow: 0 6px 18px rgba(0,0,0,0.45);
    }
    .lang-toggle:hover { filter: brightness(1.15); }
    #picker .lang-toggle { position: fixed; top: 16px; right: 18px; z-index: 30; }

</style>
</head>
<body>
<div id="viewport"></div>
<button id="switchBtn" hidden>☰ 切换游戏</button>

<div id="picker">
    <button class="lang-toggle" data-lang-toggle title="Switch language · 切换语言">EN</button>
    <div class="pk">
        <h1>Andrew 的游戏合集</h1>
        <p class="pk-sub">Three games · one page · 一个入口</p>
        <div class="pk-grid">
            <button class="pk-card" data-mode="gwd">
                <span class="pk-seal seal-gwd">守</span>
                <span class="pk-name">长城守卫战</span>
                <span class="pk-en">Great Wall Defense</span>
                <span class="pk-desc">在古道两旁修筑宝塔，挡住一波波蛮族大军。波数自选 20–100，箭塔、火炮、寒冰与雷龙四种炮塔，每 10 波一场首领战。</span>
                <span class="pk-save" data-save="gwd">暂无存档</span>
                <span class="pk-go">开始游戏 →</span>
            </button>
            <button class="pk-card" data-mode="pvz">
                <span class="pk-seal seal-pvz">植</span>
                <span class="pk-name">植物大战僵尸 3</span>
                <span class="pk-en">Plants vs. Zombies 3</span>
                <span class="pk-desc">经典 5×9 草坪：种向日葵收阳光，用豌豆、坚果、樱桃炸弹守住僵尸潮。波数自选 20–100，割草机兜底。</span>
                <span class="pk-save" data-save="pvz">暂无存档</span>
                <span class="pk-go">开始游戏 →</span>
            </button>
            <button class="pk-card" data-mode="comb">
                <span class="pk-seal seal-comb">合</span>
                <span class="pk-name">组合模式</span>
                <span class="pk-en">Combined · Wall × Lawn</span>
                <span class="pk-desc">同一片战场上同时种植物与修宝塔：阳光买植物、银两买炮塔，两套防御一起挡住蛮族与僵尸的联军。波数自选 20–100。</span>
                <span class="pk-save" data-save="comb">暂无存档</span>
                <span class="pk-go">开始游戏 →</span>
            </button>
        </div>
        <p class="pk-foot">游戏内点击右下角 <b>☰ 切换游戏</b> 可随时回到这里 · 三款游戏各自保存进度</p>
    </div>
</div>

<template id="tpl-gwd">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
        --gold: #e8c169;
        --gold-dim: #a8873c;
        --red: #a8322b;
        --red-dark: #6d1f1a;
        --ink: #1a1310;
        --cream: #f2e6cd;
        --wood: #241611;
    }

    body {
        font-family: 'Segoe UI', system-ui, -apple-system, 'Microsoft YaHei', sans-serif;
        min-height: 100vh;
        color: var(--cream);
        background:
            radial-gradient(circle at 50% 0%, #3a231c 0%, #1a100c 55%, #0d0806 100%);
        padding: 18px;
        display: flex;
        justify-content: center;
    }

    .app { width: 100%; max-width: 1360px; }

    /* ---------------- Top bar ---------------- */
    .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        flex-wrap: wrap;
        padding: 12px 20px;
        margin-bottom: 14px;
        border-radius: 14px;
        background: linear-gradient(180deg, rgba(58,32,24,0.95), rgba(30,17,13,0.95));
        border: 1px solid rgba(232,193,105,0.35);
        box-shadow: 0 10px 30px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.06);
    }

    .title { display: flex; align-items: center; gap: 14px; }

    .seal {
        width: 48px; height: 48px;
        display: grid; place-items: center;
        font-size: 1.6rem;
        font-weight: 700;
        color: #fff4dd;
        background: linear-gradient(145deg, #c0392b, #7d1f18);
        border: 2px solid var(--gold);
        border-radius: 8px;
        text-shadow: 0 1px 2px rgba(0,0,0,0.6);
        box-shadow: 0 0 18px rgba(192,57,43,0.5);
    }

    h1 {
        font-size: 1.5rem;
        letter-spacing: 4px;
        font-weight: 700;
        background: linear-gradient(90deg, #f4d68d, #e8c169, #b8892f);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
    }

    .title p { font-size: 0.72rem; letter-spacing: 1.4px; color: #9b8672; text-transform: uppercase; margin-top: 2px; }

    .stats { display: flex; gap: 10px; flex-wrap: wrap; }

    .stat {
        display: flex; align-items: center; gap: 8px;
        padding: 7px 14px;
        border-radius: 10px;
        background: rgba(0,0,0,0.35);
        border: 1px solid rgba(232,193,105,0.22);
        min-width: 108px;
    }

    .stat .ico { font-size: 1.05rem; }
    .stat b { font-size: 1.15rem; font-variant-numeric: tabular-nums; }
    .stat small { display: block; font-size: 0.6rem; color: #9b8672; letter-spacing: 1px; }
    .stat.gold b { color: #f2cf7a; }
    .stat.life b { color: #e88b7f; }
    .stat.wave b { color: #a8c8e8; }
    .stat.flash { animation: flashStat 0.4s ease; }
    @keyframes flashStat { 0% { background: rgba(232,193,105,0.45); } 100% { background: rgba(0,0,0,0.35); } }

    /* ---------------- Layout ---------------- */
    main { display: flex; gap: 14px; align-items: flex-start; }

    .stage {
        position: relative;
        flex: 1 1 auto;
        min-width: 0;
        border-radius: 16px;
        overflow: hidden;
        border: 1px solid rgba(232,193,105,0.35);
        box-shadow: 0 22px 60px rgba(0,0,0,0.65), inset 0 0 0 6px #1b0f0b, inset 0 0 0 8px rgba(232,193,105,0.35);
        background: #e8d8b0;
        line-height: 0;
    }

    canvas { display: block; width: 100%; height: auto; cursor: crosshair; touch-action: none; }

    /* ---------------- Overlay ---------------- */
    .overlay {
        position: absolute; inset: 0;
        display: none;
        place-items: center;
        background: rgba(12,7,5,0.82);
        backdrop-filter: blur(4px);
        text-align: center;
        padding: 24px;
        line-height: 1.5;
    }
    .overlay.show { display: grid; }

    .card {
        max-width: 520px;
        padding: 26px 30px;
        border-radius: 16px;
        background: linear-gradient(180deg, rgba(56,32,24,0.98), rgba(26,15,11,0.98));
        border: 1px solid rgba(232,193,105,0.45);
        box-shadow: 0 20px 60px rgba(0,0,0,0.7);
    }

    .card h2 {
        font-size: 1.7rem; letter-spacing: 3px; margin-bottom: 6px;
        background: linear-gradient(90deg, #f4d68d, #e8c169, #b8892f);
        -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    }
    .card .sub { font-size: 0.75rem; letter-spacing: 1.5px; text-transform: uppercase; color: #9b8672; margin-bottom: 16px; }
    .card p { font-size: 0.86rem; color: #cbb99a; margin-bottom: 12px; }
    .card ul { text-align: left; margin: 14px auto 18px; max-width: 400px; font-size: 0.84rem; color: #cbb99a; }
    .card li { margin: 6px 0 6px 18px; }
    .card kbd {
        background: rgba(232,193,105,0.14); border: 1px solid rgba(232,193,105,0.35);
        border-radius: 4px; padding: 1px 6px; font-size: 0.75rem; color: #f2cf7a; font-family: inherit;
    }

    /* ---------------- Buttons ---------------- */
    button { font-family: inherit; cursor: pointer; border: none; }

    .btn {
        padding: 11px 22px;
        border-radius: 10px;
        font-size: 0.9rem;
        font-weight: 600;
        letter-spacing: 1px;
        color: #2a1a0e;
        background: linear-gradient(180deg, #f0d38a, #d3a63f);
        border: 1px solid rgba(255,240,200,0.5);
        box-shadow: 0 4px 0 #7d5f1e, 0 8px 18px rgba(0,0,0,0.4);
        transition: transform .08s ease, filter .15s ease;
    }
    .btn:hover { filter: brightness(1.08); }
    .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #7d5f1e; }
    .btn.ghost {
        background: rgba(255,255,255,0.05);
        color: #d9c6a4;
        border: 1px solid rgba(232,193,105,0.3);
        box-shadow: none;
    }
    .btn.ghost:hover { background: rgba(232,193,105,0.14); }
    .btn:disabled { opacity: .4; cursor: not-allowed; filter: grayscale(.6); }
    .btn.sm { padding: 8px 14px; font-size: 0.8rem; }

    /* ---------------- Side panel ---------------- */
    .panel {
        flex: 0 0 292px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        max-height: calc(100vh - 130px);
        overflow-y: auto;
        padding-right: 4px;
    }
    .panel::-webkit-scrollbar { width: 8px; }
    .panel::-webkit-scrollbar-thumb { background: rgba(232,193,105,0.28); border-radius: 8px; }

    .box {
        padding: 14px;
        border-radius: 14px;
        background: linear-gradient(180deg, rgba(52,30,22,0.92), rgba(26,15,11,0.92));
        border: 1px solid rgba(232,193,105,0.25);
        box-shadow: 0 8px 22px rgba(0,0,0,0.4);
    }

    .box h3 {
        font-size: 0.7rem;
        letter-spacing: 2.4px;
        text-transform: uppercase;
        color: var(--gold-dim);
        margin-bottom: 10px;
        display: flex; align-items: center; gap: 8px;
    }
    .box h3::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, rgba(232,193,105,0.35), transparent); }

    .tower-btn {
        width: 100%;
        display: flex; align-items: center; gap: 11px;
        padding: 9px 11px;
        margin-bottom: 7px;
        border-radius: 10px;
        text-align: left;
        color: var(--cream);
        background: rgba(255,255,255,0.04);
        border: 1px solid rgba(232,193,105,0.18);
        transition: all .13s ease;
    }
    .tower-btn:last-child { margin-bottom: 0; }
    .tower-btn:hover { background: rgba(232,193,105,0.12); border-color: rgba(232,193,105,0.5); }
    .tower-btn.active { background: rgba(232,193,105,0.2); border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold), 0 0 16px rgba(232,193,105,0.3); }
    .tower-btn.poor { opacity: .45; }

    .tico {
        flex: 0 0 34px; height: 34px;
        display: grid; place-items: center;
        font-size: 1.05rem; font-weight: 700;
        color: #fff6e2;
        border-radius: 8px;
        border: 1px solid rgba(0,0,0,0.45);
        text-shadow: 0 1px 2px rgba(0,0,0,0.7);
    }

    .tower-btn .nm { font-size: 0.88rem; font-weight: 600; }
    .tower-btn .ds { font-size: 0.68rem; color: #a08d75; }
    .tower-btn .cost { margin-left: auto; font-size: 0.82rem; font-weight: 700; color: #f2cf7a; font-variant-numeric: tabular-nums; }

    .row { display: flex; gap: 8px; }
    .row > * { flex: 1; }

    .kv { display: flex; justify-content: space-between; font-size: 0.78rem; padding: 3px 0; color: #c3b194; }
    .kv b { color: var(--cream); font-variant-numeric: tabular-nums; }

    .hint { font-size: 0.72rem; color: #9b8672; line-height: 1.5; margin-top: 8px; }

    .wave-preview { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
    .chip {
        display: flex; align-items: center; gap: 6px;
        font-size: 0.72rem; padding: 4px 9px 4px 5px;
        border-radius: 20px; background: rgba(0,0,0,0.35);
        border: 1px solid rgba(255,255,255,0.08);
        color: #cbb99a;
    }
    .chip i { width: 17px; height: 17px; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-size: 0.6rem; color: #fff; font-weight: 700; }

    .banner {
        text-align: center; font-size: 0.8rem; letter-spacing: 1px;
        color: #f2cf7a; min-height: 18px; margin-bottom: 8px;
    }

    /* ---------------- Wave count slider ---------------- */
    .wave-len {
        display: flex; align-items: center; gap: 8px;
        margin-bottom: 9px;
        font-size: 0.7rem; letter-spacing: .8px;
        color: #cbb99a;
    }
    .wave-len b {
        margin-left: auto;
        color: #f2cf7a; font-size: 0.78rem;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
    }
    .wave-len input[type=range] {
        flex: 1 1 auto; min-width: 0; height: 20px;
        -webkit-appearance: none; appearance: none;
        background: transparent; cursor: pointer;
    }
    .wave-len input[type=range]::-webkit-slider-runnable-track {
        height: 5px; border-radius: 3px;
        background: linear-gradient(90deg, rgba(232,193,105,0.85), rgba(168,135,60,0.35));
        border: 1px solid rgba(232,193,105,0.25);
    }
    .wave-len input[type=range]::-webkit-slider-thumb {
        -webkit-appearance: none; appearance: none;
        width: 15px; height: 15px; margin-top: -6px; border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, #fff3cf, #e8c169 60%, #a8873c);
        border: 1px solid #6d4f1c;
        box-shadow: 0 2px 6px rgba(0,0,0,0.55);
    }
    .wave-len input[type=range]::-moz-range-track {
        height: 5px; border-radius: 3px;
        background: rgba(232,193,105,0.5);
        border: 1px solid rgba(232,193,105,0.25);
    }
    .wave-len input[type=range]::-moz-range-thumb {
        width: 14px; height: 14px; border-radius: 50%;
        background: #e8c169; border: 1px solid #6d4f1c;
    }

    .speed-group { display: flex; gap: 6px; }
    .speed-group button {
        flex: 1; padding: 7px 0; border-radius: 8px; font-size: 0.78rem; font-weight: 600;
        color: #cbb99a; background: rgba(255,255,255,0.05); border: 1px solid rgba(232,193,105,0.2);
    }
    .speed-group button.on { background: rgba(232,193,105,0.9); color: #2a1a0e; border-color: var(--gold); }

    /* ---------------- Toast + save row ---------------- */
    .toast {
        position: absolute;
        left: 50%; top: 14px;
        transform: translate(-50%, -12px);
        z-index: 6;
        padding: 9px 18px;
        border-radius: 999px;
        font-size: 0.82rem;
        font-weight: 600;
        letter-spacing: .4px;
        color: #2a1a0e;
        background: linear-gradient(180deg, #f0d38a, #d3a63f);
        border: 1px solid rgba(255,240,200,0.6);
        box-shadow: 0 8px 22px rgba(0,0,0,0.45);
        opacity: 0;
        pointer-events: none;
        transition: opacity .2s ease, transform .2s ease;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    .toast.bad {
        background: linear-gradient(180deg, #e0715f, #a8322b);
        color: #fff3ea;
        border-color: rgba(255,200,190,0.5);
    }

    .saverow {
        display: flex;
        align-items: center;
        gap: 14px;
        margin: 16px 0 14px;
        padding: 12px 14px;
        border-radius: 12px;
        text-align: left;
        background: rgba(232,193,105,0.10);
        border: 1px solid rgba(232,193,105,0.32);
    }
    .savemeta { flex: 1; font-size: 0.78rem; color: #cbb99a; line-height: 1.55; }
    .savemeta b { color: #f2cf7a; }
    .savemeta span { font-size: 0.68rem; color: #8c7a63; }
    .saverow .btn { flex: 0 0 auto; white-space: nowrap; }

    @media (max-width: 1080px) {
        main { flex-direction: column; }
        .panel { flex: none; width: 100%; max-height: none; }
    }
</style>

function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);

}

// ------------------------------- Sound -----------------------------------
const Sfx = (() => {
    let ac = null, muted = false;
    function ensure() {
        if (!ac) {
            const AC = window.AudioContext || window.webkitAudioContext;
            if (AC) ac = new AC();

    }
    function tone(freq, dur, type, vol, slideTo) {

        o.frequency.setValueAtTime(freq, c.currentTime);
        if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), c.currentTime + dur);

        g.gain.linearRampToValueAtTime(vol == null ? 0.05 : vol, c.currentTime + 0.008);
        g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + dur);
        o.connect(g); g.connect(c.destination);
        o.start(); o.stop(c.currentTime + dur + 0.02);

// ------------------------------- State -----------------------------------
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');

let state, towers, enemies, shots, fx, floats, hover, selected;

function resetState() {
    state = {
        gold: 150,
        life: 20,
        wave: 0,
        t: 0,
        phase: 'prep',          // prep | running | over | won
        speed: 1,
        paused: false,
        betweenTimer: null,     // seconds until auto-start of next wave
        spawnQueue: [],
        spawnTimer: 0
    };
    towers = [];
    enemies = [];
    shots = [];
    fx = [];
    floats = [];
    hover = { c: -1, r: -1 };
    selected = null;
    clearBuildSelection();
}

let buildType = null;

// ------------------------------- Waves -----------------------------------
let waves = [];

function buildWaves() {
    waves = [];
    for (let w = 1; w <= totalWaves; w++) {
        const row = waveRow(w);
        const hpMul = waveHpMul(w);
        const countMul = waveCountMul(w);
        const list = [];
        for (const key of Object.keys(row)) {
            if (key === 'boss') continue;
            const count = Math.round(row[key] * countMul);
            const type = ENEMY_TYPES[key];
            for (let i = 0; i < count; i++) {
                list.push({ kind: key, hp: Math.round(type.hp * hpMul) });
            }
        }
        // shuffle so types arrive mixed
        for (let i = list.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [list[i], list[j]] = [list[j], list[i]];
        }
        if (row.boss) {
            const bossType = ENEMY_TYPES[row.boss];
            list.push({ kind: row.boss, hp: Math.round(bossType.hp * (1 + (w - 1) * 0.09)) });
        }
        waves.push({ number: w, list });
    }
}

// 第 w 波套用波表里的哪一行：走完一圈从头再来，同时难度升一档。
function waveRow(w) { return WAVE_TABLE[(w - 1) % WAVE_TABLE.length]; }
function waveTier(w) { return Math.floor((w - 1) / WAVE_TABLE.length); }
function waveCountMul(w) { return 1 + waveTier(w) * 0.3; }
function waveHpMul(w) {
    const pos = ((w - 1) % WAVE_TABLE.length) + 1;
    return (1 + (pos - 1) * 0.20) * (1 + waveTier(w) * 0.35);
}

function compositionOf(waveIndex) {
    const w = waveIndex + 1;
    if (w > totalWaves) return [];
    const row = waveRow(w);
    if (!row) return [];
    const countMul = waveCountMul(w);
    const out = [];
    for (const key of Object.keys(row)) {
        const kind = key === 'boss' ? row.boss : key;
        out.push({ kind, count: key === 'boss' ? 1 : Math.max(1, Math.round(row[key] * countMul)) });
    }
    return out;
}

// ------------------------------- Wave count ------------------------------
function clampWaveTotal(n) {
    return clamp(Math.round((Number(n) || WAVE_MIN) / WAVE_STEP) * WAVE_STEP, WAVE_MIN, WAVE_MAX);
}

function syncWaveTotal() {
    const input = el('waveTotal');
    if (!input) return;
    input.value = totalWaves;
    el('waveTotalVal').textContent = totalWaves;
}

// 滑块选的是整局的总波数：已经打过的波不动，多出来的部分重新生成。
function setWaveTotal(n) {
    const next = clampWaveTotal(n);
    if (next === totalWaves) { syncWaveTotal(); return; }
    if (next <= state.wave) {
        toast('总波数不能少于当前第 ' + state.wave + ' 波', true);
        syncWaveTotal();
        return;
    }
    totalWaves = next;
    buildWaves();
    savePrefs();
    syncWaveTotal();
    updateHud();
    renderWavePanel();
}

function compositionOf(waveIndex) {
    const row = WAVE_TABLE[waveIndex];
    if (!row) return [];
    const out = [];
    for (const key of Object.keys(row)) {
        const kind = key === 'boss' ? row.boss : key;
        out.push({ kind, count: key === 'boss' ? 1 : row[key] });
    }
    return out;
}

function startWave() {
    if (state.phase === 'over' || state.phase === 'won') return;
    if (state.phase === 'running') return;

    if (state.betweenTimer != null) {
        // Early-call bonus
        const bonus = 12 + state.wave * 4;
        addGold(bonus);
        pushFloat(W / 2, 60, '+' + bonus + ' 提前迎敌', '#f2cf7a');
        state.betweenTimer = null;
    }

    state.wave++;
    state.phase = 'running';
    state.spawnQueue = waves[state.wave - 1].list.slice();
    state.spawnTimer = 0.4;
    pushFloat(W / 2, 84, '第 ' + state.wave + ' 波', '#c0392b');
    updateHud();
    renderWavePanel();
    scheduleAutoSave();
}

function spawnNext() {
    if (!state.spawnQueue.length) return;
    const spec = state.spawnQueue.shift();
    const type = ENEMY_TYPES[spec.kind];
    enemies.push({
        kind: spec.kind,
        type,
        x: PATH[0].x, y: PATH[0].y,
        hp: spec.hp, maxHp: spec.hp,
        seg: 0,
        progress: 0,
        speed: type.speed,
        slowUntil: -99, slowFactor: 0,
        armor: type.armor,
        radius: type.radius,
        // bounties grow with the wave so income keeps pace with enemy HP
        reward: Math.round(type.reward * (1 + (state.wave - 1) * 0.12)),
        alive: true,
        phase: rand(0, Math.PI * 2)
    });
    state.spawnTimer = type.boss ? 2.0 : Math.max(0.38, 0.78 - state.wave * 0.018);
}

function onWaveCleared() {
    const bonus = 25 + state.wave * 10;
    addGold(bonus);
    pushFloat(W / 2, 110, '波次清空  +' + bonus, '#f2cf7a');

// ------------------------------- Economy ---------------------------------
function addGold(n) {

        showOverlay('gameover');
    }
}

// ------------------------------- Enemy logic -----------------------------
function moveEnemy(e, dist) {
    while (dist > 0) {
        const target = PATH[e.seg + 1];
        if (!target) { e.escaped = true; return; }
        const dx = target.x - e.x, dy = target.y - e.y;
        const d = Math.hypot(dx, dy);
        if (d <= dist) {
            e.x = target.x; e.y = target.y;
            e.seg++; dist -= d; e.progress += d;
        } else {
            e.x += dx / d * dist; e.y += dy / d * dist;
            e.progress += dist; dist = 0;
        }
    }
}

function damageEnemy(e, dmg) {
    if (!e.alive) return;
    const d = Math.max(1, dmg - e.armor);
    e.hp -= d;
    if (e.hp <= 0) killEnemy(e);
}

function killEnemy(e) {
    e.alive = false;
    addGold(e.reward);
    pushFloat(e.x, e.y - 12, '+' + e.reward, '#f2cf7a');
    for (let i = 0; i < (e.type.boss ? 26 : 9); i++) {
        fx.push({
            kind: 'p', x: e.x, y: e.y,
            vx: rand(-90, 90), vy: rand(-90, 40),
            life: rand(0.3, 0.7), max: 0.7,
            color: e.type.color, size: rand(2, 4)
        });
    }
    Sfx.coin();
}

function applySlow(e, factor, dur) {
    if (e.type.boss) dur *= 0.5;
    e.slowFactor = Math.max(e.slowFactor, factor);
    e.slowUntil = Math.max(e.slowUntil, state.t + dur);
}

function updateEnemies(dt) {
    for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        e.phase += dt * (e.kind === 'rider' ? 14 : 8);

        let mult = 1;
        if (state.t < e.slowUntil) mult = 1 - e.slowFactor;
        moveEnemy(e, e.speed * mult * dt);

        if (e.escaped) {
            const cost = e.type.boss ? 5 : 1;
            loseLife(cost);
            pushFloat(W - 70, PATH[PATH.length - 1].y - 22, '-' + cost + ' 城墙', '#e0715f');
            Sfx.leak();
            enemies.splice(i, 1);
            continue;
        }
        if (!e.alive) enemies.splice(i, 1);
    }

    if (state.phase === 'running' && !state.spawnQueue.length && !enemies.some(e => e.alive)) {
        onWaveCleared();
    }
}

// ------------------------------- Tower logic -----------------------------
function statsFor(typeKey, level) {
    const t = TOWER_TYPES[typeKey];
    const m = level - 1;
    return {
        damage:   Math.round(t.damage * Math.pow(1.40, m)),
        range:    Math.round(t.range * Math.pow(1.09, m)),
        rate:     t.rate * Math.pow(1.15, m),
        splash:   t.splash ? Math.round(t.splash * Math.pow(1.10, m)) : 0,
        slow:     t.slow ? Math.min(0.7, t.slow + m * 0.09) : 0,
        slowDur:  t.slowDur ? t.slowDur + m * 0.4 : 0,
        chain:    t.chain ? t.chain + m : 0
    };
}

function upgradeCostFor(typeKey, level) {
    return Math.round(TOWER_TYPES[typeKey].cost * 0.85 * Math.pow(1.75, level - 1));
}

function towerAt(c, r) {
    return towers.find(t => t.c === c && t.r === r) || null;
}

function canBuild(c, r) {
    if (c < 0 || c >= COLS || r < 0 || r >= ROWS) return false;
    if (BLOCKED.has(c + ',' + r)) return false;
    if (towerAt(c, r)) return false;
    return true;
}

function findTarget(tw, range) {
    let best = null, bestProgress = -1;
    const r2 = range * range;
    for (const e of enemies) {
        if (!e.alive) continue;
        if (dist2(e.x, e.y, tw.x, tw.y) > r2) continue;
        if (e.progress > bestProgress) { bestProgress = e.progress; best = e; }
    }
    return best;
}

function updateTowers(dt) {
    for (const tw of towers) {
        const s = tw.stats;
        tw.cd -= dt;
        const target = findTarget(tw, s.range);
        if (!target) continue;

        tw.aim = Math.atan2(target.y - tw.y, target.x - tw.x);

        if (tw.cd > 0) continue;
        tw.cd = 1 / s.rate;
        fire(tw, target);
    }
}

function fire(tw, target) {
    const s = tw.stats;
    const kind = TOWER_TYPES[tw.type].proj;
    const muzzleY = tw.y - 16;

    if (kind === 'bolt') {
        Sfx.zap();
        let cur = target, dmg = s.damage;
        const hitList = [cur];
        const pts = [{ x: tw.x, y: muzzleY }, { x: cur.x, y: cur.y }];
        damageEnemy(cur, dmg);
        for (let i = 0; i < s.chain - 1; i++) {
            let best = null, bd = 100 * 100;
            for (const e of enemies) {
                if (!e.alive || hitList.indexOf(e) !== -1) continue;
                const dd = dist2(e.x, e.y, cur.x, cur.y);
                if (dd < bd) { bd = dd; best = e; }
            }
            if (!best) break;
            dmg *= 0.75;
            damageEnemy(best, dmg);
            pts.push({ x: best.x, y: best.y });
            hitList.push(best);
            cur = best;
        }
        fx.push({ kind: 'bolt', pts, life: 0.18, max: 0.18 });
        return;
    }

    Sfx.shoot();
    shots.push({
        kind,
        x: tw.x, y: muzzleY,
        lx: target.x, ly: target.y,
        target,
        speed: kind === 'fire' ? 260 : kind === 'ice' ? 330 : 430,
        angle: tw.aim,
        stats: s,
        color: kind === 'fire' ? '#d35400' : kind === 'ice' ? '#5dade2' : '#8a5a2b'
    });
}

function updateShots(dt) {
    for (let i = shots.length - 1; i >= 0; i--) {
        const p = shots[i];
        let tx = p.lx, ty = p.ly;
        if (p.target && p.target.alive) {
            tx = p.target.x; ty = p.target.y;
            p.lx = tx; p.ly = ty;
        }
        const dx = tx - p.x, dy = ty - p.y;
        const d = Math.hypot(dx, dy) || 1;
        const step = p.speed * dt;
        p.angle = Math.atan2(dy, dx);

        if (d <= step) {
            p.x = tx; p.y = ty;
            impact(p);
            shots.splice(i, 1);
        } else {
            p.x += dx / d * step;
            p.y += dy / d * step;
        }
    }
}

function impact(p) {
    const s = p.stats;
    if (p.kind === 'fire') {
        Sfx.boom();
        fx.push({ kind: 'boom', x: p.x, y: p.y, r: s.splash, life: 0.35, max: 0.35 });
        for (const e of enemies) {
            if (e.alive && dist2(e.x, e.y, p.x, p.y) <= s.splash * s.splash) damageEnemy(e, s.damage);
        }
    } else if (p.kind === 'ice') {
        fx.push({ kind: 'frost', x: p.x, y: p.y, r: 22, life: 0.3, max: 0.3 });
        if (p.target && p.target.alive) {
            damageEnemy(p.target, s.damage);
            applySlow(p.target, s.slow, s.slowDur);
        }
    } else {
        if (p.target && p.target.alive) damageEnemy(p.target, s.damage);
        fx.push({ kind: 'p', x: p.x, y: p.y, vx: rand(-30, 30), vy: rand(-40, -10), life: 0.25, max: 0.25, color: '#7d5b34', size: 2 });
    }
}

// ------------------------------- Effects ---------------------------------
function pushFloat(x, y, text, color) {
    floats.push({ x, y, text, color, life: 1.3, max: 1.3 });
}

function updateFx(dt) {
    for (let i = fx.length - 1; i >= 0; i--) {
        const f = fx[i];
        f.life -= dt;
        if (f.life <= 0) { fx.splice(i, 1); continue; }
        if (f.kind === 'p') {
            f.x += f.vx * dt; f.y += f.vy * dt; f.vy += 260 * dt;
        }
    }
    for (let i = floats.length - 1; i >= 0; i--) {
        const f = floats[i];
        f.life -= dt;
        f.y -= 22 * dt;
        if (f.life <= 0) floats.splice(i, 1);
    }
}

// ------------------------------- Main update -----------------------------
function update(dt) {
    state.t += dt;

    if (state.phase === 'running') {
        if (state.spawnQueue.length) {
            state.spawnTimer -= dt;
            if (state.spawnTimer <= 0) spawnNext();
        }
    } else if (state.phase === 'prep') {
        if (state.betweenTimer != null) {
            state.betweenTimer -= dt;
            if (state.betweenTimer <= 0) { state.betweenTimer = null; startWave(); }
            else renderWavePanel();
        }
    }

    updateEnemies(dt);
    updateTowers(dt);
    updateShots(dt);
    updateFx(dt);
}

// ------------------------------- Background ------------------------------
function buildBackground() {
    bgCanvas = document.createElement('canvas');
    bgCanvas.width = W; bgCanvas.height = H;
    const b = bgCanvas.getContext('2d');

    // Parchment base
    const g = b.createLinearGradient(0, 0, W * 0.4, H);
    g.addColorStop(0, '#efe2c0');
    g.addColorStop(0.5, '#e6d5ae');
    g.addColorStop(1, '#dcc79b');
    b.fillStyle = g;
    b.fillRect(0, 0, W, H);

    // Fibrous paper noise
    for (let i = 0; i < 5200; i++) {
        b.fillStyle = 'rgba(' + (120 + Math.random() * 80 | 0) + ',' + (95 + Math.random() * 70 | 0) + ',' + (55 + Math.random() * 60 | 0) + ',' + (Math.random() * 0.05) + ')';
        b.fillRect(Math.random() * W, Math.random() * H, Math.random() * 3 + 1, 1);
    }

    // Distant ink-wash mountains along the top
    b.globalAlpha = 0.16;
    drawInkRange(b, 0, 150, '#4a5f66', 7, 190);
    b.globalAlpha = 0.11;
    drawInkRange(b, 120, 165, '#3c5259', 10, 150);
    b.globalAlpha = 1;

    // Red sun with a soft halo
    const sunX = 830, sunY = 74, sunR = 42;
    const halo = b.createRadialGradient(sunX, sunY, sunR * 0.4, sunX, sunY, sunR * 3.4);
    halo.addColorStop(0, 'rgba(192,57,43,0.30)');
    halo.addColorStop(1, 'rgba(192,57,43,0)');
    b.fillStyle = halo;
    b.beginPath(); b.arc(sunX, sunY, sunR * 3.4, 0, Math.PI * 2); b.fill();
    b.fillStyle = 'rgba(178,42,34,0.42)';
    b.beginPath(); b.arc(sunX, sunY, sunR, 0, Math.PI * 2); b.fill();

    // Stylised cloud scrolls
    b.globalAlpha = 0.2;
    drawCloud(b, 110, 58, 46); drawCloud(b, 300, 34, 34);
    drawCloud(b, 560, 66, 40); drawCloud(b, 700, 26, 28);
    b.globalAlpha = 1;

    // Pine / bamboo brush marks in quieter corners
    b.globalAlpha = 0.22;
    drawPine(b, 60, 588); drawPine(b, 906, 236); drawPine(b, 470, 588);
    b.globalAlpha = 1;

    // Faint build grid
    b.strokeStyle = 'rgba(139,111,60,0.13)';
    b.lineWidth = 1;
    for (let c = 1; c < COLS; c++) {
        b.beginPath(); b.moveTo(c * CELL + 0.5, 0); b.lineTo(c * CELL + 0.5, H); b.stroke();
    }
    for (let r = 1; r < ROWS; r++) {
        b.beginPath(); b.moveTo(0, r * CELL + 0.5); b.lineTo(W, r * CELL + 0.5); b.stroke();
    }

    // Vignette so the map feels aged
    const vg = b.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, H * 1.05);
    vg.addColorStop(0, 'rgba(120,85,40,0)');
    vg.addColorStop(1, 'rgba(90,60,25,0.30)');
    b.fillStyle = vg;
    b.fillRect(0, 0, W, H);
}

function drawInkRange(b, x0, baseY, color, peaks, spread) {
    b.fillStyle = color;
    b.beginPath();
    b.moveTo(x0, baseY);
    const span = W + spread;
    for (let i = 0; i <= peaks; i++) {
        const x = x0 + (i / peaks) * span;
        const h = 40 + ((i % 3) * 26) + Math.sin(i * 1.7) * 22;
        b.quadraticCurveTo(x - span / peaks * 0.5, baseY - h, x, baseY - h * 0.35);
    }
    b.lineTo(x0 + span, baseY + 120);
    b.lineTo(x0, baseY + 120);
    b.closePath();
    b.fill();
}

function drawCloud(b, x, y, s) {
    b.strokeStyle = '#5b6f76';
    b.lineWidth = 2.2;
    b.lineCap = 'round';
    b.beginPath();
    b.moveTo(x - s, y);
    b.bezierCurveTo(x - s * 0.55, y - s * 0.55, x - s * 0.1, y + s * 0.3, x + s * 0.35, y - s * 0.28);
    b.stroke();
    b.beginPath();
    b.moveTo(x + s * 0.3, y - s * 0.3);
    b.bezierCurveTo(x + s * 0.62, y - s * 0.72, x + s * 0.98, y - s * 0.2, x + s * 1.25, y + s * 0.12);
    b.stroke();
}

function drawPine(b, x, y) {
    b.strokeStyle = '#4c5b45';
    b.lineWidth = 3;
    b.lineCap = 'round';
    b.beginPath(); b.moveTo(x, y); b.quadraticCurveTo(x + 8, y - 40, x + 4, y - 74); b.stroke();
    b.lineWidth = 2;
    for (let i = 0; i < 5; i++) {
        const yy = y - 22 - i * 12;
        const w = 30 - i * 4;
        b.beginPath(); b.moveTo(x + 4, yy); b.quadraticCurveTo(x + 4 + w * 0.6, yy - 9, x + 4 + w, yy - 2); b.stroke();
        b.beginPath(); b.moveTo(x + 4, yy + 4); b.quadraticCurveTo(x + 4 - w * 0.6, yy - 5, x + 4 - w, yy + 2); b.stroke();
    }
}

// ------------------------------- Draw: world -----------------------------
function drawRoad() {
    ctx.save();
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    // Outer earthen berm
    ctx.strokeStyle = 'rgba(120,96,58,0.55)';
    ctx.lineWidth = 40;
    strokePath();

    // Road surface
    ctx.strokeStyle = '#cbb98d';
    ctx.lineWidth = 34;
    strokePath();

    // Worn centre
    ctx.strokeStyle = 'rgba(160,136,90,0.55)';
    ctx.lineWidth = 18;
    strokePath();

    // Stone dashes
    ctx.strokeStyle = 'rgba(120,100,62,0.42)';
    ctx.lineWidth = 3;
    ctx.setLineDash([9, 13]);
    strokePath();
    ctx.setLineDash([]);

    // Ruts along the edges
    ctx.strokeStyle = 'rgba(130,106,66,0.35)';
    ctx.lineWidth = 1.6;
    for (const off of [-13, 13]) {
        ctx.save();
        ctx.translate(0, off);
        ctx.beginPath();
        ctx.moveTo(PATH[0].x, PATH[0].y);
        for (let i = 1; i < PATH.length; i++) ctx.lineTo(PATH[i].x, PATH[i].y);
        ctx.stroke();
        ctx.restore();
    }
    ctx.restore();
}

function strokePath() {
    ctx.beginPath();
    ctx.moveTo(PATH[0].x, PATH[0].y);
    for (let i = 1; i < PATH.length; i++) ctx.lineTo(PATH[i].x, PATH[i].y);
    ctx.stroke();
}

function drawStageGate() {
    // Enemy entrance marker (left) and the gate at the end (right)
    const start = PATH[0], end = PATH[PATH.length - 1];

    ctx.save();
    ctx.globalAlpha = 0.75;
    ctx.fillStyle = '#6d1f1a';
    ctx.font = 'bold 15px ' + CJK;
    ctx.textAlign = 'center';
    ctx.fillText('敵', start.x + 46, start.y + 5);
    ctx.restore();

    // Great Wall gate at the exit
    drawGate(end.x - 26, end.y);
}

function drawGate(x, y) {
    ctx.save();
    ctx.translate(x, y);
    // wall body
    ctx.fillStyle = '#8d7a63';
    roundRect(ctx, -22, -34, 44, 68, 5); ctx.fill();
    ctx.fillStyle = '#7a6952';
    roundRect(ctx, -22, -34, 44, 10, 5); ctx.fill();
    // battlements
    ctx.fillStyle = '#8d7a63';
    for (let i = 0; i < 4; i++) ctx.fillRect(-22 + i * 12, -44, 8, 12);
    // gate arch
    ctx.fillStyle = '#3d2a1d';
    ctx.beginPath();
    ctx.moveTo(-11, 34); ctx.lineTo(-11, 2);
    ctx.arc(0, 2, 11, Math.PI, 0);
    ctx.lineTo(11, 34);
    ctx.closePath(); ctx.fill();
    // little banner
    ctx.fillStyle = '#a8322b';
    ctx.fillRect(16, -40, 3, 28);
    ctx.beginPath();
    ctx.moveTo(19, -40); ctx.lineTo(38, -33); ctx.lineTo(19, -25);
    ctx.closePath(); ctx.fill();
    ctx.restore();
}

// Each upgrade adds a storey: a wall topped by a flared, upturned-eave roof.
const TIERS = [
    { hw: 13.0, by: -6,  rh: 8.5 },
    { hw: 10.5, by: -16, rh: 7.5 },
    { hw: 8.0,  by: -25, rh: 6.5 }
];

function drawPagoda(x, y, tw) {
    const def = TOWER_TYPES[tw.type];

    ctx.save();
    ctx.translate(x, y);

    // ground shadow
    ctx.fillStyle = 'rgba(60,40,20,0.22)';
    ctx.beginPath(); ctx.ellipse(0, 12, 15, 5.5, 0, 0, Math.PI * 2); ctx.fill();

    // stone platform
    ctx.fillStyle = '#a8967c';
    roundRect(ctx, -13.5, 4, 27, 9, 2); ctx.fill();
    ctx.strokeStyle = 'rgba(70,50,28,0.55)';
    ctx.lineWidth = 1;
    roundRect(ctx, -13.5, 4, 27, 9, 2); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.20)';
    roundRect(ctx, -13.5, 4, 27, 3, 2); ctx.fill();

    // storeys, bottom to top
    for (let i = 0; i < tw.level; i++) {
        const t = TIERS[i];
        const bottom = (i === 0) ? 4 : TIERS[i - 1].by;
        const h = bottom - t.by;
        const w = t.hw * 1.30;

        // wall
        ctx.fillStyle = '#f0e2c6';
        ctx.fillRect(-w / 2, t.by, w, h);
        ctx.fillStyle = 'rgba(140,105,60,0.22)';
        ctx.fillRect(w / 2 - 2.6, t.by, 2.6, h);
        ctx.fillStyle = 'rgba(96,64,30,0.62)';
        ctx.fillRect(-w * 0.21, bottom - h * 0.58, w * 0.42, h * 0.44);
        ctx.strokeStyle = 'rgba(60,38,16,0.55)';
        ctx.lineWidth = 1;
        ctx.strokeRect(-w / 2, t.by, w, h);

        // roof
        ctx.fillStyle = def.roof;
        roof(t.hw, t.by, t.rh);
        ctx.strokeStyle = 'rgba(35,18,8,0.8)';
        ctx.lineWidth = 1.2;
        roof(t.hw, t.by, t.rh, true);

        // gilded ridge line
        ctx.strokeStyle = 'rgba(240,205,125,0.85)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(-t.hw * 0.86, t.by - t.rh * 0.30);
        ctx.quadraticCurveTo(0, t.by - t.rh * 0.96, t.hw * 0.86, t.by - t.rh * 0.30);
        ctx.stroke();
    }

    // finial spire
    const top = TIERS[tw.level - 1].by - TIERS[tw.level - 1].rh;
    ctx.strokeStyle = '#7d5f1e';
    ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(0, top + 1); ctx.lineTo(0, top - 5.5); ctx.stroke();
    ctx.fillStyle = '#e8c169';
    ctx.beginPath(); ctx.arc(0, top - 7, 3.1, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(60,36,10,0.85)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(0, top - 7, 3.1, 0, Math.PI * 2); ctx.stroke();

    // type badge on the platform
    ctx.fillStyle = def.color;
    ctx.beginPath(); ctx.arc(0, 9, 6.6, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(40,22,8,0.85)';
    ctx.lineWidth = 1.2; ctx.stroke();
    ctx.fillStyle = '#fff6e2';
    ctx.font = 'bold 9px ' + CJK;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(def.glyph, 0, 9.6);
    ctx.textBaseline = 'alphabetic';

    // aim indicator, floating by the finial
    if (tw.aim != null) {
        ctx.save();
        ctx.translate(0, top - 7);
        ctx.rotate(tw.aim);
        ctx.fillStyle = '#e8c169';
        ctx.strokeStyle = 'rgba(60,36,10,0.9)';
        ctx.lineWidth = 0.8;
        ctx.beginPath();
        ctx.moveTo(13.5, 0); ctx.lineTo(7, -3.2); ctx.lineTo(7, 3.2);
        ctx.closePath(); ctx.fill(); ctx.stroke();
        ctx.restore();
    }

    ctx.restore();
}

// Flared roof with upturned eaves.
function roof(halfW, baseY, h, strokeOnly) {
    ctx.beginPath();
    ctx.moveTo(-halfW, baseY - h * 0.16);
    ctx.quadraticCurveTo(-halfW * 0.42, baseY - h * 0.30, 0, baseY - h);
    ctx.quadraticCurveTo(halfW * 0.42, baseY - h * 0.30, halfW, baseY - h * 0.16);
    ctx.quadraticCurveTo(halfW * 0.55, baseY + h * 0.22, 0, baseY + h * 0.15);
    ctx.quadraticCurveTo(-halfW * 0.55, baseY + h * 0.22, -halfW, baseY - h * 0.16);
    ctx.closePath();
    if (strokeOnly) ctx.stroke(); else ctx.fill();
}

function drawEnemies() {
    for (const e of enemies) {
        if (!e.alive) continue;
        const bob = Math.sin(e.phase) * 1.6;
        const t = e.type;
        ctx.save();
        ctx.translate(e.x, e.y + bob);

        // shadow
        ctx.fillStyle = 'rgba(50,35,15,0.28)';
        ctx.beginPath(); ctx.ellipse(0, e.radius * 0.85 - bob, e.radius * 0.9, e.radius * 0.36, 0, 0, Math.PI * 2); ctx.fill();

        // slowed aura
        if (state.t < e.slowUntil) {
            ctx.strokeStyle = 'rgba(93,173,226,0.85)';
            ctx.lineWidth = 2;
            ctx.beginPath(); ctx.arc(0, 0, e.radius + 4, 0, Math.PI * 2); ctx.stroke();
        }

        // body
        ctx.fillStyle = t.color;
        ctx.beginPath(); ctx.arc(0, 0, e.radius, 0, Math.PI * 2); ctx.fill();
        ctx.lineWidth = t.boss ? 3 : 2;
        ctx.strokeStyle = t.edge;
        ctx.stroke();

        // glossy top
        ctx.fillStyle = 'rgba(255,255,255,0.20)';
        ctx.beginPath(); ctx.arc(-e.radius * 0.28, -e.radius * 0.32, e.radius * 0.45, 0, Math.PI * 2); ctx.fill();

        // glyph
        ctx.fillStyle = '#fff8ea';
        ctx.font = 'bold ' + Math.round(e.radius * 1.15) + 'px ' + CJK;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(t.glyph, 0, -1);
        ctx.textBaseline = 'alphabetic';

        // hp bar
        const bw = e.radius * 2.3, bh = 4;
        const pct = clamp(e.hp / e.maxHp, 0, 1);
        const by = -e.radius - 9;
        ctx.fillStyle = 'rgba(30,18,10,0.75)';
        roundRect(ctx, -bw / 2, by, bw, bh, 2); ctx.fill();
        ctx.fillStyle = pct > 0.5 ? '#5cb85c' : pct > 0.22 ? '#e0a83c' : '#c0392b';
        roundRect(ctx, -bw / 2, by, Math.max(1, bw * pct), bh, 2); ctx.fill();

        if (t.boss) {
            ctx.fillStyle = '#f2cf7a';
            ctx.font = 'bold 10px ' + UI;
            ctx.fillText(tr(t.name), 0, by - 5);
        }
        ctx.restore();
    }
}

function drawTowers() {
    for (const tw of towers) drawPagoda(tw.x, tw.y, tw);
}

function drawShots() {
    for (const p of shots) {
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.angle);
        if (p.kind === 'arrow') {
            ctx.strokeStyle = '#5d4222';
            ctx.lineWidth = 2.4;
            ctx.beginPath(); ctx.moveTo(-8, 0); ctx.lineTo(6, 0); ctx.stroke();
            ctx.fillStyle = '#8c6a3a';
            ctx.beginPath(); ctx.moveTo(9, 0); ctx.lineTo(3, -3); ctx.lineTo(3, 3); ctx.closePath(); ctx.fill();
        } else if (p.kind === 'fire') {
            const gr = ctx.createRadialGradient(0, 0, 1, 0, 0, 9);
            gr.addColorStop(0, '#fff3b0');
            gr.addColorStop(0.4, '#f39c12');
            gr.addColorStop(1, 'rgba(192,57,43,0)');
            ctx.fillStyle = gr;
            ctx.beginPath(); ctx.arc(0, 0, 9, 0, Math.PI * 2); ctx.fill();
        } else {
            ctx.fillStyle = '#aed6f1';
            ctx.strokeStyle = '#2e6da4';
            ctx.lineWidth = 1.2;
            ctx.beginPath();
            ctx.moveTo(7, 0); ctx.lineTo(0, -5); ctx.lineTo(-7, 0); ctx.lineTo(0, 5);
            ctx.closePath(); ctx.fill(); ctx.stroke();
        }
        ctx.restore();
    }
}

function drawFx() {
    for (const f of fx) {
        const a = clamp(f.life / f.max, 0, 1);
        ctx.save();
        ctx.globalAlpha = a;
        if (f.kind === 'boom') {
            const r = f.r * (1.25 - a * 0.55);
            const gr = ctx.createRadialGradient(f.x, f.y, 2, f.x, f.y, r);
            gr.addColorStop(0, 'rgba(255,240,180,0.95)');
            gr.addColorStop(0.45, 'rgba(230,126,34,0.7)');
            gr.addColorStop(1, 'rgba(192,57,43,0)');
            ctx.fillStyle = gr;
            ctx.beginPath(); ctx.arc(f.x, f.y, r, 0, Math.PI * 2); ctx.fill();
        } else if (f.kind === 'frost') {
            ctx.strokeStyle = 'rgba(133,193,233,0.95)';
            ctx.lineWidth = 2;
            const r = f.r * (1.6 - a);
            ctx.beginPath(); ctx.arc(f.x, f.y, r, 0, Math.PI * 2); ctx.stroke();
        } else if (f.kind === 'bolt') {
            ctx.strokeStyle = '#d6b3ff';
            ctx.shadowColor = '#9b59b6';
            ctx.shadowBlur = 14;
            ctx.lineWidth = 2.6;
            ctx.lineJoin = 'round';
            for (let i = 0; i < f.pts.length - 1; i++) {
                const p0 = f.pts[i], p1 = f.pts[i + 1];
                ctx.beginPath();
                ctx.moveTo(p0.x, p0.y);
                const segs = 5;
                for (let s = 1; s <= segs; s++) {
                    const tt = s / segs;
                    const jx = (s === segs) ? 0 : rand(-6, 6);
                    const jy = (s === segs) ? 0 : rand(-6, 6);
                    ctx.lineTo(p0.x + (p1.x - p0.x) * tt + jx, p0.y + (p1.y - p0.y) * tt + jy);
                }
                ctx.stroke();
            }
            ctx.shadowBlur = 0;
            ctx.fillStyle = '#fff';
            for (const p of f.pts) { ctx.beginPath(); ctx.arc(p.x, p.y, 2.4, 0, Math.PI * 2); ctx.fill(); }
        } else if (f.kind === 'p') {
            ctx.fillStyle = f.color;
            ctx.beginPath(); ctx.arc(f.x, f.y, f.size, 0, Math.PI * 2); ctx.fill();
        }
        ctx.restore();
    }

    for (const f of floats) {
        const a = clamp(f.life / f.max, 0, 1);
        ctx.save();
        ctx.globalAlpha = a;
        ctx.font = 'bold 15px ' + CJK;
        ctx.textAlign = 'center';
        ctx.lineWidth = 3;
        ctx.strokeStyle = 'rgba(255,248,230,0.85)';
        ctx.strokeText(tr(f.text), f.x, f.y);
        ctx.fillStyle = f.color;
        ctx.fillText(tr(f.text), f.x, f.y);
        ctx.restore();
    }
}

// ------------------------------- Draw: overlays --------------------------
function drawGridHint() {
    // Hover cell
    if (buildType && hover.c >= 0) {
        const ok = canBuild(hover.c, hover.r) && state.gold >= TOWER_TYPES[buildType].cost;
        ctx.save();
        ctx.globalAlpha = 0.85;
        ctx.fillStyle = ok ? 'rgba(232,193,105,0.55)' : 'rgba(192,57,43,0.35)';
        ctx.fillRect(hover.c * CELL + 2, hover.r * CELL + 2, CELL - 4, CELL - 4);
        ctx.strokeStyle = ok ? '#8a6a1e' : '#7d1f18';
        ctx.lineWidth = 1.6;
        ctx.strokeRect(hover.c * CELL + 2, hover.r * CELL + 2, CELL - 4, CELL - 4);
        if (ok) {
            const s = TOWER_TYPES[buildType];
            drawRange(( hover.c + 0.5) * CELL, (hover.r + 0.5) * CELL, s.range, 'rgba(232,193,105,0.85)');
        }
        ctx.restore();
    }

    // Selected tower range
    if (selected) {
        drawRange(selected.x, selected.y, selected.stats.range, 'rgba(192,57,43,0.8)');
        ctx.save();
        ctx.strokeStyle = '#6d1f1a';
        ctx.lineWidth = 2;
        ctx.setLineDash([5, 4]);
        ctx.strokeRect(selected.c * CELL + 1, selected.r * CELL + 1, CELL - 2, CELL - 2);
        ctx.setLineDash([]);
        ctx.restore();
    }
}

function drawRange(x, y, r, color) {
    ctx.save();
    ctx.fillStyle = color.replace(/[\d.]+\)$/, '0.10)');
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = color;
    ctx.lineWidth = 1.6;
    ctx.setLineDash([7, 6]);
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
}

function draw() {
    ctx.clearRect(0, 0, W, H);
    if (bgCanvas) ctx.drawImage(bgCanvas, 0, 0);

    drawStageGate();
    drawRoad();
    drawGridHint();
    drawTowers();
    drawEnemies();
    drawShots();
    drawFx();

    // Paused veil
    if (state.paused && state.phase !== 'over' && state.phase !== 'won') {
        ctx.save();
        ctx.fillStyle = 'rgba(20,12,8,0.45)';
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = '#f2cf7a';
        ctx.font = 'bold 34px ' + CJK;
        ctx.textAlign = 'center';
        ctx.fillText(tr('暫 停'), W / 2, H / 2);
        ctx.font = '13px ' + UI;
        ctx.fillStyle = '#e6d5ae';
        ctx.fillText('Press SPACE to resume', W / 2, H / 2 + 26);
        ctx.restore();
    }
}

        btn.classList.toggle('active', buildType === type);
    }

}

function renderBuildList() {
    const list = el('buildList');
    list.innerHTML = '';
    for (const key of TOWER_ORDER) {
        const t = TOWER_TYPES[key];
        const btn = document.createElement('button');
        btn.className = 'tower-btn';
        btn.dataset.type = key;
        btn.innerHTML =
            '<span class="tico" style="background:' + t.color + '">' + t.glyph + '</span>' +

            '<span class="cost">' + t.cost + '</span>';

        list.appendChild(btn);

function selectBuildType(key) {
    Sfx.unlock();
    buildType = (buildType === key) ? null : key;
    if (buildType) selected = null;
    updateHud();
    renderSelectedPanel();
}

function clearBuildSelection() {
    buildType = null;
    if (typeof document !== 'undefined') updateHud && updateHud();
}

function renderWavePanel() {
    const next = state.wave + 1;
    const banner = el('waveBanner');
    const prev = el('wavePreview');
    const btn = el('startWave');

    if (state.phase === 'won') {
        banner.textContent = '全勝！';
        prev.innerHTML = '';
        btn.disabled = true; btn.textContent = '已通关';
        return;
    }
    if (state.phase === 'over') {
        banner.textContent = '城墙失守';
        prev.innerHTML = '';
        btn.disabled = true; btn.textContent = '游戏结束';
        return;
    }

    if (state.phase === 'running') {
        const left = state.spawnQueue.length;
        banner.textContent = '第 ' + state.wave + ' 波进行中 · 剩余 ' + (left + enemies.length) + ' 敌';
        prev.innerHTML = '';
        btn.disabled = true; btn.textContent = '战斗中…';
        return;
    }

    // prep
    btn.disabled = false;
    if (state.betweenTimer != null) {
        banner.textContent = '下一波 ' + Math.ceil(state.betweenTimer) + ' 秒后来袭 · 提前召唤有奖赏';
        btn.textContent = '提前召唤 (+' + (12 + state.wave * 4) + ')';
    } else {
        banner.textContent = state.wave === 0 ? '布防完毕，准备迎敌' : '准备迎敌';
        btn.textContent = '开始第 ' + next + ' 波';
    }

    prev.innerHTML = '';
    const comp = compositionOf(state.wave); // next wave index
    let total = 0;
    for (const item of comp) {
        const t = ENEMY_TYPES[item.kind];
        total += item.count;
        const chip = document.createElement('span');
        chip.className = 'chip';
        chip.innerHTML = '<i style="background:' + t.color + '">' + t.glyph + '</i>' + t.name + ' ×' + item.count;
        prev.appendChild(chip);
    }
    if (!comp.length) prev.innerHTML = '<span class="chip">未知敌情</span>';
    else {
        const chip = document.createElement('span');
        chip.className = 'chip';
        chip.innerHTML = '共 ' + total + ' 敌';
        prev.appendChild(chip);
    }
}

function renderSelectedPanel() {
    const box = el('selBox');
    if (!selected) { box.style.display = 'none'; return; }
    box.style.display = '';
    const def = TOWER_TYPES[selected.type];
    const s = selected.stats;
    el('selName').textContent = def.name;
    el('selLevel').textContent = selected.level + ' / ' + MAX_LEVEL;
    el('selDmg').textContent = s.damage;
    el('selRange').textContent = s.range;
    el('selRate').textContent = s.rate.toFixed(2) + ' /s';

    const extraRow = el('selExtraRow');
    if (s.splash) { extraRow.style.display = ''; el('selExtraKey').textContent = '爆炸半径'; el('selExtraVal').textContent = s.splash; }
    else if (s.slow) { extraRow.style.display = ''; el('selExtraKey').textContent = '减速效果'; el('selExtraVal').textContent = Math.round(s.slow * 100) + '% · ' + s.slowDur.toFixed(1) + 's'; }
    else if (s.chain) { extraRow.style.display = ''; el('selExtraKey').textContent = '连锁目标'; el('selExtraVal').textContent = s.chain; }
    else { extraRow.style.display = 'none'; }

    const up = el('btnUpgrade');
    if (selected.level >= MAX_LEVEL) {
        up.disabled = true; up.textContent = '已满级';
    } else {
        const cost = upgradeCostFor(selected.type, selected.level);
        up.disabled = state.gold < cost;
        up.textContent = '升级 ' + cost;
    }
    el('btnSell').textContent = '拆除 +' + Math.floor(selected.invested * 0.7);
}

// ------------------------------- Persistence -----------------------------
const SAVE_KEY = 'gwd_save_v1';
const PREFS_KEY = 'gwd_prefs_v1';
const SAVE_VERSION = 1;

// Defensive localStorage wrapper — some sandboxed contexts block storage entirely.
const Store = (() => {
    let ok = null;
    function test() {
        if (ok === null) {
            try {
                window.localStorage.setItem('__gwd_probe__', '1');
                window.localStorage.removeItem('__gwd_probe__');
                ok = true;
            } catch (e) { ok = false; }
        }
        return ok;
    }
    return {
        get available() { return test(); },
        read(key) {
            if (!test()) return null;
            try { return window.localStorage.getItem(key); } catch (e) { return null; }
        },
        write(key, value) {
            if (!test()) return false;
            try { window.localStorage.setItem(key, value); return true; } catch (e) { return false; }
        },
        remove(key) {
            if (!test()) return;
            try { window.localStorage.removeItem(key); } catch (e) { /* ignore */ }
        }
    };
})();

function toast(msg, bad) {
    const t = el('toast');
    t.textContent = msg;
    t.classList.toggle('bad', !!bad);
    t.classList.add('show');
    clearTimeout(toast._timer);
    toast._timer = setTimeout(() => t.classList.remove('show'), 1900);
}

function savePrefs() {
    Store.write(PREFS_KEY, JSON.stringify({ speed: state.speed, muted: Sfx.muted, waves: totalWaves }));
}

function applyPrefs() {
    const raw = Store.read(PREFS_KEY);
    if (raw) {
        try {
            const p = JSON.parse(raw);
            if (p && p.speed >= 1 && p.speed <= 3) state.speed = p.speed;
            if (p && typeof p.muted === 'boolean') Sfx.setMuted(p.muted);
            if (p && typeof p.waves === 'number') totalWaves = clampWaveTotal(p.waves);
        } catch (e) { /* ignore corrupt prefs */ }
    }
    for (const btn of el('speedGroup').children) {
        btn.classList.toggle('on', Number(btn.dataset.speed) === state.speed);
    }
    el('btnMute').textContent = Sfx.muted ? '🔇 静音' : '🔊 音效';
    syncWaveTotal();
}

function serializeGame() {
    return {
        v: SAVE_VERSION,
        at: Date.now(),
        gold: state.gold,
        life: state.life,
        wave: state.wave,
        t: state.t,
        phase: state.phase === 'running' ? 'running' : 'prep',
        betweenTimer: state.betweenTimer,
        spawnTimer: state.spawnTimer,
        speed: state.speed,
        waves: totalWaves,
        spawnQueue: state.spawnQueue.map(s => ({ k: s.kind, h: s.hp })),
        towers: towers.map(t => ({ y: t.type, c: t.c, r: t.r, l: t.level, i: t.invested })),
        enemies: state.phase !== 'running' ? [] : enemies.filter(e => e.alive).map(e => {
            const next = PATH[e.seg + 1];
            const rest = next ? Math.hypot(next.x - e.x, next.y - e.y) : 0;
            return {
                k: e.kind,
                h: Math.round(e.hp),
                m: e.maxHp,
                s: e.seg,
                d: rest,
                f: e.slowFactor,
                u: Math.max(0, e.slowUntil - state.t)
            };
        })
    };
}

// Guards against hand-edited / stale / incompatible saves.
function validSave(d) {
    if (!d || d.v !== SAVE_VERSION) return false;
    if (typeof d.gold !== 'number' || typeof d.life !== 'number') return false;
    if (typeof d.wave !== 'number' || d.wave < 0 || d.wave > clampWaveTotal(d.waves)) return false;
    if (!Array.isArray(d.towers) || !Array.isArray(d.enemies)) return false;
    if (d.phase !== 'running' && d.phase !== 'prep') return false;

    const seen = new Set();
    for (const t of d.towers) {
        if (!t || !TOWER_TYPES[t.y]) return false;
        if (!Number.isInteger(t.c) || !Number.isInteger(t.r)) return false;
        if (t.c < 0 || t.c >= COLS || t.r < 0 || t.r >= ROWS) return false;
        if (BLOCKED.has(t.c + ',' + t.r)) return false;
        if (seen.has(t.c + ',' + t.r)) return false;
        if (!(t.l >= 1 && t.l <= MAX_LEVEL)) return false;
        seen.add(t.c + ',' + t.r);
    }
    for (const e of d.enemies) {
        if (!e || !ENEMY_TYPES[e.k]) return false;
        if (!Number.isInteger(e.s) || e.s < 0 || e.s > PATH.length - 2) return false;
    }
    return true;
}

function restoreGame(d) {
    resetState();

    totalWaves = clampWaveTotal(d.waves);
    buildWaves();
    state.gold = Math.max(0, Math.floor(d.gold));
    state.life = Math.max(1, Math.floor(d.life));
    state.wave = clamp(Math.floor(d.wave), 0, totalWaves);
    state.t = d.t || 0;
    state.spawnTimer = d.spawnTimer || 0;
    state.paused = false;
    syncWaveTotal();

    for (const t of d.towers) {
        const tw = {
            type: t.y,
            c: t.c,
            r: t.r,
            x: (t.c + 0.5) * CELL,
            y: (t.r + 0.5) * CELL,
            level: clamp(Math.floor(t.l), 1, MAX_LEVEL),
            cd: 0,
            invested: t.i || TOWER_TYPES[t.y].cost,
            aim: -Math.PI / 2
        };
        tw.stats = statsFor(tw.type, tw.level);
        towers.push(tw);
    }

    const rewardMul = 1 + (state.wave - 1) * 0.12;
    for (const e of d.enemies) {
        const type = ENEMY_TYPES[e.k];
        const seg = clamp(Math.floor(e.s), 0, PATH.length - 2);
        const a = PATH[seg], b = PATH[seg + 1];
        const len = Math.hypot(b.x - a.x, b.y - a.y) || 1;
        const rest = clamp(e.d || 0, 0, len);
        const ahead = len - rest;
        enemies.push({
            kind: e.k,
            type,
            x: a.x + (b.x - a.x) * (ahead / len),
            y: a.y + (b.y - a.y) * (ahead / len),
            hp: Math.min(e.h, e.m || type.hp),
            maxHp: e.m || type.hp,
            seg,
            progress: SEG_START[seg] + ahead,
            speed: type.speed,
            slowUntil: state.t + (e.u || 0),
            slowFactor: e.f || 0,
            armor: type.armor,
            radius: type.radius,
            reward: Math.round(type.reward * rewardMul),
            alive: true,
            phase: rand(0, Math.PI * 2)
        });
    }

    state.spawnQueue = (d.spawnQueue || [])
        .filter(s => s && ENEMY_TYPES[s.k])
        .map(s => ({ kind: s.k, hp: s.h }));

    state.phase = d.phase === 'running' ? 'running' : 'prep';
    // Give a restored run a fresh countdown so the player can re-orient.
    state.betweenTimer = state.phase === 'prep' && state.wave > 0
        ? Math.max(8, d.betweenTimer || 0)
        : null;

    selected = null;
    buildType = null;
    applyPrefs();
    hideOverlay();
    updateHud();
    renderWavePanel();
    renderSelectedPanel();
    el('btnPause').textContent = '暂停';
    return true;
}

function saveGame(quiet) {
    if (state.phase === 'over' || state.phase === 'won') return false;
    const okWrite = Store.write(SAVE_KEY, JSON.stringify(serializeGame()));
    if (!quiet) {
        if (okWrite) { Sfx.place(); toast('进度已保存 · 第 ' + state.wave + ' 波'); }

// ------------------------------- Loop ------------------------------------
let last = performance.now();

function frame(now) {
    if (!__alive) return;
    let dt = (now - last) / 1000;
    last = now;
    dt = Math.min(dt, 0.05);

    const running = state.phase === 'running' || state.phase === 'prep';
    if (!state.paused && running && !el('overlay').classList.contains('show')) {
        // Run `speed` sub-steps of the full frame delta: the game clock truly scales,
        // while small steps keep movement and collisions accurate.
        for (let i = 0; i < state.speed; i++) update(dt);
    } else {
        updateFx(dt * 0.5);
    }

    draw();

    // keep the wave banner in sync while a wave is live
    if (state.phase === 'running') renderWavePanel();
    if (selected) updateSelectedPanel();

    if (__alive) requestAnimationFrame(frame);
}

// ------------------------------- Boot ------------------------------------
function boot() {
    resetState();
    applyPrefs();          // the saved wave count has to be known before waves are built
    buildWaves();
    buildBackground();
    renderBuildList();
    renderSelectedPanel();
    updateHud();
    renderWavePanel();
    if (auto && readSave()) loadGame(); else showOverlay('start');
    if (__alive) requestAnimationFrame(frame);
}

    window.setTimeout = __nativeTimeout;
    for (const a of __captured) window.removeEventListener(a[0], a[1], a[2]);
    __captured.length = 0;
    for (const id of __timers) window.clearTimeout(id);
    __timers.length = 0;
    root.innerHTML = '';

// 键名统一按字母序排列，免得手写顺序出错
const FUSION_MAP = {};
for (const key of Object.keys(FUSIONS)) {
    FUSION_MAP[key.split('+').sort().join('+')] = FUSIONS[key];
}

function fusionOf(a, b) {
    return FUSION_MAP[[a, b].sort().join('+')] || null;
}

// ------------------------------- Sound -----------------------------------
const Sfx = (() => {
    let ac = null, muted = false;
    function ensure() {
        if (!ac) {
            const AC = window.AudioContext || window.webkitAudioContext;
            if (AC) ac = new AC();
        }
        if (ac && ac.state === 'suspended') ac.resume();
        return ac;
    }
    function tone(freq, dur, type, vol, slideTo) {
        if (muted) return;
        const c = ensure(); if (!c) return;
        const o = c.createOscillator(), g = c.createGain();
        o.type = type || 'square';
        o.frequency.setValueAtTime(freq, c.currentTime);
        if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), c.currentTime + dur);
        g.gain.setValueAtTime(0, c.currentTime);
        g.gain.linearRampToValueAtTime(vol == null ? 0.05 : vol, c.currentTime + 0.008);
        g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + dur);
        o.connect(g); g.connect(c.destination);
        o.start(); o.stop(c.currentTime + dur + 0.02);
    }
    return {
        unlock: ensure,
        plant:   () => tone(rand(190, 230), 0.12, 'sine', 0.06, 110),
        dig:     () => tone(320, 0.12, 'triangle', 0.05, 150),
        fuse:    () => { [520, 660, 880, 1170].forEach((f, i) => setTimeout(() => tone(f, 0.22, 'triangle', 0.05), i * 70)); },
        build:   () => { tone(190, 0.14, 'square', 0.05, 96); setTimeout(() => tone(430, 0.18, 'triangle', 0.05), 85); },
        zap:     () => tone(rand(880, 1320), 0.12, 'sawtooth', 0.04, 320),
        pea:     () => tone(rand(520, 580), 0.06, 'square', 0.018, 380),
        snow:    () => tone(rand(920, 1080), 0.08, 'triangle', 0.02, 620),
        collect: () => { tone(1180, 0.06, 'triangle', 0.035, 1580); },
        chomp:   () => tone(rand(85, 125), 0.13, 'sawtooth', 0.045, 55),
        groan:   () => tone(rand(150, 195), 0.42, 'sawtooth', 0.05, 58),
        mower:   () => tone(115, 0.6, 'sawtooth', 0.06, 240),
        boom:    () => tone(rand(100, 150), 0.34, 'sawtooth', 0.075, 32),
        horn:    () => { [196, 262, 233].forEach((f, i) => setTimeout(() => tone(f, 0.5, 'sawtooth', 0.06), i * 170)); },
        wave:    () => { tone(540, 0.16, 'triangle', 0.05, 760); setTimeout(() => tone(720, 0.2, 'triangle', 0.045, 900), 120); },
        boss:    () => { [110, 98, 87, 82].forEach((f, i) => setTimeout(() => tone(f, 0.6, 'sawtooth', 0.075), i * 240)); },
        win:     () => { [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => tone(f, 0.32, 'triangle', 0.07), i * 130)); },
        lose:    () => { [392, 311, 247, 165].forEach((f, i) => setTimeout(() => tone(f, 0.45, 'sawtooth', 0.07), i * 180)); },
        setMuted(v) { muted = v; },
        get muted() { return muted; }
    };
})();

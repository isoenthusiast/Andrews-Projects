});
document.getElementById('btnPause').addEventListener('click', () => {
  if (!sim) return;
  sim.paused = !sim.paused;
  document.getElementById('btnPause').textContent = sim.paused ? '▶' : '⏸';
});

function startSim() {
  stopSim();
  const design = makeDesign();
  const settings = simSettings();
  const chromoLen = new FeedForwardNetwork(design.netSizes).size;
  let population = Array.from({ length: settings.population }, () => {
    const c = [];
    for (let i = 0; i < chromoLen; i++) c.push(Math.random() * 2 - 1);
    return c;
  });

  let generation = 0;
  let bestEver = { fitness: 0, distance: 0, speed: 0, height: 0, airFraction: 0, chromosome: null };
  let elapsed = 0;
  let creatures = spawnPopulation(design, population);

  sim = {
    design, settings, population: null,
    task: currentTask(),
    generation: 0, elapsed: 0, creatures,
    bestEver, running: true, paused: false,
    speed: 1, genTime: 0,
  };
  updateTaskLabels();

  document.getElementById('btnEvolve').textContent = '⏹ Stop';
  document.getElementById('btnPause').textContent = '⏸';
  cam.x = 0; cam.y = 0; cam.scale = 80;
}

const DT = 1 / 60;
const SETTLE = 1.0; // seconds after spawn where muscles stay relaxed (creature lands & stands)

function stepSimulation() {
  if (!sim || !sim.running || sim.paused) return;
  const { design, settings } = sim;
  for (const c of sim.creatures) {
    if (sim.genTime > SETTLE) {
      runBrain(c, design);
    } else {
      // settle: keep muscles at rest length so the creature lands on its feet
      for (const m of c.muscleInfo) m.constraint.length = m.restLen;
    }
    c.x = c.jointBodies[0].position.x;
    if (c.x > c.bestX) c.bestX = c.x;
    // safety clamps so nothing can "rocket": linear + angular velocity, position step
    for (const b of c.jointBodies) clampSpeed(b, 15, 10);
  }
  Engine.update(design.engine, DT * 1000);
  for (const c of sim.creatures) {
    for (const b of c.jointBodies) clampStep(b, 0.35);
    updateCreatureStats(c, DT);
  }
  sim.elapsed += DT;
  sim.genTime += DT;
  if (sim.genTime >= settings.simTime) {
    endGeneration();
  }
}
function clampSpeed(body, max, maxAng) {
  const v = body.velocity;
  const sp = Math.hypot(v.x, v.y);
  if (sp > max) Body.setVelocity(body, { x: v.x / sp * max, y: v.y / sp * max });
  if (Math.abs(body.angularVelocity) > maxAng) {
    Body.setAngularVelocity(body, Math.sign(body.angularVelocity) * maxAng);
  }
}
function clampStep(body, max) {
  const dx = body.position.x - body.prevX, dy = body.position.y - body.prevY;
  const d = Math.hypot(dx, dy);
  if (d > max) {
    const s = max / d;
    Body.setPosition(body, { x: body.prevX + dx * s, y: body.prevY + dy * s });
  }
  body.prevX = body.position.x; body.prevY = body.position.y;
}

function updateCreatureStats(c, dt) {
  let lowY = Infinity, points = 0;
  for (const b of c.jointBodies) {
    const bottom = b.position.y + b.circleRadius;
    if (bottom < lowY) lowY = bottom;
    if (bottom >= GROUND_Y - 0.03) points += 1;
  }
  const height = Math.max(0, GROUND_Y - lowY);
  if (height > c.maxHeight) c.maxHeight = height;
  if (points === 0) c.airborneTime += dt;
  if (c.lastX === null) c.lastX = c.x;
  const dx = c.x - c.lastX;
  if (dx > 0) c.pathX += dx; // forward-only progress (ignores back-and-forth oscillation)
  c.lastX = c.x;
}

function creatureInputs(c, design, t) {
  const bodies = c.jointBodies;
  let vx = 0, vy = 0, lowY = Infinity, points = 0;
  for (const b of bodies) {
    vx += b.velocity.x; vy += b.velocity.y;
    const bottom = b.position.y + b.circleRadius;
    if (bottom < lowY) lowY = bottom;
    if (bottom >= GROUND_Y - 0.03) points += 1;
  }
  vx /= bodies.length; vy /= bodies.length;
  // body rotation = average direction of the bones
  let rot = 0;
  for (const bone of design.bones) {
    const ja = bodies[bone.ji], jb = bodies[bone.ji2];
    rot += Math.atan2(jb.position.y - ja.position.y, jb.position.x - ja.position.x);
  }
  rot /= design.bones.length;
  const angVel = c.prevAng === null ? 0 : (rot - c.prevAng) / DT;
  c.prevAng = rot;

  const inputs = [
    Math.max(0, GROUND_Y - lowY),   // distance from ground
    vx, vy, angVel, points, rot
  ];
  if (design.useClock) {
    const ph = t * 2 * Math.PI / 0.4;
    inputs.push(Math.sin(ph), Math.cos(ph)); // phase + quadrature -> any gait phase
  }
  return inputs;
}

function runBrain(c, design) {
  const inputs = creatureInputs(c, design, sim.elapsed);
  const outputs = c.net.forward(inputs);
  c.lastOutputs = outputs;
  // Each muscle is a springy actuator: the brain output shifts its target length.
  for (let i = 0; i < c.muscleInfo.length; i++) {
    const m = c.muscleInfo[i];
    const out = outputs[i] !== undefined ? outputs[i] : 0;
    let target = m.restLen * (1 + 0.6 * out);
    if (!m.canExpand && target > m.restLen) target = m.restLen; // can only contract
    const clamped = Math.max(0.05, target);
    // wake sleeping bodies when this muscle actually needs to move
    if (Math.abs(m.constraint.length - clamped) > 0.02 && Matter.Sleeping) {
      Matter.Sleeping.set(m.ja, false);
      Matter.Sleeping.set(m.jb, false);
    }
    m.constraint.length = clamped;
  }
}

function tournamentPick(pool, k) {
  let best = pool[Math.floor(Math.random() * pool.length)];
  for (let i = 1; i < k; i++) {
    const cand = pool[Math.floor(Math.random() * pool.length)];
    if (cand.fit > best.fit) best = cand;
  }
  return best;
}

function endGeneration() {
  const { design, settings, task } = sim;
  const creatures = sim.creatures;

  // fitness depends on the selected task
  for (const c of creatures) {
    c.x = c.jointBodies[0].position.x;
    const dist = Math.max(0, c.x - c.startX);
    c.distance = dist;
    let fitness;
    if (task === 'jumping') {
      fitness = c.maxHeight / MAX_JUMP_HEIGHT;
    } else if (task === 'flying') {
      const heightFit = Math.min(1, c.maxHeight / MAX_FLY_HEIGHT);
      const airFit = c.airborneTime / settings.simTime;
      c.airFraction = airFit;
      fitness = (heightFit + airFit) / 2;
    } else {
      // running: net distance + tiny forward-only bonus (helps early generations learn)
      fitness = (dist + 0.1 * c.pathX) / (MAX_DISTANCE * settings.simTime);
    }
    c.fitness = Math.max(0, Math.min(1, fitness));
    c.avgSpeed = dist / settings.simTime;
  }

  // sort ascending
  const sorted = creatures.slice().sort((a, b) => a.fitness - b.fitness);

  // update best-ever
  const best = sorted[sorted.length - 1];
  if (best.fitness > sim.bestEver.fitness) {
    sim.bestEver = {
      fitness: best.fitness, distance: best.distance, speed: best.avgSpeed,
      height: best.maxHeight, airFraction: best.airFraction || 0,
      chromosome: best.net.toChromosome(), creature: best
    };
  }

  // build next generation: tournament selection + elitism (+ occasional reseeds)
  const pool = sorted.map(c => ({ chrom: c.net.toChromosome(), fit: c.fitness }));
  const next = [];
  const eliteCount = Math.max(2, Math.floor(settings.population * 0.15));
  for (let i = 0; i < eliteCount && i < pool.length; i++) next.push(pool[pool.length - 1 - i].chrom);

  while (next.length < settings.population) {
    let child;
    if (Math.random() < 0.06) {
      // occasional full reseed -> escapes local optima
      child = [];
      for (let i = 0; i < pool[0].chrom.length; i++) child.push(Math.random() * 2 - 1);
    } else {
      const p1 = tournamentPick(pool, 3);
      const p2 = tournamentPick(pool, 3);
      child = onePointCrossover(p1.chrom, p2.chrom);
      child = mutateChromosome(child, settings.mutationRate);
    }
    next.push(child);
  }

  // cleanup old bodies
  for (const c of creatures) {
    for (const b of c.jointBodies) Composite.remove(design.engine.world, b);
  }

  sim.generation += 1;
  sim.genTime = 0;
  sim.elapsed = 0;
  sim.creatures = spawnPopulation(design, next);
}

// ---------- Rendering ----------
function drawBuild() {
  ctx.clearRect(0, 0, W(), H());
  // grid
  const gs = 1;
  const s = cam.scale;
  const x0 = Math.floor((cam.x - W() / 2 / s) / gs) * gs;
  const x1 = cam.x + W() / 2 / s;
  const y0 = Math.floor((cam.y - H() / 2 / s) / gs) * gs;
  const y1 = cam.y + H() / 2 / s;
  ctx.strokeStyle = 'rgba(255,255,255,0.04)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let x = x0; x <= x1; x += gs) {
    const p = w2s({ x, y: 0 }); ctx.moveTo(p.x, 0); ctx.lineTo(p.x, H());
  }
  for (let y = y0; y <= y1; y += gs) {
    const p = w2s({ x: 0, y }); ctx.moveTo(0, p.y); ctx.lineTo(W(), p.y);
  }
  ctx.stroke();

  // ground line
  const gA = w2s({ x: cam.x - 100, y: GROUND_Y }), gB = w2s({ x: cam.x + 100, y: GROUND_Y });
  ctx.strokeStyle = '#6b7c93'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(gA.x, gA.y); ctx.lineTo(gB.x, gB.y); ctx.stroke();
  ctx.fillStyle = 'rgba(107,124,147,0.5)'; ctx.font = '11px Segoe UI';
  ctx.fillText('ground', gA.x + 6, gA.y - 4);

  // muscles (under bones)
  for (const m of editor.muscles) {
    const ba = bById(m.boneA), bb = bById(m.boneB);
    if (!ba || !bb) continue;
    const c1 = boneCenter(ba), c2 = boneCenter(bb);
    const p1 = w2s(c1), p2 = w2s(c2);
    ctx.strokeStyle = '#e67e22'; ctx.lineWidth = 5;
    ctx.setLineDash([7, 5]);
    ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
    ctx.setLineDash([]);
  }

  // bones
  for (const b of editor.bones) {
    const ja = jById(b.a), jb = jById(b.b);
    if (!ja || !jb) continue;
    const p1 = w2s({ x: ja.x, y: ja.y }), p2 = w2s({ x: jb.x, y: jb.y });
    ctx.strokeStyle = '#8bc34a'; ctx.lineWidth = Math.max(3, b.thickness * s * 0.9);
    ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
  }

  // joints
  for (const j of editor.joints) {
    const p = w2s({ x: j.x, y: j.y });
    ctx.fillStyle = '#2e7d32'; ctx.strokeStyle = '#a5d6a7'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(p.x, p.y, Math.max(4, j.r * s), 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  }

  // pending preview
  if (pending) {
    const mp = mouseWorldPos();
    if (pending.kind === 'bone' && mp) {
      const p1 = w2s(pending.joint), p2 = w2s(mp);
      ctx.strokeStyle = 'rgba(139,195,74,0.6)'; ctx.lineWidth = 4; ctx.setLineDash([5, 4]);
      ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke(); ctx.setLineDash([]);
    }
  }

  ctx.fillStyle = 'rgba(255,255,255,0.55)'; ctx.font = '12px Segoe UI';
  ctx.fillText(`Tool: ${tool}${pending ? ' — pick target' : ''}`, 12, H() - 10);
}

let mouseWorldPos = () => null;
function onTrackMouseMove(e) {
  const rect = canvas.getBoundingClientRect();
  mouseWorldPos = () => s2w({ x: e.clientX - rect.left, y: e.clientY - rect.top });
}
window.addEventListener('mousemove', onTrackMouseMove);

function drawSim() {
  ctx.clearRect(0, 0, W(), H());
  if (!sim) { drawBuild(); return; }

  const design = sim.design;
  // focus on the creature that's currently farthest along
  let best = sim.creatures[0];
  for (const c of sim.creatures) if ((c.x - c.startX) > (best.x - best.startX)) best = c;
  if (sim.genTime > 0.2) {
    // ease camera to best creature
    const tx = best.x, ty = GROUND_Y - 1.2;
    cam.x += (tx - cam.x) * 0.12;
    cam.y += (ty - cam.y) * 0.08;
  } else {
    cam.x = best.x; cam.y = GROUND_Y - 1.2;
  }

  // ground + distance markers
  const gA = w2s({ x: cam.x - 60, y: GROUND_Y }), gB = w2s({ x: cam.x + 60, y: GROUND_Y });
  ctx.strokeStyle = '#5b6b80'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(gA.x, gA.y); ctx.lineTo(gB.x, gB.y); ctx.stroke();

  ctx.fillStyle = 'rgba(120,140,160,0.8)'; ctx.font = '11px Segoe UI';
  const mStart = Math.floor((cam.x - 60) / 5) * 5;
  for (let x = mStart; x < cam.x + 60; x += 5) {
    const p = w2s({ x, y: GROUND_Y });
    ctx.strokeStyle = (Math.round(x) % 25 === 0) ? 'rgba(255,255,255,0.35)' : 'rgba(255,255,255,0.12)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x, p.y - 18); ctx.stroke();
    if (Math.round(x) % 25 === 0) ctx.fillText(x + 'm', p.x - 10, p.y - 22);
  }

  // creatures
  for (const c of sim.creatures) {
    drawCreature(c);
  }
}

function drawCreature(c) {
  const s = cam.scale;
  const design = sim.design;

  // muscles (between bone midpoints)
  for (let i = 0; i < c.muscleInfo.length; i++) {
    const m = c.muscleInfo[i];
    const ba = design.bones[m.boneAIdx], bb = design.bones[m.boneBIdx];
    const a1 = c.jointBodies[ba.ji], a2 = c.jointBodies[ba.ji2];
    const b1 = c.jointBodies[bb.ji], b2 = c.jointBodies[bb.ji2];
    const ma = { x: (a1.position.x + a2.position.x) / 2, y: (a1.position.y + a2.position.y) / 2 };
    const mb = { x: (b1.position.x + b2.position.x) / 2, y: (b1.position.y + b2.position.y) / 2 };
    const p1 = w2s(ma), p2 = w2s(mb);
    const out = c.lastOutputs ? c.lastOutputs[i] : 0;
    const alpha = Math.min(1, Math.abs(out) * 1.5);
    if (out < 0) ctx.strokeStyle = `rgba(239,83,80,${0.4 + alpha * 0.6})`; // contract = red
    else ctx.strokeStyle = `rgba(66,165,245,${0.4 + alpha * 0.6})`;        // expand = blue
    ctx.lineWidth = 2 + alpha * 4;
    ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
  }

  // bones (lines between joints)
  for (const b of design.bones) {
    const ja = c.jointBodies[b.ji], jb = c.jointBodies[b.ji2];
    const p1 = w2s(ja.position), p2 = w2s(jb.position);
    ctx.strokeStyle = '#8bc34a';
    ctx.lineWidth = Math.max(3, b.thickness * s * 0.9);
    ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
  }

  // joints
  for (const b of c.jointBodies) {
    const p = w2s(b.position);
    ctx.fillStyle = '#2e7d32'; ctx.strokeStyle = '#c8e6c9'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(p.x, p.y, Math.max(3.5, b.circleRadius * s), 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  }
}

// ---------- HUD ----------
function updateHUD() {
  const el = document.getElementById('hud');
  if (!sim) {
    el.innerHTML = '';
    return;
  }
  const t = sim.task;
  let best = sim.creatures[0];
  for (const c of sim.creatures) if ((c.x - c.startX) > (best.x - best.startX)) best = c;
  const bestDist = Math.max(0, best.x - best.startX);
  const ev = sim.bestEver;
  let curLine, everLine;
  if (t === 'running') {
    curLine = `current best — fitness <b>${(best.fitness * 100).toFixed(1)}%</b> · ${bestDist.toFixed(1)} m`;
    everLine = `best ever — fitness <b>${(ev.fitness * 100).toFixed(1)}%</b> · ${ev.distance.toFixed(1)} m · ${ev.speed.toFixed(2)} m/s`;
  } else if (t === 'jumping') {
    curLine = `current best — fitness <b>${(best.fitness * 100).toFixed(1)}%</b> · height ${best.maxHeight.toFixed(1)} m`;
    everLine = `best ever — fitness <b>${(ev.fitness * 100).toFixed(1)}%</b> · height ${ev.height.toFixed(1)} m`;
  } else {
    const airCur = best.airborneTime / Math.max(sim.genTime, 0.001);
    curLine = `current best — fitness <b>${(best.fitness * 100).toFixed(1)}%</b> · height ${best.maxHeight.toFixed(1)} m · air ${(airCur * 100).toFixed(0)}%`;
    everLine = `best ever — fitness <b>${(ev.fitness * 100).toFixed(1)}%</b> · height ${ev.height.toFixed(1)} m · air ${(ev.airFraction * 100).toFixed(0)}%`;
  }
  el.innerHTML = `
    <div class="gen">Generation ${sim.generation} · ${t}</div>
    <div>⏱ gen time: <b>${sim.genTime.toFixed(1)}</b> / ${sim.settings.simTime}s</div>
    <div class="k">${curLine}</div>
    <div class="k">${everLine}</div>`;
}

// ---------- Main loop ----------
let rafId = 0, lastTime = performance.now();
function loop(now) {
  const dtReal = Math.min(0.05, (now - lastTime) / 1000);
  lastTime = now;

  if (sim) {
    // advance simulation with speed multiplier (fixed 60 Hz steps)
    sim.speed = parseInt(document.querySelector('.btn[data-speed].on')?.dataset.speed) || 1;
    const steps = Math.max(1, Math.round(sim.speed * dtReal * 60));
    for (let s = 0; s < Math.min(steps, 48); s++) {
      try {
        stepSimulation();
      } catch (e) {
        console.error('sim step error:', e);
        stopSim();
        break;
      }
      if (!sim || !sim.running || sim.paused) break;
    }
  }

  if (mode === 'sim' && sim) drawSim();
  else if (mode === 'sim') { drawBuild(); }
  else drawBuild();

  if (mode === 'build') {
    document.getElementById('stGen').textContent = '0';
  }
  if (sim) {
    let best = sim.creatures[0];
    for (const c of sim.creatures) if ((c.x - c.startX) > (best.x - best.startX)) best = c;
    const bestDist = Math.max(0, best.x - best.startX);
    document.getElementById('stGen').textContent = sim.generation;
    document.getElementById('stFit').textContent = (sim.bestEver.fitness * 100).toFixed(1) + '%';
    if (sim.task === 'running') {
      document.getElementById('stDist').textContent = sim.bestEver.distance.toFixed(1) + ' m';
      document.getElementById('stSpeed').textContent = sim.bestEver.speed.toFixed(2) + ' m/s';
    } else {
      document.getElementById('stDist').textContent = sim.bestEver.height.toFixed(1) + ' m';
      document.getElementById('stSpeed').textContent = (sim.bestEver.airFraction * 100).toFixed(0) + '%';
    }
    updateHUD();
  }

  rafId = requestAnimationFrame(loop);
}

// speed buttons
document.querySelectorAll('[data-speed]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('[data-speed]').forEach(b => b.classList.remove('on'));
    btn.classList.add('on');
  });
});
document.querySelector('[data-speed="3"]').classList.add('on');

// mutation slider display
const mutSlider = document.getElementById('inpMut');
mutSlider.addEventListener('input', () => document.getElementById('mutVal').textContent = parseFloat(mutSlider.value).toFixed(2));
document.getElementById('mutVal').textContent = parseFloat(mutSlider.value).toFixed(2);

// task buttons
function currentTask() {
  return document.querySelector('[data-task].on')?.dataset.task || 'running';
}
function updateTaskLabels() {
  const t = currentTask();
  document.getElementById('statDistLabel').textContent = t === 'running' ? 'Best distance' : 'Best height';
  document.getElementById('statSpeedLabel').textContent = t === 'running' ? 'Best speed' : 'Air time';
}
document.querySelectorAll('[data-task]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('[data-task]').forEach(b => b.classList.remove('on'));
    btn.classList.add('on');
    if (sim) stopSim();
  });
});
updateTaskLabels();

// restore saved creature (if any) when the page loads
loadDesign();
updateCounts();

updateCounts();
rafId = requestAnimationFrame(loop);

  return function stop() {
    if (sim) stopSim();
    cancelAnimationFrame(rafId);
    window.removeEventListener('resize', resize);
    window.removeEventListener('mousemove', onEditorMouseMove);
    window.removeEventListener('mouseup', onMouseUp);
    window.removeEventListener('keydown', onKeyDown);
    window.removeEventListener('mousemove', onTrackMouseMove);
  };
};


</script>

<script>
(function () {
    'use strict';

    /* Shell: mount one game at a time and tear it down cleanly. */
    var TITLES = {
        cubes: "Cubes Adventures",
        evolution: "Evolution — Creature Simulator"
    };
    var HOME_TITLE = "Andrew's Game Collection — Cubes Adventures & Evolution";

    var picker = document.getElementById('picker');
    var viewport = document.getElementById('viewport');
    var switchBtn = document.getElementById('switchBtn');
    var note = document.getElementById('note');
    var stopFn = null;

    function unmount() {
        if (stopFn) {
            try { stopFn(); } catch (e) { /* game already torn down */ }
            stopFn = null;
        }
        viewport.innerHTML = '';
    }

    function mount(mode) {
        var tpl = document.getElementById('tpl-' + mode);
        if (!tpl || !window.__GAMES || !window.__GAMES[mode]) return;
        note.textContent = '';
        unmount();
        viewport.appendChild(tpl.content.cloneNode(true));
        try {
            stopFn = window.__GAMES[mode](viewport) || null;
        } catch (e) {
            stopFn = null;
            unmount();
            note.textContent = 'Could not start this game (' + mode + '): ' + (e && e.message ? e.message : e);
            return;
        }
        picker.hidden = true;
        switchBtn.hidden = false;
        document.title = TITLES[mode];
    }

    function showPicker() {
        unmount();
        note.textContent = '';
        picker.hidden = false;
        switchBtn.hidden = true;
        document.title = HOME_TITLE;
    }

    Array.prototype.forEach.call(document.querySelectorAll('.pk-card'), function (card) {
        card.addEventListener('click', function () { mount(card.dataset.mode); });
    });
    switchBtn.addEventListener('click', showPicker);
    document.title = HOME_TITLE;
})();
</script>
